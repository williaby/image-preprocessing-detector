# GitGuardian configuration file
# https://docs.gitguardian.com/ggshield-docs/reference/gitguardian-yaml

version: 2

# Paths to exclude from secret scanning
secret:
  ignored_paths:
    # Test fixtures with intentional fake credentials for CodeQL validation
    - "tests/security/test_codeql_validation.py"
    # Test API keys in test fixtures
    - "tests/api/test_auth_ratelimit.py"
    - "tests/api/test_app_coverage.py"
    - "tests/api/test_middleware_coverage.py"
    # Logging redaction tests with example sensitive data
    - "tests/unit/logging/test_logging_framework.py"
    - "tests/integration/logging/test_logging_integration.py"
    # Documentation and schema examples
    - "docs/**/*.md"
    - "docs/**/*.json"
    # Modal configuration (references secrets by name, not values)
    - "modal/**/*.py"
    # Scripts that read tokens from environment (not hardcoded)
    - "scripts/**/*.py"

  # Allow specific patterns that are commonly false positives
  ignored_matches:
    # Used in tests/api/ test fixtures for auth middleware testing only
    - name: "test-api-keys"
      match: "test-key-[0-9a-f]{8}"
    # Used in tests/api/test_auth_ratelimit.py fixture constants only
    - name: "valid-key-patterns"
      match: "valid-test-key-[0-9a-f]{8}"
    # Placeholder tokens in documentation examples
    - name: "placeholder-tokens"
      match: "your_token_here"
    # AWS example key from official AWS documentation (not a real credential)
    - name: "aws-example-key"
      match: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
