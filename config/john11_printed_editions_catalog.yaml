# John 1:1 Printed Editions Catalog
# Parallel dataset to john11_manuscript_catalog.yaml (handwritten)
#
# Numbering: 1000-series Greek, 2000-series Latin, 3000-series Ethiopic,
#   4000-series Armenian, 5000-series Syriac, 6000-series Arabic,
#   7000-series Cyrillic, 8000-series Coptic, 9000-series Gothic,
#   10000-series Georgian, 11000-series Old English, 12000-series CJK,
#   13000-series South Asian, 14000-series SE Asian, 15000-series Tibetan
#
# Fields:
#   edition_name: Common scholarly name
#   date_range: Publication date or range
#   institution: Source institution key (matches licenses YAML)
#   script_iso15924: ISO 15924 code
#   ml_class: ML training class
#   ood_reserved: Whether this script is OOD-reserved
#   print_technology: movable_type_letterpress, lithography, offset, digital, typewriter
#   typography: blackletter, roman_serif, italic, sans_serif, native_script, mixed
#   font_family: Specific font if known (null otherwise)
#   source_url: URL for the digital collection / IA item page
#   iiif_manifest_url: IIIF manifest URL if known (null otherwise)
#   license: License string
#   license_verified: Whether redistribution license is verified
#   harvest_phase: 1 (verified-open), 2 (needs verification)
#   harvest_source: Which sub-command harvests this item
#   content_type: "printed" (always for this catalog)
#   text_direction: ltr, rtl, ttb
#   language_name: Human-readable language name
#   ia_item_id: Internet Archive item identifier (null for non-IA sources)
#   notes: Scholarly context

