# John 1:1 Multi-Script Manuscript Catalog
# Structured from tmp_cleanup/john_11.md
#
# Only manuscripts from license-verified institutions (see john11_source_licenses.yaml)
# are included in Phase 1. Unverified sources are listed with harvest_phase: 2+.
#
# Script codes: ISO 15924
# ML class mapping: see config/script_ml_classes.yaml
# OOD-reserved scripts: Armn, Geor, Goth (excluded from training, used for OOD eval)
#
# Fields:
#   manuscript_name: Common scholarly name
#   ga_number: Gregory-Aland number (Greek MSS only, null otherwise)
#   date_range: Approximate date or century
#   institution: Holding institution
#   script_iso15924: ISO 15924 code
#   ml_class: ML training class (from script_ml_classes.yaml)
#   ood_reserved: Whether this script is OOD-reserved
#   script_style: Paleographic style (uncial, minuscule, insular, etc.)
#   source_url: URL for the digital collection page
#   iiif_manifest_url: IIIF manifest URL if known (null otherwise)
#   license: License string
#   license_verified: Whether redistribution license is verified
#   harvest_phase: 1 (verified-open), 2 (needs verification), null (blocked)
#   harvest_source: Which sub-command harvests this item
#   content_type: handwritten (always for manuscripts)
#   text_direction: ltr, rtl, ttb
#   notes: Scholarly context

