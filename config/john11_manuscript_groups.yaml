# Manuscript groups for john11-manuscripts dataset
# Each group = one physical codex; all images in a group go to the same split
# Generated by scripts/build_manuscript_groups_john11.py
#
# Usage: assign entire groups to train/val to prevent near-duplicate leakage.
# Images from the same physical manuscript share hand, parchment, and degradation.
#
