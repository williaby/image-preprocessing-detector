# Author: Zhou Xingsi (周興嗣), compiled ca. 520 CE, Liang dynasty
# 250 lines of 4 characters each = 1,000 unique characters
# Used for L2 text_content.full_text (tier_0_exact, confidence 1.0)
#
# Format: Each line has zh (4 Classical Chinese chars), pinyin, en (translation)
# Lines are grouped into rhyming couplets (2 lines each = 125 couplets)
#
