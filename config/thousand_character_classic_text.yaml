full_text_zh: >-
  天地玄黃宇宙洪荒日月盈昃辰宿列張寒來暑往秋收冬藏閏餘成歲律呂調陽
  雲騰致雨露結為霜金生麗水玉出崑岡劍號巨闕珠稱夜光果珍李柰菜重芥薑
  海鹹河淡鱗潛羽翔龍師火帝鳥官人皇始制文字乃服衣裳推位讓國有虞陶唐
  弔民伐罪周發殷湯坐朝問道垂拱平章愛育黎首臣伏戎羌遐邇壹體率賓歸王
  鳴鳳在竹白駒食場化被草木賴及萬方蓋此身髮四大五常恭惟鞠養豈敢毀傷
  女慕貞潔男效才良知過必改得能莫忘罔談彼短靡恃己長信使可覆器欲難量
  墨悲絲染詩讚羔羊景行維賢克念作聖德建名立形端表正空谷傳聲虛堂習聽
  禍因惡積福緣善慶尺璧非寶寸陰是競資父事君曰嚴與敬孝當竭力忠則盡命
  臨深履薄夙興溫凊似蘭斯馨如松之盛川流不息淵澄取映容止若思言辭安定
  篤初誠美慎終宜令榮業所基藉甚無竟學優登仕攝職從政存以甘棠去而益詠
  樂殊貴賤禮別尊卑上和下睦夫唱婦隨外受傅訓入奉母儀諸姑伯叔猶子比兒
  孔懷兄弟同氣連枝交友投分切磨箴規仁慈隱惻造次弗離節義廉退顛沛匪虧
  性靜情逸心動神疲守真志滿逐物意移堅持雅操好爵自縻都邑華夏東西二京
  背邙面洛浮渭據涇宮殿盤鬱樓觀飛驚圖寫禽獸畫彩仙靈丙舍傍啟甲帳對楹
  肆筵設席鼓瑟吹笙升階納陛弁轉疑星右通廣內左達承明既集墳典亦聚群英
  杜稿鍾隸漆書壁經府羅將相路俠槐卿戶封八縣家給千兵高冠陪輦驅轂振纓
  世祿侈富車駕肥輕策功茂實勒碑刻銘磻溪伊尹佐時阿衡奄宅曲阜微旦孰營
  桓公匡合濟弱扶傾綺迴漢惠說感武丁俊乂密勿多士寔寧晉楚更霸趙魏困橫
  假途滅虢踐土會盟何遵約法韓弊煩刑起翦頗牧用軍最精宣威沙漠馳譽丹青
  九州禹跡百郡秦并嶽宗泰岱禪主云亭雁門紫塞雞田赤城昆池碣石鉅野洞庭
  曠遠綿邈巖岫杳冥治本於農務茲稼穡俶載南畝我藝黍稷稅熟貢新勸賞黜陟
  孟軻敦素史魚秉直庶幾中庸勞謙謹敕聆音察理鑒貌辨色貽厥嘉猷勉其祗植
  省躬譏誡寵增抗極殆辱近恥林皋幸即兩疏見機解組誰逼索居閒處沉默寂寥
  求古尋論散慮逍遙欣奏累遣戚謝歡招渠荷的歷園莽抽條枇杷晚翠梧桐早凋
  陳根委翳落葉飄搖游鯤獨運凌摩絳霄耽讀玩市寓目囊箱易輶攸畏屬耳垣牆
  具膳餐飯適口充腸飽飫烹宰飢厭糟糠親戚故舊老少異糧妾御績紡侍巾帷房
  紈扇圓潔銀燭煒煌晝眠夕寐藍筍象床弦歌酒宴接杯舉觴矯手頓足悅豫且康
  嫡後嗣續祭祀烝嘗稽顙再拜悚懼恐惶箋牒簡要顧答審詳骸垢想浴執熱願涼
  驢騾犢特駭躍超驤誅斬賊盜捕獲叛亡布射僚丸嵇琴阮嘯恬筆倫紙鈞巧任釣
  釋紛利俗並皆佳妙毛施淑姿工顰妍笑年矢每催曦暉朗曜璇璣懸斡晦魄環照
  指薪修祜永綏吉劭矩步引領俯仰廊廟束帶矜莊徘徊瞻眺孤陋寡聞愚蒙等誚
  謂語助者焉哉乎也

full_text_en: >-
  Heaven and earth, dark and yellow; the cosmos, vast and desolate.
  Sun and moon, waxing and waning; stars and constellations, spread and arrayed.
  Cold comes, heat goes; autumn harvests, winter stores.
  Intercalary months complete the year; musical pitches harmonize with yang.
  Clouds rise to bring rain; dew condenses into frost.
  Gold is born in beautiful waters; jade comes from Kungang.
  The sword called Juque; the pearl known as Night-Shining.
  Precious fruits: plums and crabapples; important vegetables: mustard and ginger.
  The sea is salty, rivers are fresh; fish dive, birds soar.
  Dragon Master, Fire Emperor; Bird Official, Human Sovereign.
  They began creating writing; then came clothing and garments.
  Yielding the throne, ceding the state: Yu and Tang of the line of Tao.
  Comforting the people, punishing the guilty: King Fa of Zhou, King Tang of Yin.
  Sitting in court, inquiring of the Way; ruling effortlessly, bringing order.
  Lovingly nurturing the common people; subjects submitting, even the Rong and Qiang.
  Far and near, one body; all guests return to the king.
  Phoenixes sing in the bamboo; white colts graze in the meadow.
  Transformation covers the grasses and trees; its blessings reach all directions.
  This body and its hair come from the four elements and five constants.
  Respectfully cherish your upbringing; dare not damage or injure.
  Women admire chastity and purity; men emulate talent and virtue.
  Know your faults and always correct them; gain ability and never forget it.
  Do not speak of others' shortcomings; do not rely on your own strengths.
  Trustworthiness should be verifiable; one's capacity is hard to measure.
  Mo Zi grieved over dyed silk; the Odes praised the lambskin.
  Emulate virtuous conduct; strive to be a sage in thought.
  Build virtue, establish a name; keep form upright, appearance correct.
  An empty valley carries sound; a vacant hall echoes.
  Disaster comes from accumulated evil; fortune follows from doing good.
  A foot of jade is not the treasure; an inch of time is what to compete for.
  Serve your father, serve your lord, with strictness and respect.
  In filial piety, exhaust your strength; in loyalty, devote your life.
  Treading on thin ice over deep water; rising early, keeping parents warm and cool.
  Like orchids in fragrance; like pines in flourishing.
  Rivers flow without ceasing; deep pools reflect clearly.
  In demeanor, appear thoughtful; in speech, be calm and steady.
  Be sincere and fine at the start; be careful and proper at the end.
  The foundation of glory and enterprise; its basis is vast beyond measure.
  When learning excels, enter government service; hold office and join in governance.
  Preserve like the sweet pear tree; depart and be praised even more.
  Joy differs between noble and humble; rites distinguish high and low.
  Above harmonious, below respectful; husband leads, wife follows.
  Outside, receive the tutor's instruction; inside, follow the mother's example.
  All the aunts, uncles, and elders; treat nephews and nieces as your own children.
  Brothers share deep bonds; of one breath, connected branches.
  In friendship, share commitments; polish and admonish each other.
  Benevolence, compassion, and sympathy; never depart from these, even in haste.
  Integrity, righteousness, modesty, and deference; never diminish these, even in hardship.
  When nature is calm, emotions are at ease; when the heart stirs, the spirit tires.
  Hold to truth and your will is full; chase things and your purpose shifts.
  Firmly maintain refined conduct; good rank will come of itself.
  The great cities of China; the two capitals, East and West.
  Backed by Mang, facing Luo; floating on the Wei, set upon the Jing.
  Palaces rise in lush splendor; towers and pavilions soar startlingly.
  Paintings depict birds and beasts; colors portray immortals and spirits.
  Side chambers open beside; curtained halls face the pillars.
  Banquets are spread with mats; drums, zithers, and reed organs play.
  Ascending the steps to the throne; caps turn like revolving stars.
  Right passage to the inner quarters; left leads to the Hall of Light.
  Classics and canons are gathered; talented scholars are assembled.
  Du Cao's drafts, Zhong's clerical script; lacquered writings, wall sutras.
  Officials arrayed: generals and ministers; flanking the lanes, ministers by the scholar trees.
  Households enfeoffed in eight counties; families supplied with a thousand soldiers.
  Tall caps accompany the imperial chariot; carriages surge, tassels flutter.
  Hereditary wealth and luxury; carriages sleek, horses light.
  Meritorious deeds richly recorded; inscribed on steles and carved in stone.
  Pan Xi and Yi Yin; aiding their times, the Grand Steward.
  Dwelling at Qufu; who but Dan could have built it?
  Duke Huan united and corrected; aiding the weak, supporting the faltering.
  Qi turned back the Han and the Hui; Yue's persuasion moved King Wu Ding.
  Outstanding talents served diligently; many scholars brought genuine peace.
  Jin and Chu competed for supremacy; Zhao and Wei were hemmed in.
  Borrowing a road to destroy Guo; treading the soil at the covenant assembly.
  He Zun upheld the law; Han's legacy burdened by harsh punishment.
  Qi Jian, Po, and Mu; their military use was the most brilliant.
  Proclaiming might across the desert; fame racing through painted history.
  The nine provinces bear Yu's traces; a hundred commanderies under Qin's union.
  The sacred peak Mount Tai; the altar of Zen at Cloud Pavilion.
  Wild Goose Gate, the Purple Pass; Cock Field, the Red Walls.
  Kunming Pool, Jieshi Rock; the Great Wilds, Dongting Lake.
  Vast and far, stretching endlessly; cliffs and peaks, dark and deep.
  Governance is rooted in agriculture; attend to planting and harvesting.
  Begin plowing the southern fields; I plant millet and grain.
  When taxes are ripe, offer the new harvest; encourage with rewards, demote and promote.
  Mencius valued simplicity; Shi Yu held to uprightness.
  Strive for the Mean; be diligent, humble, and careful.
  Listen to sounds, examine principles; observe appearance, discern character.
  Bequeath excellent plans; encourage earnest cultivation.
  Examine yourself with admonition; favor and excess lead to extremes.
  Disgrace and humiliation draw near shame; the forest and marsh are fortunate retreats.
  The two Shu perceived the moment; who compelled them to resign?
  Dwell in solitude, abide in leisure; in silence and stillness.
  Seek the ancients, explore their words; scatter worries, wander carefree.
  Joyful melodies dispel sorrow; sorrows depart, happiness beckons.
  Lotus channels, water lilies; gardens overgrown, tendrils reaching.
  Loquats green in late season; parasol trees wither early.
  Old roots hidden in shadow; fallen leaves drift and sway.
  The great fish swims alone; soaring, brushing the crimson sky.
  Lost in reading at the market; eyes fixed on the book satchel.
  Easy and light are what we fear; walls have ears.
  Prepare meals and serve food; suit the palate, fill the belly.
  When sated, cook and slaughter; when hungry, even dregs and husks suffice.
  Relatives and old friends; old and young get different fare.
  Concubines spin and weave; attendants serve in chambers.
  Round fans of fine silk; silver candles gleaming bright.
  Daytime sleep, evening slumber; blue bamboo mats, ivory beds.
  String songs and wine banquets; raising cups and lifting goblets.
  Clapping hands and stamping feet; in joy and ease and health.
  Legitimate heirs carry on the line; sacrificial rites of winter and autumn.
  Kowtow and bow again; with awe, fear, and trepidation.
  Letters and documents should be concise; replies should be thorough.
  When the body is dirty, think of bathing; when hot, wish for coolness.
  Donkeys, mules, calves, and bulls; startled, they leap and prance.
  Execute and behead thieves and bandits; capture and seize rebels and fugitives.
  Bu Yi's archery, Liao Wan's ball play; Ji Kang's zither, Ruan Ji's whistling.
  Tian's brush, Lun's paper; Jun's ingenuity, Ren's fishing.
  Release disputes for common benefit; all are fine and wonderful.
  Mao Qiang and Xi Shi's beauty; artful frowns, lovely smiles.
  Years fly like arrows, always pressing; the sun's glow shines brightly.
  The celestial armillary sphere revolves; the dark moon's phases cycle in light.
  Point to the firewood to prolong blessings; forever peaceful, auspicious, and good.
  Measured steps, leading the way; looking up and down in the corridors of state.
  Bound sashes, dignified and solemn; lingering, gazing afar.
  Lonely and ignorant, few in learning; foolish and benighted, subject to ridicule.
  These are the grammatical particles: yan, zai, hu, ye.

