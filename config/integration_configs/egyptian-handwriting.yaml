# Egyptian Handwriting dataset integration config
# Source: OmarMDiab/Egyptian-Handwriting-Dataset (HuggingFace)
# License: CC-BY-4.0
# Samples: 11,216 Arabic cursive word images from 89 writers (ages 6-73)
# Format: Parquet (image blob + label columns)

dataset_name: egyptian-handwriting
is_synthetic: false
known_capture_method: scanner_flatbed

# Language/script are uniform across the entire dataset
doc_language: ar
doc_script: Arab

# Versioning
script_version: "1.1.0"
enrichment_version_tag: integrated_v2
enrichment_version_number: 2

ki_config:
  apply_ki_001_layout_casing: false  # Word-level crops, no layout detection
  layout_source: docling
  apply_ki_002_table_override: false  # No tables in word crops
  apply_ki_003_figure_override: false  # No figures in word crops
  apply_ki_004_handwriting_override: false  # 100% handwriting by definition
  apply_ki_005_capture_override: true
  apply_ki_006_formula_override: false  # No formulas
  apply_ki_008_script_family: false  # Uniform Arabic script

vlm_corrections:
  table_true_positives: []
  figure_true_positives: []
  formula_true_positives: []
  handwriting_true_positives: []
