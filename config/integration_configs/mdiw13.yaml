# MDIW-13 dataset integration config
# Source: Multi-Domain Images of Words (13 scripts)
# Samples: ~290,000 word-level images
# Primary use: Script detection training

dataset_name: mdiw13
is_synthetic: false
known_capture_method: null  # Mixed sources

# Multi-script dataset - no single documentation language
# Let LLM/OpenLID resolve per-sample

# Versioning
script_version: "1.1.0"
enrichment_version_tag: integrated_v2
enrichment_version_number: 2

ki_config:
  apply_ki_001_layout_casing: true
  layout_source: docling
  apply_ki_002_table_override: false  # Word-level images - no tables
  apply_ki_003_figure_override: false  # Word-level images - no figures
  apply_ki_004_handwriting_override: true
  apply_ki_005_capture_override: false  # Mixed capture methods
  apply_ki_006_formula_override: false  # Word-level images - no formulas
  apply_ki_008_script_family: true

vlm_corrections:
  table_true_positives: []
  figure_true_positives: []
  formula_true_positives: []
  handwriting_true_positives: []
