# nbconvert Windows-only uncontrolled search path vulnerability
# - Affects only Windows when running `jupyter nbconvert --to pdf`
# - Exploits Windows PATH lookup for inkscape.bat in current directory
# - Linux/macOS not affected (different executable resolution behavior)
# - This project runs on Linux CI and Linux production servers
[[IgnoredVulns]]
id = "GHSA-xm59-rqc7-hhvf"
reason = "Windows-only vulnerability (CWE-427) - this project runs on Linux"

