# Format: [[IgnoredVulns]] with id and reason fields

# ============================================================================
# py Library - CVE Disputed
# ============================================================================
# CVE-2022-42969 is marked as DISPUTED in NVD (disputed May 2024)
# Multiple third parties argue this is not a valid/reproducible vulnerability
# The py library is deprecated and only used by interrogate (docstring coverage tool)
# Impact: Low - not used in production code, only in dev tooling
#
# Note: This vulnerability appears in OSV database under multiple IDs:
# - GHSA-w596-4wvx-j9j6 (GitHub Advisory)
# - PYSEC-2022-42969 (PyPI Advisory)
# Both refer to the same disputed CVE-2022-42969

[[IgnoredVulns]]
id = "GHSA-w596-4wvx-j9j6"
reason = "CVE-2022-42969 disputed by multiple parties as not reproducible. Formal dispute added to NVD May 2024. Library only used by interrogate dev tool."

