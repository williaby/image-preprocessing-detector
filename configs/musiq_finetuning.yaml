# MUSIQ Fine-Tuning Configuration
# ================================
# Sharpness Specialist for DIQA Pseudo-Labeling Ensemble
#
# Reference:
#   - docs/planning/DIQA-5000_Pseudo_Labels_v2.md Section 4.4A1
#   - docs/planning/MUSIQ_FINETUNING_PLAN.md
#
# Training Protocol:
#   - Phase 1 (10 epochs): Head warmup with frozen backbone
#   - Phase 2 (20 epochs): Full fine-tuning with differential LRs

# Model Architecture
head_hidden_dim: 256
dropout: 0.1

# Phase 1: Head Training (Backbone Always Frozen)
# Note: Extended to 30 epochs since we skip Phase 2 due to OOM issues
# with full fine-tuning on A10G GPU
phase1_epochs: 30
phase1_lr: 0.001  # 1e-3
phase1_warmup_epochs: 3  # Linear warmup per consensus
phase1_freeze_backbone: true

# Phase 2: DISABLED - Full fine-tuning causes OOM on A10G
# The score-encoder approach works well with frozen backbone
phase2_epochs: 0  # Skip Phase 2
phase2_backbone_lr: 0.00001  # 1e-5 - not used
phase2_head_lr: 0.0001  # 1e-4 - not used
phase2_warmup_epochs: 3  # not used

# Training
batch_size: 8  # Reduced for MUSIQ multi-scale patch memory requirements
gradient_accumulation_steps: 4  # Effective batch size = 8 * 4 = 32
weight_decay: 0.0001  # 1e-4
gradient_clip_norm: 1.0
num_workers: 4

# Loss Weights (Sharpness Specialist)
# Overall: 0.2 (secondary)
# Sharpness: 0.6 (PRIMARY)
# Color: 0.2 (secondary)
loss_weights:
  overall: 0.2
  sharpness: 0.6
  color: 0.2

# Loss Component Weights (per Section 4.3)
# MSE: 60%, Rank: 20%, Focal: 20%
mse_weight: 0.6
rank_weight: 0.2
focal_weight: 0.2

# Checkpoint Selection (Weighted SRCC + ECE Scoring)
# Preset options: srcc_dominant, balanced, calibration_aware
checkpoint_preset: balanced  # 70% SRCC, 30% ECE, ±0.02 band
checkpoint_interval: 5

# Early Stopping
early_stopping_patience: 10
early_stopping_metric: srcc_sharpness

# LR Schedule
lr_schedule: warmup_cosine  # Linear warmup + cosine decay

# Data Augmentation
use_augmentation: true
