# Modal Training Configuration - Phase 2 IQA
# Image Quality Assessment with ResNet Teacher-Student Architecture
# Teacher: ResNet-50 (high-capacity, selective inference)
# Student: ResNet-18 (production default, fast inference)

model:
  # Teacher-student architecture
  teacher_architecture: resnet50
  student_architecture: resnet18
  pretrained: true
  num_classes: 6  # noise, blur, skew, perspective, contrast, orientation
  input_size: 224
  dropout: 0.2

  # Knowledge distillation parameters
  distillation:
    temperature: 4.0  # Softmax temperature for distillation
    alpha: 0.7  # Weight for distillation loss (1-alpha for hard labels)
    use_soft_labels: true

  # Selective teacher inference (Phase 2 - production use)
  teacher_inference:
    enabled: false  # Disabled by default in production (budget control)
    uncertainty_threshold: 0.3  # Trigger teacher if student entropy > 0.3
    discrepancy_threshold: 0.2  # Trigger if classical vs student disagreement > 0.2
    high_risk_documents: true  # Always use teacher for flagged high-risk docs
    max_pages_per_batch: 100  # Budget control for teacher inference

  # Device priority execution
  device_priority:
    - cuda:0  # Local GPU (first choice)
    - cpu     # Local CPU (fallback)
    - modal   # Modal GPU (requires budget, last resort)

training:
  batch_size: 128  # T4 16GB can handle this
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 10
  gradient_clip_norm: 1.0
  mixed_precision: true  # AMP for faster training

data:
  dataset_path: gs://image_detection_b/datasets/iqa_phase2
  num_workers: 4
  pin_memory: true
  augmentation_preset: medium  # light, medium, heavy

storage:
  checkpoint_path: gs://image_detection_b/checkpoints/phase2_iqa
  output_path: gs://image_detection_b/models/phase2_iqa
  log_path: gs://image_detection_b/logs/phase2_iqa

modal:
  gpu: T4  # T4, A10, or A100
  cpu: 8.0  # cores
  memory: 32768  # MB (32 GB)
  timeout: 86400  # 24 hours
  image_python_version: "3.12"

monitoring:
  tensorboard: true
  log_interval: 100  # steps
  checkpoint_interval: 5  # epochs
