# Modal Training Configuration - Phase 3 YOLOv8
# Layout Detection (tables, images, handwriting, formulas)

model:
  architecture: yolov8n  # yolov8n (fast) or yolov8s (accurate)
  num_classes: 4  # table, image, handwriting, formula
  input_size: 640
  pretrained: true

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  warmup_epochs: 3
  optimizer: adamw
  weight_decay: 0.0005
  mixed_precision: true

data:
  dataset_path: gs://image_detection_b/datasets/layout_phase3
  dataset_yaml: gs://image_detection_b/datasets/layout_phase3/dataset.yaml
  num_workers: 8
  cache_images: true

storage:
  checkpoint_path: gs://image_detection_b/checkpoints/phase3_yolov8
  output_path: gs://image_detection_b/models/phase3_yolov8
  log_path: gs://image_detection_b/logs/phase3_yolov8

modal:
  gpu: A10  # A10 recommended (24GB) for YOLOv8
  cpu: 16.0
  memory: 65536  # 64GB
  timeout: 259200  # 72 hours (3 days)
  image_python_version: "3.12"

monitoring:
  tensorboard: true
  save_period: 10  # epochs
