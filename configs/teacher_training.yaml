# Teacher Model Training Configuration - Phase 3: ResNet-50 Multi-Head IQA
# This configuration is for training the high-capacity teacher model used for
# difficult/high-risk pages in the document preprocessing pipeline.

experiment:
  name: "phase3_teacher_resnet50"
  description: "ResNet-50 multi-head teacher model for document IQA"
  version: "1.0.0"
  phase: "3"

# Model architecture configuration
model:
  architecture: "resnet50"  # ResNet-50 backbone
  pretrained: true  # Use ImageNet pretrained weights
  freeze_backbone: false  # Allow backbone fine-tuning

  # Multi-head configuration
  num_heads: 5  # blur, noise, skew, illumination, artifacts
  hidden_features: 512  # Hidden layer size for each head
  dropout: 0.2  # Dropout probability

  # Input configuration
  input_size: 224  # Image size (224x224) - ImageNet standard
  num_channels: 3  # RGB images

  # Issue types (must match model.ISSUE_TYPES)
  issue_types:
    - "blur"
    - "noise"
    - "skew"
    - "illumination"
    - "artifacts"

# Training hyperparameters
training:
  # Optimizer configuration
  optimizer: "adamw"  # AdamW optimizer
  learning_rate: 0.001  # Initial learning rate (1e-3)
  weight_decay: 0.01  # L2 regularization

  # Learning rate scheduler
  scheduler:
    type: "cosine"  # Cosine annealing
    min_lr: 0.00001  # Minimum learning rate (1e-5)
    warmup_epochs: 5  # Optional warmup period

  # Training parameters
  batch_size: 32  # Batch size per GPU
  epochs: 50  # Maximum number of epochs
  gradient_clip_norm: 1.0  # Gradient clipping threshold
  gradient_accumulation_steps: 1  # Accumulate gradients over N steps

  # Early stopping
  early_stopping_patience: 5  # Stop if no improvement for 5 epochs

  # Mixed precision training (AMP)
  mixed_precision:
    enabled: true  # Use automatic mixed precision
    dtype: "float16"  # FP16 precision

# Loss function configuration
loss:
  type: "multi_head_iqa"  # MultiHeadIQALoss

  # Loss component weights
  classification_weight: 1.0  # Weight for BCE loss
  confidence_weight: 0.5  # Weight for MSE loss

  # Per-head weights (prioritize critical issues)
  head_weights:
    blur: 1.5  # Critical for OCR quality
    noise: 1.0  # Moderate importance
    skew: 1.5  # Critical for layout detection
    illumination: 1.2  # Important for text recognition
    artifacts: 0.8  # Less critical

  # Reduction method
  reduction: "mean"  # Average loss over batch

# Dataset configuration
dataset:
  # Dataset paths (to be configured for specific environment)
  train_path: "/data/iqa_train"  # Path to training data
  val_path: "/data/iqa_val"  # Path to validation data
  test_path: "/data/iqa_test"  # Path to test data

  # Data splits
  train_split: 0.70  # 70% training
  val_split: 0.15  # 15% validation
  test_split: 0.15  # 15% test

  # Data loading
  num_workers: 4  # Number of data loading workers
  pin_memory: true  # Pin memory for faster GPU transfer
  prefetch_factor: 2  # Prefetch batches

  # Data augmentation (Albumentations pipeline)
  augmentation:
    enabled: true
    pipeline:
      - type: "RandomRotate90"
        p: 0.5
      - type: "HorizontalFlip"
        p: 0.5
      - type: "VerticalFlip"
        p: 0.3
      - type: "GaussNoise"
        var_limit: [10, 50]
        p: 0.3
      - type: "GaussianBlur"
        blur_limit: [3, 7]
        p: 0.3
      - type: "RandomBrightnessContrast"
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.5
      - type: "ShiftScaleRotate"
        shift_limit: 0.1
        scale_limit: 0.1
        rotate_limit: 15
        p: 0.5
      - type: "CoarseDropout"
        max_holes: 8
        max_height: 16
        max_width: 16
        p: 0.3

  # ImageNet normalization (required for pretrained ResNet)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# Checkpointing configuration
checkpointing:
  checkpoint_dir: "checkpoints/teacher_resnet50"
  save_interval_epochs: 5  # Save checkpoint every 5 epochs
  keep_last_n: 3  # Keep only last 3 checkpoints
  save_best_only: false  # Also save periodic checkpoints

  # Checkpoint content
  save_optimizer_state: true
  save_scheduler_state: true
  save_training_history: true

  # Auto-resume from latest checkpoint
  auto_resume: true
  resume_from: null  # Path to specific checkpoint (null = auto-detect)

# Logging and monitoring
logging:
  # Console logging
  console_level: "INFO"
  log_interval: 50  # Log every 50 batches

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "logs/teacher_resnet50"
    log_images: true  # Log sample images
    log_interval: 100  # Log to TensorBoard every 100 batches
    log_histograms: false  # Log weight histograms (expensive)

  # Weights & Biases (optional)
  wandb:
    enabled: false  # Set to true to use W&B
    project: "image-preprocessing-detector"
    entity: null  # Your W&B username
    tags: ["phase3", "teacher", "resnet50", "iqa"]
    notes: "ResNet-50 teacher model for multi-head IQA"

# Evaluation configuration
evaluation:
  # Metrics to track
  metrics:
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "average_precision"  # mAP
    - "accuracy"

  # Per-class and per-head evaluation
  per_head_metrics: true
  per_class_metrics: true

  # Confusion matrix
  confusion_matrix:
    enabled: true
    normalize: true

  # Performance targets (for monitoring)
  targets:
    map: 0.88  # Mean Average Precision > 0.88
    inference_time_gpu_ms: 30  # GPU inference ≤ 30ms/page
    inference_time_cpu_ms: null  # CPU not recommended for teacher

# Device configuration
device:
  # Device selection (auto-detect by default)
  type: "auto"  # Options: auto, cuda, cpu
  gpu_id: 0  # GPU device ID (if multiple GPUs)

  # Multi-GPU training
  distributed: false  # Enable distributed training
  world_size: 1  # Number of GPUs

  # Device priority for inference (production)
  inference_priority:
    - "cuda"  # Try local GPU first
    - "modal"  # Fallback to Modal GPU
    - "cpu"  # Last resort (not recommended)

# Reproducibility
reproducibility:
  seed: 42  # Random seed
  deterministic: false  # Enable deterministic operations (slower)
  benchmark: true  # Enable cuDNN autotuner (faster, non-deterministic)

# Model export (after training)
export:
  # ONNX export
  onnx:
    enabled: true
    output_path: "models/teacher_resnet50.onnx"
    opset_version: 14
    dynamic_axes: true  # Support variable batch size
    simplify: true  # Simplify ONNX graph

  # TorchScript export
  torchscript:
    enabled: true
    output_path: "models/teacher_resnet50.pt"
    optimize: true

  # Quantization (for CPU deployment - not recommended for teacher)
  quantization:
    enabled: false
    method: "dynamic"
    dtype: "int8"

# Resource monitoring
monitoring:
  # GPU memory monitoring
  gpu_memory:
    log_interval: 100
    alert_threshold: 90  # Warn if >90% used

  # Training time estimates
  time_tracking:
    enabled: true
    log_eta: true  # Log estimated time remaining

# Validation during training
validation:
  # Validation frequency
  validate_every_n_epochs: 1  # Validate every epoch

  # Validation batch size (can be larger than training)
  batch_size: 64

  # Save validation predictions
  save_predictions: false
  predictions_dir: "predictions/teacher_resnet50"

# Comments and notes
notes: |
  This configuration is for training the ResNet-50 teacher model, which is the
  high-capacity model used selectively for difficult/high-risk pages.

  The teacher model uses:
  - ResNet-50 backbone (pretrained on ImageNet)
  - 5 specialized heads for quality issue detection
  - Multi-task learning with weighted loss functions
  - Cosine annealing learning rate schedule
  - Early stopping to prevent overfitting

  Performance targets:
  - mAP > 0.88 on OHR-Bench
  - GPU inference ≤ 30ms/page

  The student model (ResNet-18) will be trained separately using knowledge
  distillation from this teacher model in a later phase.
