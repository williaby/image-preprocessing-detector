# =============================================================================
# DocLayout-YOLO Model Configuration (Centralized)
# =============================================================================
#
# This is the SINGLE SOURCE OF TRUTH for DocLayout-YOLO model configuration.
# All training scripts and platform configs should reference this file.
#
# Reference: https://github.com/opendatalab/DocLayout-YOLO
# =============================================================================

# -----------------------------------------------------------------------------
# Active Model Selection
# -----------------------------------------------------------------------------
# Change this ONE value to switch models across all training pipelines
# Options: doclaynet_pretrained (recommended), doclaynet_scratch, docstructbench, d4la_scratch, d4la_pretrained
active_model: doclaynet_pretrained

# -----------------------------------------------------------------------------
# Available Models
# -----------------------------------------------------------------------------
models:
  # -------------------------------------------------------------------------
  # DocLayNet Models (11 classes) - RECOMMENDED for full layout coverage
  # -------------------------------------------------------------------------
  doclaynet_pretrained:
    name: "DocLayNet (DocSynth300K pretrained)"
    description: "Best accuracy - pre-trained on DocSynth300K, fine-tuned on DocLayNet"
    huggingface_id: "juliozhao/DocLayout-YOLO-DocLayNet-DocSynth300K_pretrained"
    recommended_image_size: 1024
    confidence_threshold: 0.2
    use_case: "Production use - full 11-class coverage with highest accuracy"
    class_schema: "doclaynet"
    performance:
      dataset: "DocLayNet"
      pretrained: true
      ap50: 93.4
      map: 79.7

  doclaynet_scratch:
    name: "DocLayNet (from scratch)"
    description: "DocLayNet trained from scratch without pre-training"
    huggingface_id: "juliozhao/DocLayout-YOLO-DocLayNet-from_scratch"
    recommended_image_size: 1024
    confidence_threshold: 0.2
    use_case: "When you want to avoid pre-training bias"
    class_schema: "doclaynet"
    performance:
      dataset: "DocLayNet"
      pretrained: false
      ap50: 93.0
      map: 77.7

  # -------------------------------------------------------------------------
  # DocStructBench Model (10 classes) - General purpose
  # -------------------------------------------------------------------------
  docstructbench:
    name: "DocStructBench"
    description: "General-purpose document layout detection"
    huggingface_id: "juliozhao/DocLayout-YOLO-DocStructBench"
    recommended_image_size: 1024
    confidence_threshold: 0.2
    use_case: "General documents, mixed content types"
    class_schema: "docstructbench"
    performance:
      dataset: "DocStructBench"
      pretrained: true

  # -------------------------------------------------------------------------
  # D4LA Models (alternative taxonomy)
  # -------------------------------------------------------------------------
  d4la_scratch:
    name: "D4LA (from scratch)"
    description: "D4LA trained from scratch without pre-training"
    huggingface_id: "juliozhao/DocLayout-YOLO-D4LA-from_scratch"
    recommended_image_size: 1600
    confidence_threshold: 0.2
    use_case: "When you want to avoid pre-training bias"
    class_schema: "d4la"
    performance:
      dataset: "D4LA"
      pretrained: false
      ap50: 81.7
      map: 69.8

  d4la_pretrained:
    name: "D4LA (DocSynth300K pretrained)"
    description: "D4LA pre-trained on DocSynth300K synthetic data"
    huggingface_id: "juliozhao/DocLayout-YOLO-D4LA-Docsynth300K_pretrained"
    recommended_image_size: 1600
    confidence_threshold: 0.2
    use_case: "D4LA taxonomy with pre-training benefits"
    class_schema: "d4la"
    performance:
      dataset: "D4LA"
      pretrained: true
      ap50: 82.4
      map: 70.3

# -----------------------------------------------------------------------------
# Common Settings (apply to all models)
# -----------------------------------------------------------------------------
common:
  # Architecture info
  architecture: "YOLOv10"
  architecture_features:
    - "Global-to-Local Controllability module"
    - "Document-specific optimizations"
    - "Multi-scale detection"

  # Package info
  package: "doclayout-yolo"
  import_statement: "from doclayout_yolo import YOLOv10"

  # Inference settings (production deployment)
  inference:
    # Device selection (auto, cpu, cuda, cuda:0, etc.)
    device: "auto"
    # Enable verbose output during inference
    verbose: false
    # Model caching (keep model in memory between calls)
    cache_model: true

  # Performance targets (Phase 6 requirements)
  performance_targets:
    gpu_latency_ms: 30  # Target: < 30ms per page on GPU
    cpu_latency_ms: 100  # Target: < 100ms per page on CPU
    min_map: 0.70  # Minimum mAP for production use

  # Default training settings (can be overridden in platform configs)
  # NOTE: Training is NOT required - pre-trained models are production-ready
  training_defaults:
    batch_size: 16
    epochs: 100
    optimizer: "adamw"
    learning_rate: 0.001
    weight_decay: 0.0005
    warmup_epochs: 3
    mixed_precision: true

  # Export formats
  export:
    onnx: true
    tensorrt: false

# -----------------------------------------------------------------------------
# Element Classes by Schema
# -----------------------------------------------------------------------------
# Different models use different class taxonomies. Use class_schema field to
# determine which classes apply to each model.

element_classes:
  # DocLayNet schema (11 classes) - IBM's standard document layout taxonomy
  # Reference: https://github.com/DS4SD/DocLayNet
  doclaynet:
    - Caption
    - Footnote
    - Formula
    - List-item
    - Page-footer
    - Page-header
    - Picture
    - Section-header
    - Table
    - Text
    - Title

  # DocStructBench schema (10 classes) - Mixed document types
  docstructbench:
    - title
    - "plain text"
    - abandon  # Text marked for removal/ignore
    - figure
    - figure_caption
    - table
    - table_caption
    - table_footnote
    - isolate_formula
    - formula_caption

  # D4LA schema - Document for Layout Analysis (uses similar classes to DocStructBench)
  d4la:
    - title
    - "plain text"
    - abandon
    - figure
    - figure_caption
    - table
    - table_caption
    - table_footnote
    - isolate_formula
    - formula_caption

