# Phase 7: Pseudo-Label Generation Configuration
# Generates continuous quality labels using Qwen3-VL-8B on Modal

experiment:
  name: "phase7_pseudo_labels"
  description: "Generate continuous quality labels for 150k images"
  version: "7.0.0"
  phase: "7"

# Model Configuration
model:
  name: "Qwen/Qwen3-VL-8B-Instruct"
  alternative: "Qwen/Qwen2.5-VL-7B-Instruct"  # Fallback if Qwen3 unavailable
  dtype: "bfloat16"
  attention: "flash_attention_2"  # or "sdpa" if flash-attn unavailable

# GPU Configuration
gpu:
  type: "A10G"  # 24GB VRAM - sufficient for 8B model
  alternatives:
    - "T4"      # 16GB - may need quantization
    - "A100"    # 40/80GB - for larger models or batching

# Processing Configuration
processing:
  batch_size: 10          # Images per batch
  num_workers: 4          # Parallel workers for large datasets
  chunk_size: 50          # Images per chunk when using parallel workers
  timeout_seconds: 7200   # 2 hours per container
  container_idle_timeout: 300  # Keep warm for 5 minutes

# Data Source Configuration
data:
  # GCS Configuration (recommended for large datasets)
  gcs:
    bucket: "your-bucket-name"  # Replace with actual bucket
    input_prefix: "datasets/ohr-bench/images/"
    output_prefix: "datasets/ohr-bench/pseudo_labels/"

  # Local Configuration (for testing)
  local:
    input_dir: "./data/images"
    output_dir: "./data/pseudo_labels"

  # Image extensions to process
  extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".tiff"
    - ".tif"
    - ".bmp"

# Label Configuration
labels:
  # Quality dimensions to assess
  dimensions:
    - blur_severity
    - noise_severity
    - skew_severity
    - contrast_severity
    - compression_severity
    - ink_degradation
    - paper_degradation
    - overall_quality

  # Binary threshold for backward compatibility
  binary_threshold: 0.3

  # Default confidence for pseudo-labels
  default_confidence: 0.85

# Resume Configuration
resume:
  enabled: true           # Skip already processed images
  checkpoint_interval: 100  # Save checkpoint every N images

# Cost Estimation (for reference)
cost_estimation:
  # Modal pricing (as of Nov 2025)
  a10g_hourly: 0.60
  a100_40gb_hourly: 1.10
  a100_80gb_hourly: 1.50

  # Estimated throughput
  images_per_second: 1.25  # ~0.8 sec/image for Qwen3-VL-8B

  # 150k images estimate
  estimated_hours: 33.3
  estimated_cost_usd: 20.0

# Prompt Configuration
prompt:
  temperature: 0.1        # Low for consistent outputs
  max_new_tokens: 512
  do_sample: false        # Greedy decoding for determinism

# Validation Configuration
validation:
  # Sample subset for manual review
  sample_size: 100

  # Expected score distributions (for sanity checking)
  expected_ranges:
    blur_severity: [0.0, 1.0]
    noise_severity: [0.0, 1.0]
    overall_quality: [0.0, 1.0]

  # Alert if too many parse errors
  max_parse_error_rate: 0.05  # 5%
