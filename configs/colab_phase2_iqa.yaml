# Google Colab Training Configuration - Phase 2: IQA Model
# Optimized for Colab Pro (12-hour sessions, V100/P100/T4 GPUs)

experiment:
  name: "phase2_iqa_mobilenetv3"
  description: "Multi-label IQA classifier for document quality assessment"
  version: "1.0.0"

platform:
  type: "google_colab"
  session_limit_hours: 12  # Colab Pro limit
  auto_save_before_limit: 11.5  # Save checkpoint 30min before limit

  # GPU configuration (auto-detected)
  gpu:
    required: true
    mixed_precision: true  # AMP for faster training
    compile_model: false  # PyTorch 2.0 compile (experimental)

# Google Drive paths (adjust these to your setup)
paths:
  # Project root in Google Drive
  drive_project_root: "/content/drive/MyDrive/image-preprocessing-detector"

  # Dataset paths
  dataset_root: "/content/drive/MyDrive/datasets/iqa_phase2"
  dataset_cache: "/content/data_cache"  # Local SSD for speed

  # Output paths
  checkpoints_dir: "/content/drive/MyDrive/checkpoints/phase2_iqa"
  logs_dir: "/content/drive/MyDrive/logs/phase2_iqa"
  models_output_dir: "/content/drive/MyDrive/models/phase2_iqa"

  # Temporary local paths (fast SSD)
  local_work_dir: "/content/work"

# Dataset configuration
dataset:
  name: "iqa_synthetic_50k"
  total_samples: 50000

  # Data splits
  train_split: 0.70  # 35,000 images
  val_split: 0.15    # 7,500 images
  test_split: 0.15   # 7,500 images (real-world only)

  # Issue classes for multi-label classification
  classes:
    - "noise"
    - "blur"
    - "skew"
    - "perspective"
    - "low_contrast"
    - "orientation"

  # Data augmentation (Albumentations)
  augmentation:
    enabled: true
    pipeline:
      - type: "RandomRotate90"
        p: 0.5
      - type: "Flip"
        p: 0.5
      - type: "GaussNoise"
        var_limit: [10, 50]
        p: 0.3
      - type: "GaussianBlur"
        blur_limit: [3, 7]
        p: 0.3
      - type: "RandomBrightnessContrast"
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.5
      - type: "HueSaturationValue"
        p: 0.3

  # Data loading
  num_workers: 2  # Colab has limited CPU cores
  pin_memory: true
  prefetch_factor: 2

# Model configuration
model:
  architecture: "mobilenet_v3_small"  # Options: mobilenet_v3_small, efficientnet_b0
  pretrained: true  # ImageNet weights
  input_size: 224  # Can use 320 for better accuracy (slower)
  num_classes: 6
  dropout: 0.2

  # Model-specific settings
  mobilenet:
    width_mult: 1.0  # Channel multiplier
    reduced_tail: false

  efficientnet:
    drop_path_rate: 0.2

# Training hyperparameters
training:
  # Optimizer
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.01

  # Learning rate scheduler
  scheduler:
    type: "reduce_on_plateau"  # Options: cosine, step, reduce_on_plateau
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 0.00001

  # Training parameters
  batch_size: 64  # Adjust based on GPU: T4=32, V100=64, A100=128
  epochs: 50
  early_stopping_patience: 10

  # Loss function
  loss_function: "bce_with_logits"  # Multi-label classification

  # Gradient settings
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1  # Increase if OOM

  # Mixed precision training (automatic on modern GPUs)
  mixed_precision:
    enabled: true
    dtype: "float16"  # Options: float16, bfloat16 (A100 only)

# Checkpoint management (handles 12-hour limit)
checkpointing:
  save_interval_epochs: 5  # Save every 5 epochs
  save_interval_minutes: 30  # Also save every 30 minutes
  keep_last_n: 3  # Keep only last 3 checkpoints
  save_best_only: false  # Also save best model separately
  auto_resume: true  # Automatically resume from latest checkpoint

  # Checkpoint content
  save_optimizer_state: true
  save_scheduler_state: true
  save_training_history: true

# Logging and monitoring
logging:
  # Console logging
  console_level: "INFO"
  log_interval: 50  # Log every 50 batches

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "auto"  # Uses paths.logs_dir
    log_images: true
    log_interval: 100

  # Weights & Biases (optional)
  wandb:
    enabled: false  # Set to true if using W&B
    project: "image-preprocessing-detector"
    entity: null  # Your W&B username
    tags: ["phase2", "iqa", "colab"]

# Evaluation
evaluation:
  # Metrics to track
  metrics:
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "average_precision"  # mAP

  # Per-class evaluation
  per_class_metrics: true

  # Calibration
  calibration:
    enabled: true
    method: "temperature_scaling"
    bins: 15  # For ECE calculation

  # Confusion matrix
  confusion_matrix:
    enabled: true
    normalize: true

# Model export
export:
  # ONNX export for deployment
  onnx:
    enabled: true
    opset_version: 14
    dynamic_axes: true
    simplify: true

  # Quantization for CPU deployment
  quantization:
    enabled: true
    method: "dynamic"  # Options: dynamic, static
    dtype: "int8"

  # TorchScript export
  torchscript:
    enabled: false

# Resource monitoring
monitoring:
  # GPU memory monitoring
  gpu_memory:
    log_interval: 100
    alert_threshold: 90  # Warn if >90% used

  # Session time monitoring
  session_time:
    check_interval: 300  # Check every 5 minutes
    warn_threshold_hours: 11.0  # Warn at 11 hours

# Reproducibility
reproducibility:
  seed: 42
  deterministic: false  # Set true for exact reproducibility (slower)
  benchmark: true  # cuDNN autotuner (faster but non-deterministic)

# Compute unit tracking (Colab Pro)
compute_tracking:
  enabled: true
  log_estimates: true
  target_budget: 100  # Colab Pro monthly limit (approximate)
