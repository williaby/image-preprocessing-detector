# Modal Training Configuration - Phase 2 IQA (TEST RUN)
# Quick validation to verify full pipeline works before production run
#
# Test parameters:
#   - 2 epochs only (quick validation)
#   - checkpoint_interval: 1 (save after each epoch)
#   - Same dataset and model architecture

model:
  teacher_architecture: resnet50
  student_architecture: resnet18
  pretrained: true
  num_classes: 5
  input_size: 224
  dropout: 0.2

  distillation:
    temperature: 4.0
    alpha: 0.7
    use_soft_labels: true

  teacher_inference:
    enabled: false
    uncertainty_threshold: 0.3
    discrepancy_threshold: 0.2
    high_risk_documents: true
    max_pages_per_batch: 100

  device_priority:
    - cuda:0
    - cpu
    - modal

training:
  batch_size: 128
  epochs: 2  # TEST: Only 2 epochs for quick validation
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 10
  gradient_clip_norm: 1.0
  mixed_precision: true

data:
  dataset_path: data/training/iqa_phase2_100k
  gcs_path: gs://image_detection_b/image-preprocessing-detector/phase2/iqa_phase2_100k
  metadata_file: metadata.json
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  num_workers: 4
  pin_memory: true
  augmentation_preset: medium

storage:
  checkpoint_path: gs://image_detection_b/checkpoints/phase2_iqa_test
  output_path: gs://image_detection_b/models/phase2_iqa_test
  log_path: gs://image_detection_b/logs/phase2_iqa_test

modal:
  gpu: A10
  cpu: 8.0
  memory: 32768
  timeout: 3600  # 1 hour timeout for test
  image_python_version: "3.12"

monitoring:
  tensorboard: true
  log_interval: 100
  checkpoint_interval: 1  # TEST: Save after each epoch to verify upload
