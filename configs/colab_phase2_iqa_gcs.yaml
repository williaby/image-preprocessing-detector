# Google Colab Training Configuration - Phase 2: IQA Model (GCS Storage)
# Uses Google Cloud Storage bucket instead of Google Drive
# Project: image-detection (ID: image-detection-478105)
# Bucket: gs://image_detection_b

experiment:
  name: "phase2_iqa_mobilenetv3_gcs"
  description: "Multi-label IQA classifier - GCS storage backend"
  version: "1.0.0"

  # GCP project configuration
  gcp_project_id: "image-detection-478105"
  gcs_bucket: "image_detection_b"

platform:
  type: "google_colab"
  session_limit_hours: 12
  auto_save_before_limit: 11.5

  gpu:
    required: true
    mixed_precision: true
    compile_model: false

# Storage: Google Cloud Storage paths
storage:
  backend: "gcs"
  gcs_bucket: "gs://image_detection_b"

  # GCS paths (in bucket)
  gcs_paths:
    datasets: "datasets/iqa_phase2"
    checkpoints: "checkpoints/phase2_iqa"
    logs: "logs/phase2_iqa"
    models: "models/phase2_iqa"
    configs: "configs"

  # Local cache paths (Colab SSD - fast)
  local_cache:
    enabled: true
    dataset_cache: "/content/data_cache/iqa_phase2"
    checkpoint_cache: "/content/checkpoints"
    work_dir: "/content/work"

# Paths (resolved at runtime)
paths:
  # Dataset (downloaded from GCS to local SSD)
  dataset_root: "/content/data_cache/iqa_phase2"

  # Checkpoints (local, synced to GCS)
  checkpoints_dir: "/content/checkpoints"

  # Logs (local, synced to GCS)
  logs_dir: "/content/logs/phase2_iqa"

  # Models output (synced to GCS)
  models_output_dir: "/content/models"

  # Working directory
  local_work_dir: "/content/work"

# GCS sync configuration
gcs_sync:
  # Initial download
  download_dataset_on_start: true
  download_timeout_minutes: 30

  # Checkpoint syncing
  sync_checkpoints:
    enabled: true
    interval_minutes: 30  # Sync every 30 minutes
    on_epoch_end: true    # Also sync after each epoch
    on_training_end: true

  # Log syncing
  sync_logs:
    enabled: true
    interval_minutes: 15

  # Model syncing
  sync_models:
    enabled: true
    on_export: true  # Sync after ONNX export

  # Parallel transfer
  parallel_transfer: true
  parallel_processes: 4

# Dataset configuration (same as Google Drive version)
dataset:
  name: "iqa_synthetic_50k"
  total_samples: 50000

  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

  classes:
    - "noise"
    - "blur"
    - "skew"
    - "perspective"
    - "low_contrast"
    - "orientation"

  augmentation:
    enabled: true
    pipeline:
      - type: "RandomRotate90"
        p: 0.5
      - type: "Flip"
        p: 0.5
      - type: "GaussNoise"
        var_limit: [10, 50]
        p: 0.3
      - type: "GaussianBlur"
        blur_limit: [3, 7]
        p: 0.3
      - type: "RandomBrightnessContrast"
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.5
      - type: "HueSaturationValue"
        p: 0.3

  num_workers: 2
  pin_memory: true
  prefetch_factor: 2

# Model configuration (same as Google Drive version)
model:
  architecture: "mobilenet_v3_small"
  pretrained: true
  input_size: 224
  num_classes: 6
  dropout: 0.2

  mobilenet:
    width_mult: 1.0
    reduced_tail: false

  efficientnet:
    drop_path_rate: 0.2

# Training hyperparameters (same as Google Drive version)
training:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.01

  scheduler:
    type: "reduce_on_plateau"
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 0.00001

  batch_size: 64
  epochs: 50
  early_stopping_patience: 10

  loss_function: "bce_with_logits"

  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 1

  mixed_precision:
    enabled: true
    dtype: "float16"

# Checkpoint management (with GCS sync)
checkpointing:
  save_interval_epochs: 5
  save_interval_minutes: 30
  keep_last_n: 3
  save_best_only: false
  auto_resume: true

  save_optimizer_state: true
  save_scheduler_state: true
  save_training_history: true

  # GCS-specific: Also save to bucket
  sync_to_gcs: true
  gcs_retention_days: 90  # Auto-delete old checkpoints after 90 days

# Logging and monitoring
logging:
  console_level: "INFO"
  log_interval: 50

  tensorboard:
    enabled: true
    log_dir: "auto"
    log_images: true
    log_interval: 100

  wandb:
    enabled: false
    project: "image-preprocessing-detector"
    entity: null
    tags: ["phase2", "iqa", "colab", "gcs"]

# Evaluation
evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "average_precision"

  per_class_metrics: true

  calibration:
    enabled: true
    method: "temperature_scaling"
    bins: 15

  confusion_matrix:
    enabled: true
    normalize: true

# Model export
export:
  onnx:
    enabled: true
    opset_version: 14
    dynamic_axes: true
    simplify: true

  quantization:
    enabled: true
    method: "dynamic"
    dtype: "int8"

  torchscript:
    enabled: false

  # Upload to GCS after export
  upload_to_gcs: true
  gcs_model_path: "models/phase2_iqa/production"

# Resource monitoring
monitoring:
  gpu_memory:
    log_interval: 100
    alert_threshold: 90

  session_time:
    check_interval: 300
    warn_threshold_hours: 11.0

  # GCS transfer monitoring
  gcs_sync_status:
    log_transfers: true
    alert_on_failure: true

# Reproducibility
reproducibility:
  seed: 42
  deterministic: false
  benchmark: true

# Compute unit tracking
compute_tracking:
  enabled: true
  log_estimates: true
  target_budget: 100

# GCS-specific settings
gcs_settings:
  # Lifecycle management
  lifecycle:
    enabled: true
    checkpoint_retention_days: 90
    log_retention_days: 180

  # Cost optimization
  storage_class: "STANDARD"  # Options: STANDARD, NEARLINE, COLDLINE

  # Transfer optimization
  transfer:
    compression: true
    chunk_size_mb: 8
    retry_attempts: 3
