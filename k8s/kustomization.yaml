# Kustomization for Image Preprocessing Detector
# Usage: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: image-preprocessing-detector

namespace: imgprep

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: image-preprocessing-detector
  app.kubernetes.io/part-of: rag-pipeline
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml
  - hpa.yaml
  - ingress.yaml

# Image customization
images:
  - name: image-preprocessing-detector
    newTag: latest

# Configuration for different environments
# Use overlays for staging/production:
#   k8s/overlays/staging/kustomization.yaml
#   k8s/overlays/production/kustomization.yaml
