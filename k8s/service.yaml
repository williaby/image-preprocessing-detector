# Service for Image Preprocessing Detector API
apiVersion: v1
kind: Service
metadata:
  name: imgprep-api
  namespace: imgprep
  labels:
    app.kubernetes.io/name: image-preprocessing-detector
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: image-preprocessing-detector
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ServiceAccount for the API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imgprep-api
  namespace: imgprep
  labels:
    app.kubernetes.io/name: image-preprocessing-detector
    app.kubernetes.io/component: api
