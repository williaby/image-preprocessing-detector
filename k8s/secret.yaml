# Secret for Image Preprocessing Detector API
# IMPORTANT: Do not commit real secrets to version control!
# This file serves as a template - replace values before applying.
#
# Usage:
#   kubectl create secret generic imgprep-secret \
#     --from-literal=IMGPREP_API_API_KEYS='key1,key2' \
#     --namespace=imgprep
#
# Or use sealed-secrets, external-secrets, or vault for production.
apiVersion: v1
kind: Secret
metadata:
  name: imgprep-secret
  namespace: imgprep
  labels:
    app.kubernetes.io/name: image-preprocessing-detector
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Authentication (replace with real values)
  IMGPREP_API_AUTH_ENABLED: "true"
  IMGPREP_API_API_KEYS: "REPLACE_WITH_REAL_API_KEYS"
  IMGPREP_API_INTERNAL_CALLERS: '["10.0.0.0/8"]'
