config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.claude/**",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/template_feedback/**",
  "**/templates/**",
  "**/testdata/**",
  "**/tmp_cleanup/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# Exclude Bandit from running on test files (matches pre-commit config)
[[exclude]]
plugins = ["bandit"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Ignore B101 (assert_used) - standard pytest practice, not a security issue
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B101"]
set.ignored = true

# Ignore B110 (try-except-pass) in logging/errors.py - intentional for optional Sentry
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B110"]
match.file_patterns = ["**/logging/errors.py"]
set.ignored = true

# Ignore S311/B311 (random) in logging module - used for log sampling, not crypto
[[triage]]
match.plugins = ["ruff"]
match.rules = ["ruff:S311"]
match.file_patterns = ["**/logging/__init__.py", "**/logging/outcomes.py"]
set.ignored = true

# Ignore B311 (random) in logging module - used for log sampling, not crypto
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B311"]
match.file_patterns = ["**/logging/__init__.py", "**/logging/outcomes.py"]
set.ignored = true

# Ignore path traversal in scripts/ - CLI tools intentionally accept file paths
[[triage]]
match.plugins = ["semgrep"]
match.rules = ["semgrep:cli-path-traversal-open"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore B615 (HuggingFace Hub download) in regression_head.py - model_id is user-configured
# and validated by HuggingFace's model hub infrastructure; revision pinning is optional
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B615"]
match.file_patterns = ["**/labeling/finetuning/regression_head.py"]
set.ignored = true

# Ignore TODO comments - these are for tracking, not issues
[[triage]]
match.plugins = ["ripgrep"]
match.rules = ["ripgrep:TODO"]
set.ignored = true

# Ignore NOTE comments - documentation/explanation, not issues
[[triage]]
match.plugins = ["ripgrep"]
match.rules = ["ripgrep:NOTE"]
set.ignored = true

# Ignore radarlint TODO findings - same as ripgrep
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1135"]
set.ignored = true

# Ignore cognitive complexity in Modal training scripts - complex training loops are necessary
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3776"]
match.file_patterns = ["modal/**"]
set.ignored = true

# Ignore cognitive complexity in scripts/ - data processing scripts have necessary complexity
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3776"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore duplicated string literals in modal/ - filenames like "labels.json" are natural repetitions
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1192"]
match.file_patterns = ["modal/**"]
set.ignored = true

# Ignore cognitive complexity in synthetic renderer - vertical text layout requires nested logic
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3776"]
match.file_patterns = ["**/synthetic/renderer.py"]
set.ignored = true

# Ignore "always returns same value" in scripts/ - intentional error handling patterns
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3516"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore unused parameter warnings in Modal training scripts - kept for API consistency
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1172"]
match.file_patterns = ["modal/**"]
set.ignored = true

# Ignore unused parameter warnings in scripts/ - kept for API extensibility
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1172"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore float equality checks in tests - exact values from deterministic functions
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1244"]
match.file_patterns = ["tests/**", "**/test_*.py"]
set.ignored = true

# Ignore float equality checks in scripts/ - statistical thresholds are exact values
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1244"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore commented-out code in tests - preserved for reference
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S125"]
match.file_patterns = ["tests/**", "**/test_*.py"]
set.ignored = true

# Ignore unused local variable in tests - used for assertion setup
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1481"]
match.file_patterns = ["tests/**", "**/test_*.py"]
set.ignored = true

# Ignore B311 (random) in synthetic module - font size randomization, not crypto
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B311"]
match.file_patterns = ["**/synthetic/**"]
set.ignored = true

# Ignore function naming in fuzz/ - TestOneInput required by atheris/ClusterFuzzLite framework
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1542"]
match.file_patterns = ["fuzz/**"]
set.ignored = true

# Ignore cognitive complexity in API routes - document processing requires sequential pipeline steps
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3776"]
match.file_patterns = ["**/api/routes/**"]
set.ignored = true

# Ignore duplicated string literals in scripts/ - file extensions and field names are natural repetitions
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S1192"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore empty block in synthetic CLI - consuming generator to drive progress bar is intentional
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S108"]
match.file_patterns = ["**/synthetic/cli.py"]
set.ignored = true

# Ignore cognitive complexity in synthetic CLI - Click command with many options requires sequential processing
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S3776"]
match.file_patterns = ["**/synthetic/cli.py"]
set.ignored = true

# Ignore type mismatch in tests - intentional None/wrong type to test edge cases
[[triage]]
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S5655"]
match.file_patterns = ["tests/**", "**/test_*.py"]
set.ignored = true

[[plugin]]
name = "hadolint"

# Exclude hadolint from .license files (REUSE sidecar files, not Dockerfiles)
[[exclude]]
plugins = ["hadolint"]
file_patterns = ["*.license"]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

# Security - SAST scanning with community rules
# Rulesets configured in .semgrep.yml
# Covers path traversal, injection, OWASP Top 10
[[plugin]]
name = "semgrep"

# Exclude semgrep from test files (reduce noise)
[[exclude]]
plugins = ["semgrep"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Markdown linting for documentation
[[plugin]]
name = "markdownlint"

# YAML linting for CI/config files
[[plugin]]
name = "yamllint"

# JSON formatting
[[plugin]]
name = "prettier"
drivers = ["json"]
