config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.claude/**",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/template_feedback/**",
  "**/templates/**",
  "**/testdata/**",
  "**/tmp_cleanup/**",
  "**/vendor/**",
  # Generated PR comment tracking files - not source code, no analysis value
  "**/docs/planning/UNRESOLVED_*.md",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# Exclude Bandit from running on test files (matches pre-commit config)
[[exclude]]
plugins = ["bandit"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Ignore B101 (assert_used) - standard pytest practice, not a security issue
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B101"]
set.ignored = true

# Ignore B110 (try-except-pass) in logging/errors.py - intentional for optional Sentry
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B110"]
match.file_patterns = ["**/logging/errors.py"]
set.ignored = true

# Ignore S311/B311 (random) in logging module - used for log sampling, not crypto
[[triage]]
match.plugins = ["ruff"]
match.rules = ["ruff:S311"]
match.file_patterns = ["**/logging/__init__.py", "**/logging/outcomes.py"]
set.ignored = true

# Ignore B311 (random) in logging module - used for log sampling, not crypto
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B311"]
match.file_patterns = ["**/logging/__init__.py", "**/logging/outcomes.py"]
set.ignored = true

# Ignore path traversal in scripts/ - CLI tools intentionally accept file paths
[[triage]]
match.plugins = ["semgrep"]
match.rules = ["semgrep:cli-path-traversal-open"]
match.file_patterns = ["scripts/**"]
set.ignored = true

# Ignore B615 (HuggingFace Hub download) in regression_head.py - model_id is user-configured
