[[plugin]]
name = "hadolint"

# Exclude hadolint from .license files (REUSE sidecar files, not Dockerfiles)
[[exclude]]
plugins = ["hadolint"]
file_patterns = ["*.license"]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

# Security - SAST scanning with community rules
# Rulesets configured in .semgrep.yml
# Covers path traversal, injection, OWASP Top 10
[[plugin]]
name = "semgrep"

# Exclude semgrep from test files (reduce noise)
[[exclude]]
plugins = ["semgrep"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Markdown linting for documentation
[[plugin]]
name = "markdownlint"

# YAML linting for CI/config files
[[plugin]]
name = "yamllint"

# JSON formatting
[[plugin]]
name = "prettier"
drivers = ["json"]
