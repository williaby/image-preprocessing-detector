config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

# Exclude Bandit from running on test files (matches pre-commit config)
[[exclude]]
plugins = ["bandit"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Ignore B101 (assert_used) - standard pytest practice, not a security issue
[[triage]]
match.plugins = ["bandit"]
match.rules = ["bandit:B101"]
set.ignored = true

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trivy"
drivers = [
  "config",
  "fs-vuln",
]

[[plugin]]
name = "trufflehog"

# Security - SAST scanning with community rules
# Rulesets configured in .semgrep.yml
# Covers path traversal, injection, OWASP Top 10
[[plugin]]
name = "semgrep"

# Exclude semgrep from test files (reduce noise)
[[exclude]]
plugins = ["semgrep"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# Markdown linting for documentation
[[plugin]]
name = "markdownlint"

# YAML linting for CI/config files
[[plugin]]
name = "yamllint"

# JSON formatting
[[plugin]]
name = "prettier"
drivers = ["json"]
