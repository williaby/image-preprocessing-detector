# Development environment overrides

replicaCount: 1

image:
  tag: "dev-latest"
  pullPolicy: Always

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false

config:
  logLevel: "DEBUG"
  logRequestBody: true
  logResponseBody: true
  rateLimitEnabled: false
  authEnabled: false  # Disable auth for dev

ingress:
  enabled: true
  hosts:
    - host: imgprep-api-dev.example.com
      paths:
        - path: /
          pathType: Prefix
