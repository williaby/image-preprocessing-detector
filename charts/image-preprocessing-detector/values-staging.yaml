# Staging environment overrides

replicaCount: 2

image:
  tag: "staging-latest"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  logLevel: "INFO"
  logRequestBody: false
  logResponseBody: false
  rateLimitEnabled: true
  rateLimitRequests: 100
  rateLimitWindowSeconds: 60
  authEnabled: true

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: imgprep-api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: imgprep-api-staging-tls
      hosts:
        - imgprep-api-staging.example.com

# GPU configuration for staging (if available)
gpu:
  enabled: false  # Enable when GPU nodes are available in staging
  type: "nvidia.com/gpu"
  count: 1

# Persistence for model cache
persistence:
  enabled: true
  size: 10Gi
  storageClass: "standard"
