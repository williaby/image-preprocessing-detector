apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "image-preprocessing-detector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "image-preprocessing-detector.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "image-preprocessing-detector.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "image-preprocessing-detector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "image-preprocessing-detector.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: IMGPREP_API_TITLE
              value: {{ .Values.config.title | quote }}
            - name: IMGPREP_API_DESCRIPTION
              value: {{ .Values.config.description | quote }}
            - name: IMGPREP_API_VERSION
              value: {{ .Values.config.version | quote }}
            - name: IMGPREP_API_MAX_FILE_SIZE_MB
              value: {{ .Values.config.maxFileSizeMb | quote }}
            - name: IMGPREP_API_MAX_BATCH_SIZE
              value: {{ .Values.config.maxBatchSize | quote }}
            - name: IMGPREP_API_CORS_ENABLED
              value: {{ .Values.config.corsEnabled | quote }}
            - name: IMGPREP_API_CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: IMGPREP_API_CORS_ALLOW_CREDENTIALS
              value: {{ .Values.config.corsAllowCredentials | quote }}
            - name: IMGPREP_API_RATE_LIMIT_ENABLED
              value: {{ .Values.config.rateLimitEnabled | quote }}
            - name: IMGPREP_API_RATE_LIMIT_REQUESTS
              value: {{ .Values.config.rateLimitRequests | quote }}
            - name: IMGPREP_API_RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.config.rateLimitWindowSeconds | quote }}
            - name: IMGPREP_API_AUTH_ENABLED
              value: {{ .Values.config.authEnabled | quote }}
            - name: IMGPREP_API_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: IMGPREP_API_LOG_REQUEST_BODY
              value: {{ .Values.config.logRequestBody | quote }}
            - name: IMGPREP_API_LOG_RESPONSE_BODY
              value: {{ .Values.config.logResponseBody | quote }}
            {{- if .Values.config.authEnabled }}
            - name: IMGPREP_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "image-preprocessing-detector.fullname" . }}-secret
                  key: api-keys
            - name: IMGPREP_API_INTERNAL_CALLERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "image-preprocessing-detector.fullname" . }}-secret
                  key: internal-callers
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- if .Values.gpu.enabled }}
            {{- $resources := merge (dict "limits" (dict .Values.gpu.type .Values.gpu.count)) .Values.resources }}
            {{- toYaml $resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "image-preprocessing-detector.fullname" . }}-models
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
