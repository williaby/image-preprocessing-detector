---
# Pre-commit hooks configuration
# See https://pre-commit.com for more information

# pre-commit.ci configuration
ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter]  # Skip local-only hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        # Allow multiple YAML documents in single file (e.g., manifests with ---)
        args: ['--allow-multiple-documents']
        exclude: ^mkdocs\.yml$
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ['--fix=lf']
        stages: [pre-commit]

  # Python linting and formatting with Ruff
  # Replaces: Black (formatting), pydocstyle (docstrings)
  # Version aligned with pyproject.toml constraint (>=0.9.0,<1.0.0)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4  # Compatible with pyproject.toml ruff>=0.9.0,<1.0.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        exclude: ^notebooks/
        stages: [pre-commit]
      - id: ruff-format
        exclude: ^notebooks/
        stages: [pre-commit]

  # Python type checking with MyPy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - types-pillow
          - types-python-dateutil
          - types-PyYAML
        args: ['--ignore-missing-imports', '--python-version=3.12', '--no-warn-unused-ignores']
        # Exclude tests, validation, benchmarks, data, scripts, modal,
        # notebooks, and Phase 2+ files
        exclude: |
          (?x)^(
              tests/.*|validation/.*|fuzz/.*|benchmarks/.*|data/.*|scripts/.*|
              modal/.*|notebooks/.*|deployment/.*|
              src/image_preprocessing_detector/utils/gcs_uploader\.py|
              src/image_preprocessing_detector/utils/device_probe\.py|
              src/image_preprocessing_detector/utils/metadata_generator\.py|
              src/image_preprocessing_detector/routing/recommendation_engine\.py|
              src/image_preprocessing_detector/output/json_generator\.py|
              src/image_preprocessing_detector/ingestion/document_processor\.py|
              src/image_preprocessing_detector/augmentation/.*
          )$
        stages: [pre-commit]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033', 'MD041']
        stages: [pre-commit]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}}}']
        exclude: ^charts/.*/templates/.*\.yaml$
        stages: [pre-commit]

  # Documentation front matter validation
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: uv run python tools/validate_front_matter.py docs
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        stages: [pre-commit]

  # Phase 5: Check for unbounded module-level caches
  # Prevents OOM issues from unbounded dictionaries at module level
  # Allowed patterns: _*_READERS (StreamingJSONLReader), _COCO_CACHE (file-level)
  - repo: local
    hooks:
      - id: no-unbounded-module-caches
        name: Check for unbounded module-level caches
        entry: bash
        args:
          - -c
          - |
            PATTERN="^_[A-Z_]*_CACHE: (dict|Dict|Mapping)"
            SEARCH_PATH="src/image_preprocessing_detector/annotation/parsers/"
            if grep -rn "$PATTERN" "$SEARCH_PATH" 2>/dev/null \
                | grep -v "_COCO_CACHE" \
                | grep -v "_READERS"; then
              echo "ERROR: Found unbounded module-level cache."
              echo "Use BoundedCache or StreamingJSONLReader instead."
              exit 1
            fi
        language: system
        files: ^src/image_preprocessing_detector/annotation/parsers/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

  # Python docstring coverage with interrogate
  # NOTE: Docstring style now handled by Ruff (D rules)
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ['-v', '-c', 'pyproject.toml', 'src/']
        pass_filenames: false
        stages: [pre-commit]

  # Security scanning with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: 'tests/.*'
        stages: [pre-commit]

# Exclude patterns (don't run hooks on these)
exclude: |
  (?x)^(
      \.git/.*|
      \.venv/.*|
      venv/.*|
      build/.*|
      dist/.*|
      .*\.egg-info/.*|
      __pycache__/.*|
      \.mypy_cache/.*|
      \.pytest_cache/.*|
      \.ruff_cache/.*|
      data/.*|
      models/.*|
      modal/.*|
      notebooks/.*|
      scripts/.*|
      .*\.pyc
  )$
