---
# Pre-commit hooks configuration
# See https://pre-commit.com for more information

# pre-commit.ci configuration
ci:
  autoupdate_schedule: monthly
  autofix_prs: true
  skip: [validate-front-matter]  # Skip local-only hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python linting and formatting with Ruff
  # Replaces: Black (formatting), pydocstyle (docstrings)
  # Version aligned with pyproject.toml constraint (>=0.9.0,<1.0.0)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4  # Compatible with pyproject.toml ruff>=0.9.0,<1.0.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  # Python type checking with MyPy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
          - types-pillow
          - types-python-dateutil
          - types-PyYAML
        args: ['--ignore-missing-imports', '--python-version=3.10']
        # Exclude tests, validation, benchmarks, data, scripts, modal,
        # notebooks, and Phase 2+ files
        exclude: |
          (?x)^(
              tests/.*|validation/.*|fuzz/.*|benchmarks/.*|data/.*|scripts/.*|
              modal/.*|notebooks/.*|
              src/image_preprocessing_detector/utils/gcs_uploader\.py|
              src/image_preprocessing_detector/utils/device_probe\.py|
              src/image_preprocessing_detector/utils/metadata_generator\.py|
              src/image_preprocessing_detector/routing/recommendation_engine\.py|
              src/image_preprocessing_detector/output/json_generator\.py|
              src/image_preprocessing_detector/ingestion/document_processor\.py|
              src/image_preprocessing_detector/augmentation/.*
          )$

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--disable', 'MD013', 'MD033', 'MD041']

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}}}']

  # Documentation front matter validation
  - repo: local
    hooks:
      - id: validate-front-matter
        name: Validate documentation front matter
        entry: uv run python tools/validate_front_matter.py docs
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

  # Python docstring coverage with interrogate
  # NOTE: Docstring style now handled by Ruff (D rules)
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ['-v', '-c', 'pyproject.toml', 'src/']
        pass_filenames: false

  # Security scanning with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: 'tests/.*'

  # Dependency scanning with Safety (using local hook for UV compatibility)
  - repo: local
    hooks:
      - id: safety-scan
        name: safety
        # Ignore 51457: CVE-2022-42969 (py library) - disputed and withdrawn from NVD
        entry: uv run safety scan --full-report --path pyproject.toml --path uv.lock --ignore 51457
        language: system
        files: pyproject.toml
        pass_filenames: false

# Exclude patterns (don't run hooks on these)
exclude: |
  (?x)^(
      \.git/.*|
      \.venv/.*|
      venv/.*|
      build/.*|
      dist/.*|
      .*\.egg-info/.*|
      __pycache__/.*|
      \.mypy_cache/.*|
      \.pytest_cache/.*|
      \.ruff_cache/.*|
      data/.*|
      models/.*|
      modal/.*|
      notebooks/.*|
      scripts/.*|
      .*\.pyc
  )$
