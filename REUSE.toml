# REUSE Software Bill of Materials
# https://reuse.software/
# This file provides centralized licensing information for the entire project
# avoiding the need for SPDX headers in individual files.

version = 1
SPDX-PackageName = "image-preprocessing-detector"
SPDX-PackageSupplier = "Byron Williams"
SPDX-PackageDownloadLocation = "https://github.com/williaby/image-preprocessing-detector"

# Source code (Python, tools, tests) - Apache-2.0
[[annotations]]
path = [
    "src/**",
    "tools/**",
    "tests/**",
    "validation/**",
    "fuzz/**",
    "benchmarks/**/*.py",
    "scripts/**/*.py",
    "modal/**/*.py",
    "*.py",
    "noxfile.py",
]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Documentation - CC-BY-4.0
[[annotations]]
path = [
    "docs/**",
    "*.md",
    "tmp_cleanup/**/*.md",  # Temporary reference files
    "benchmarks/*.md",  # Benchmark documentation (not reports)
    "!LICENSES/*.txt",  # Exclude actual license text files
]
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Configuration files - CC0-1.0 (public domain dedication)
[[annotations]]
path = [
    "*.toml",
    "*.yml",
    "*.yaml",
    ".github/**",
    ".gitignore",
    ".gitattributes",
    ".pre-commit-config.yaml",
    ".readthedocs.yaml",
    "mkdocs.yml",
    "poetry.lock",  # Dependency lockfile for reproducible builds
    "uv.lock",  # UV dependency lockfile for nox testing
    "requirements/**/*.txt",  # Generated from poetry export
    "requirements.txt",  # Generated from uv export
    "requirements-dev.txt",  # Generated from uv export
    "benchmarks/labelmaps/**/*.yaml",  # Benchmark label mappings
    ".zenodo.json",  # Zenodo metadata for DOI
    ".dvc/**",  # DVC configuration and metadata files
    ".dvcignore",  # DVC ignore patterns
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Data files and models - ODbL-1.0 (Open Database License)
[[annotations]]
path = [
    "data/**",
    "models/**",
]
SPDX-License-Identifier = "ODbL-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Build artifacts and generated files - excluded from licensing
[[annotations]]
path = [
    "build/**",
    "dist/**",
    "site/**",
    "*.egg-info/**",
    "__pycache__/**",
    ".venv/**",
    "venv/**",
    ".nox/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "*.pyc",
    "*.pyo",
]
precedence = "override"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Additional configuration and temporary files - CC0-1.0
[[annotations]]
path = [
    ".clusterfuzzlite/**",
    ".coderabbit.yaml",  # CodeRabbit AI review config
    ".coveragerc-ml",  # ML coverage configuration
    ".dockerignore",  # Docker build exclusions
    ".qlty/**",  # Qlty linter configuration
    ".semgrep.yml",  # Semgrep security patterns
    ".snyk",  # Snyk vulnerability ignore configuration
    ".sonarlint/**",  # SonarLint IDE configuration
    "concept.txt",
    "coverage.json",  # Coverage report
    "Dockerfile",  # Docker container definition
    "Dockerfile.*",  # Docker variants (Dockerfile.gpu, etc.)
    "image_reference_sets.txt",
    "overrides/**",
    "pyrightconfig.json",  # Pyright/BasedPyright config
    "renovate.json",
    "sonar-project.properties",  # SonarCloud config
    "validate_workflows.sh",
    "scripts/**/*.sh",  # Shell scripts for automation
    "tmp_cleanup/**/*.txt",  # Temporary text files
    "k8s/**",  # Kubernetes manifests
    "monitoring/**",  # Monitoring configuration (Grafana, Prometheus)
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

