# REUSE Software Bill of Materials
# https://reuse.software/
# This file provides centralized licensing information for the entire project
# avoiding the need for SPDX headers in individual files.

version = 1
SPDX-PackageName = "image-preprocessing-detector"
SPDX-PackageSupplier = "Byron Williams"
SPDX-PackageDownloadLocation = "https://github.com/williaby/image-preprocessing-detector"

# Source code (Python, tools, tests) - CC-BY-SA-4.0
[[annotations]]
path = [
    "src/**",
    "tools/**",
    "tests/**",
    "validation/**",
    "fuzz/**",
    "benchmarks/**/*.py",
    "scripts/**/*.py",
    "modal/**/*.py",
    "*.py",
    "noxfile.py",
]
precedence = "override"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Documentation - CC-BY-SA-4.0
[[annotations]]
path = [
    "docs/**",
    "*.md",
    "tmp_cleanup/**/*.md",  # Temporary reference files
    "benchmarks/*.md",  # Benchmark documentation (not reports)
    "scripts/**/*.md",  # Script documentation (including omnidocbench_baseline)
    "configs/**/*.md",  # Config directory documentation
    "!LICENSES/*.txt",  # Exclude actual license text files
]
precedence = "override"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

# Configuration files - CC0-1.0 (public domain dedication)
[[annotations]]
path = [
    "*.toml",
    "*.yml",
    "*.yaml",
    ".github/**",
    ".gitignore",
    ".gitattributes",
    ".claudeignore",
    ".env.example",
    ".semgrepignore",
    "CITATION.cff",
    ".pre-commit-config.yaml",
    ".readthedocs.yaml",
    "mkdocs.yml",
    "poetry.lock",  # Dependency lockfile for reproducible builds
    "uv.lock",  # UV dependency lockfile for nox testing
    "requirements/**/*.txt",  # Generated from poetry export
    "requirements.txt",  # Generated from uv export
    "requirements-dev.txt",  # Generated from uv export
    "requirements-ml.txt",  # Generated from uv export
    "requirements-api.txt",  # Generated from uv export
    "benchmarks/labelmaps/**/*.yaml",  # Benchmark label mappings
    "configs/**/*.yaml",  # Configuration files (modal, monitoring, etc.)
    "configs/**/*.json",  # Configuration files (Grafana dashboards, etc.)
    "scripts/omnidocbench_baseline/model_registry.yaml",  # Model registry config
    ".zenodo.json",  # Zenodo metadata for DOI
    ".dvc/**",  # DVC configuration and metadata files
    ".dvcignore",  # DVC ignore patterns
]
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileCopyrightText = "2025 Byron Williams"

