# SonarCloud Configuration
# Documentation: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/ci-based-analysis/sonarscanner-for-your-ci-environment/

# Project identification
sonar.organization=williaby
sonar.projectKey=williaby_image-preprocessing-detector
sonar.projectName=Image Preprocessing Detector

# Source code configuration
sonar.sources=src/
sonar.tests=tests/
sonar.python.version=3.12

# Coverage report paths
sonar.python.coverage.reportPaths=coverage.xml

# Coverage exclusions (don't measure coverage on test/validation/benchmark code)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/validation/**,\
  **/benchmarks/**,\
  **/scripts/**,\
  **/modal/**

# Exclusions from analysis
sonar.exclusions=\
  **/migrations/**,\
  **/tests/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/notebooks/**,\
  **/validation/**,\
  **/benchmarks/**

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/*_test.py

# Encoding
sonar.sourceEncoding=UTF-8

# Quality profiles
sonar.python.pylint.reportPaths=

# Duplicate detection
sonar.cpd.python.minimumTokens=100

# Issue tracking
sonar.links.homepage=https://github.com/williaby/image-preprocessing-detector
sonar.links.ci=https://github.com/williaby/image-preprocessing-detector/actions
sonar.links.issue=https://github.com/williaby/image-preprocessing-detector/issues
sonar.links.scm=https://github.com/williaby/image-preprocessing-detector
