<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1758px" preserveAspectRatio="none" style="width:599px;height:1758px;background:#FFFFFF;" version="1.1" viewBox="0 0 599 1758" width="599px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="367" x="20" y="34.9659">Chunk &#8594; Application Embedding: Contract Workflow</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="556" x="20" y="54.0339">(Mandatory interface &#8212; all per-app embedding implementations must conform)</text><ellipse cx="130.5" cy="79.1358" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216" x="22.5" y="109.1358"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196" x="32.5" y="131.9639">Receive NormalizedTextDocument,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154" x="32.5" y="148.308">RAGChunkSet, TrustMetrics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73" x="32.5" y="164.6522">(from Chunk)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183" x="39" y="198.1682"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160" x="49" y="220.9963">Determine target collection /</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122" x="49" y="237.3404">index and namespace</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163" x="49" y="253.6845">(based on project/app config)</text><rect fill="none" height="225.4767" style="stroke:#000000;stroke-width:1.5;" width="199" x="31" y="277.2005"/><path d="M210,277.2005 L210,289.2684 L200,299.2684 L31,299.2684 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="34" y="293.1665">Chunk filtering &amp; routing</text><rect fill="#F1F1F1" height="85.3765" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179" x="41" y="316.2684"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="159" x="51" y="339.0965">Filter or down-weight chunks</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125" x="51" y="355.4406">with low trust_score or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123" x="51" y="371.7848">high hallucination_risk</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100" x="51" y="388.1289">(if policy requires)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="157" x="52" y="421.6449"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137" x="62" y="444.473">Optionally split or merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128" x="62" y="460.8171">chunks for app-specific</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="87" x="62" y="477.1612">size constraints</text><rect fill="none" height="396.2296" style="stroke:#000000;stroke-width:1.5;" width="202" x="29.5" y="512.6772"/><path d="M195.5,512.6772 L195.5,524.7452 L185.5,534.7452 L29.5,534.7452 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156" x="32.5" y="528.6432">Embedding generation</text><rect fill="#F1F1F1" height="101.7206" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158" x="51.5" y="551.7452"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138" x="61.5" y="574.5732">Select embedding model</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54" x="61.5" y="590.9174">based on:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136" x="61.5" y="607.2615">- document domain/type</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109" x="61.5" y="623.6056">- multilingual needs</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="77" x="61.5" y="639.9497">- model policy</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="164" x="48.5" y="673.4657"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144" x="58.5" y="696.2938">Generate embeddings for</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="58.5" y="712.6379">accepted chunks</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103" x="58.5" y="728.982">(batch processing)</text><rect fill="#F1F1F1" height="134.4088" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182" x="39.5" y="762.4981"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162" x="49.5" y="785.3262">Attach embedding metadata:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="55" x="49.5" y="801.6703">- chunk_id</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78" x="49.5" y="818.0144">- document_id</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73" x="49.5" y="834.3585">- page_range</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103" x="49.5" y="850.7026">- section hierarchy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73" x="49.5" y="867.0467">- trust scores</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141" x="49.5" y="883.3908">- OCR engine provenance</text><rect fill="none" height="330.8532" style="stroke:#000000;stroke-width:1.5;" width="209" x="26" y="918.9069"/><path d="M192,918.9069 L192,930.9748 L182,940.9748 L26,940.9748 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156" x="29" y="934.8728">Vector store operations</text><rect fill="#F1F1F1" height="85.3765" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="189" x="36" y="957.9748"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169" x="46" y="980.8029">Write embeddings + metadata</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142" x="46" y="997.147">into configured vector DB</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124" x="46" y="1013.4911">(e.g., pgvector, Milvus,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="82" x="46" y="1029.8352">Weaviate, etc.)</text><rect fill="#F1F1F1" height="69.0323" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187" x="37" y="1063.3512"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167" x="47" y="1086.1793">Update any secondary indices</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113" x="47" y="1102.5234">(e.g., keyword index,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="118" x="47" y="1118.8676">section-level catalog)</text><rect fill="#F1F1F1" height="85.3765" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="165" x="48" y="1152.3836"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145" x="58" y="1175.2117">Record ingestion statistics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83" x="58" y="1191.5558">for monitoring:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="10" x="58" y="1207.8999">1.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97" x="71" y="1207.8999">chunks, avg trust,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95" x="58" y="1224.244">pages processed</text><rect fill="#F1F1F1" height="85.3765" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="137" x="62" y="1269.76"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117" x="72" y="1292.5881">Emit ingestion result:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116" x="72" y="1308.9322">- collection / index ID</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104" x="72" y="1325.2764">- document handle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112" x="72" y="1341.6205">- summary statistics</text><path d="M161.5,1365.1365 L161.5,1552.0497 L141.5,1556.0497 L161.5,1560.0497 L161.5,1746.9628 A0,0 0 0 0 161.5,1746.9628 L575.5,1746.9628 A0,0 0 0 0 575.5,1746.9628 L575.5,1375.1365 L565.5,1365.1365 L161.5,1365.1365 A0,0 0 0 0 161.5,1365.1365 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M565.5,1365.1365 L565.5,1375.1365 L575.5,1375.1365 L565.5,1365.1365 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234" x="167.5" y="1384.0335">MANDATORY INTERFACE CONTRACT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364" x="167.5" y="1401.7395">Embed is NOT a shared foundry service &#8212; each AI application</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382" x="167.5" y="1419.4455">implements its own embedding. However, ALL implementations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="167.5" y="1437.1516">MUST conform to this contract:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="167.5" y="1454.8576">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="298" x="167.5" y="1472.5636">Required Inputs (what Chunk MUST produce):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314" x="167.5" y="1490.2696">- RAGChunkSet with chunk_id, document_id, trace_id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288" x="167.5" y="1507.9756">- trust_score (0-1, derived from Prepare-Doc IQA)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341" x="167.5" y="1525.6816">- ocr_engine_provenance (rooted in Prepare-Doc routing)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="167.5" y="1543.3877">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="393" x="167.5" y="1561.0937">Required Vector Store Metadata (what apps MUST preserve):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245" x="167.5" y="1578.7997">- chunk_id (must be searchable/filterable)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247" x="167.5" y="1596.5057">- trust_score (for retrieval quality filtering)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283" x="167.5" y="1614.2117">- ocr_engine_provenance (for audit/debugging)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322" x="167.5" y="1631.9177">- document_id + trace_id (for cross-service traceability)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="167.5" y="1649.6238">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156" x="167.5" y="1667.3298">Apps are free to choose:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154" x="326.5" y="1667.3298">embedding model, vector</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242" x="167.5" y="1685.0358">dimensions, similarity metric, index type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3" x="167.5" y="1702.7418">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="100" x="167.5" y="1720.4478">Prose contract:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160" x="270.5" y="1720.4478">chunk-embed-contract.md</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="32" x="167.5" y="1738.1538">ADR:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308" x="202.5" y="1738.1538">docs/ADRs/0029-prepare-doc-scope-boundaries.md</text><ellipse cx="130.5" cy="1556.0497" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="130.5" cy="1556.0497" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="89.1358" y2="109.1358"/><polygon fill="#181818" points="126.5,99.1358,130.5,109.1358,134.5,99.1358,130.5,103.1358" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="178.1682" y2="198.1682"/><polygon fill="#181818" points="126.5,188.1682,130.5,198.1682,134.5,188.1682,130.5,192.1682" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="401.6449" y2="421.6449"/><polygon fill="#181818" points="126.5,411.6449,130.5,421.6449,134.5,411.6449,130.5,415.6449" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="267.2005" y2="316.2684"/><polygon fill="#181818" points="126.5,306.2684,130.5,316.2684,134.5,306.2684,130.5,310.2684" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="653.4657" y2="673.4657"/><polygon fill="#181818" points="126.5,663.4657,130.5,673.4657,134.5,663.4657,130.5,667.4657" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="742.4981" y2="762.4981"/><polygon fill="#181818" points="126.5,752.4981,130.5,762.4981,134.5,752.4981,130.5,756.4981" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="490.6772" y2="551.7452"/><polygon fill="#181818" points="126.5,541.7452,130.5,551.7452,134.5,541.7452,130.5,545.7452" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="1043.3512" y2="1063.3512"/><polygon fill="#181818" points="126.5,1053.3512,130.5,1063.3512,134.5,1053.3512,130.5,1057.3512" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="1132.3836" y2="1152.3836"/><polygon fill="#181818" points="126.5,1142.3836,130.5,1152.3836,134.5,1142.3836,130.5,1146.3836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="896.9069" y2="957.9748"/><polygon fill="#181818" points="126.5,947.9748,130.5,957.9748,134.5,947.9748,130.5,951.9748" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="1237.76" y2="1269.76"/><polygon fill="#181818" points="126.5,1259.76,130.5,1269.76,134.5,1259.76,130.5,1263.76" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="130.5" x2="130.5" y1="1355.1365" y2="1545.0497"/><polygon fill="#181818" points="126.5,1535.0497,130.5,1545.0497,134.5,1535.0497,130.5,1539.0497" style="stroke:#181818;stroke-width:1.0;"/><!--SRC=[VLNRRkCs47ttLmosG96aLfpshSwJcsIt0JR9rl4sA60WeAcnn4OYjIHbhriKw5C_eEWNxfVq32N5JWhq8OXCSIxdd9cZQ6B5T56szec-_FKtpPgcCbf5uonTrIlESsEBALqu6xtIaHwSVrfNRhkqHpVAvYewloDZ8_krqanV_lo7L5LHmpvJJKCyf21JDnNNR6FA7QXkGoJjxDhv-dWq2a_6DighcaAfShULaBMg0X-ygPrrklIkPeg-FNoJyrgrLLpmvpYhJ66b3bMyZaWSbSU_wPmrcmtJBUgfolp6kTo-TBgLo-EbdS_U9HhkEOvfuT7U3KTlT03KDOfs91sV8zSb0szjBFfGlc31KLMi4scJfJKsvyy4TiYgcaC3Of1ZfGBdX1k