<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1275px" preserveAspectRatio="none" style="width:551px;height:1275px;background:#FFFFFF;" version="1.1" viewBox="0 0 551 1275" width="551px" zoomAndPan="magnify"><title>Project D - Embedding, Indexing &amp; RAG Vector Store Integration</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="508.457" x="20" y="32.9951">Project D - Embedding, Indexing &amp; RAG Vector Store Integration</text><ellipse cx="275.7285" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.0977" x="159.6797" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.0977" x="169.6797" y="108.4355">Receive NormalizedTextDocument,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.709" x="169.6797" y="122.4043">RAGChunkSet, TrustMetrics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.0918" x="169.6797" y="136.373">(from Project C)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="197.2402" x="177.1084" y="169.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.4141" x="187.1084" y="190.3418">Determine target collection /</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.4805" x="187.1084" y="204.3105">index and namespace</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.2402" x="187.1084" y="218.2793">(based on project/app config)</text><rect fill="none" height="206.0781" style="stroke:#000000;stroke-width:1.5;" width="214.0938" x="168.6816" y="241.1094"/><path d="M352,241.1094 L352,250.4063 L342,260.4063 L168.6816,260.4063 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.3184" x="171.6816" y="255.1045">Chunk filtering &amp; routing</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="194.0938" x="178.6816" y="277.4063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.0938" x="188.6816" y="298.5449">Filter or down-weight chunks</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.377" x="188.6816" y="312.5137">with low trust_score or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.5547" x="188.6816" y="326.4824">high hallucination_risk</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109.3184" x="188.6816" y="340.4512">(if policy requires)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.1387" x="191.1592" y="373.2813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.1387" x="201.1592" y="394.4199">Optionally split or merge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.002" x="201.1592" y="408.3887">chunks for app-specific</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.7676" x="201.1592" y="422.3574">size constraints</text><rect fill="none" height="357.8281" style="stroke:#000000;stroke-width:1.5;" width="216.8711" x="167.293" y="457.1875"/><path d="M337.2881,457.1875 L337.2881,466.4844 L327.2881,476.4844 L167.293,476.4844 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.9951" x="170.293" y="471.1826">Embedding generation</text><rect fill="#F1F1F1" height="89.8438" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="169.877" x="190.79" y="493.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="149.877" x="200.79" y="514.623">Select embedding model</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.0273" x="200.79" y="528.5918">based on:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.2949" x="200.79" y="542.5605">- document domain/type</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.0508" x="200.79" y="556.5293">- multilingual needs</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="84.6504" x="200.79" y="570.498">- model policy</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.2891" x="188.584" y="603.3281"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.2891" x="198.584" y="624.4668">Generate embeddings for</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.6836" x="198.584" y="638.4355">accepted chunks</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.9902" x="198.584" y="652.4043">(batch processing)</text><rect fill="#F1F1F1" height="117.7813" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="196.8711" x="177.293" y="685.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176.8711" x="187.293" y="706.373">Attach embedding metadata:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="61.459" x="187.293" y="720.3418">- chunk_id</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.6406" x="187.293" y="734.3105">- document_id</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="79.0078" x="187.293" y="748.2793">- page_range</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.0254" x="187.293" y="762.248">- section hierarchy</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="78.9199" x="187.293" y="776.2168">- trust scores</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.7852" x="187.293" y="790.1855">- OCR engine provenance</text><rect fill="none" height="301.9531" style="stroke:#000000;stroke-width:1.5;" width="225.9941" x="162.7314" y="825.0156"/><path d="M337.5596,825.0156 L337.5596,834.3125 L327.5596,844.3125 L162.7314,844.3125 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.8281" x="165.7314" y="839.0107">Vector store operations</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="205.9941" x="172.7314" y="861.3125"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.9941" x="182.7314" y="882.4512">Write embeddings + metadata</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.2246" x="182.7314" y="896.4199">into configured vector DB</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.6602" x="182.7314" y="910.3887">(e.g., pgvector, Milvus,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.2891" x="182.7314" y="924.3574">Weaviate, etc.)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="201.2715" x="175.0928" y="957.1875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="181.2715" x="185.0928" y="978.3262">Update any secondary indices</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.75" x="185.0928" y="992.2949">(e.g., keyword index,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.8828" x="185.0928" y="1006.2637">section-level catalog)</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="178.5078" x="186.4746" y="1039.0938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.5078" x="196.4746" y="1060.2324">Record ingestion statistics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.8652" x="196.4746" y="1074.2012">for monitoring:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="11.4492" x="196.4746" y="1088.1699">1.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.1465" x="211.7383" y="1088.1699">chunks, avg trust,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.4141" x="196.4746" y="1102.1387">pages processed</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="148.373" x="201.542" y="1146.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.373" x="211.542" y="1168.1074">Emit ingestion result:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.0254" x="211.542" y="1182.0762">- collection / index ID</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113.4023" x="211.542" y="1196.0449">- document handle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="122.0742" x="211.542" y="1210.0137">- summary statistics</text><ellipse cx="275.7285" cy="1253.8438" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="275.7285" cy="1253.8438" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="271.7285,77.2969,275.7285,87.2969,279.7285,77.2969,275.7285,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="149.2031" y2="169.2031"/><polygon fill="#181818" points="271.7285,159.2031,275.7285,169.2031,279.7285,159.2031,275.7285,163.2031" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="353.2813" y2="373.2813"/><polygon fill="#181818" points="271.7285,363.2813,275.7285,373.2813,279.7285,363.2813,275.7285,367.2813" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="231.1094" y2="277.4063"/><polygon fill="#181818" points="271.7285,267.4063,275.7285,277.4063,279.7285,267.4063,275.7285,271.4063" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="583.3281" y2="603.3281"/><polygon fill="#181818" points="271.7285,593.3281,275.7285,603.3281,279.7285,593.3281,275.7285,597.3281" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="665.2344" y2="685.2344"/><polygon fill="#181818" points="271.7285,675.2344,275.7285,685.2344,279.7285,675.2344,275.7285,679.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="435.1875" y2="493.4844"/><polygon fill="#181818" points="271.7285,483.4844,275.7285,493.4844,279.7285,483.4844,275.7285,487.4844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="937.1875" y2="957.1875"/><polygon fill="#181818" points="271.7285,947.1875,275.7285,957.1875,279.7285,947.1875,275.7285,951.1875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="1019.0938" y2="1039.0938"/><polygon fill="#181818" points="271.7285,1029.0938,275.7285,1039.0938,279.7285,1029.0938,275.7285,1033.0938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="803.0156" y2="861.3125"/><polygon fill="#181818" points="271.7285,851.3125,275.7285,861.3125,279.7285,851.3125,275.7285,855.3125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="1114.9688" y2="1146.9688"/><polygon fill="#181818" points="271.7285,1136.9688,275.7285,1146.9688,279.7285,1136.9688,275.7285,1140.9688" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.7285" x2="275.7285" y1="1222.8438" y2="1242.8438"/><polygon fill="#181818" points="271.7285,1232.8438,275.7285,1242.8438,279.7285,1232.8438,275.7285,1236.8438" style="stroke:#181818;stroke-width:1;"/><!--SRC=[NLJ1KXin3BtdApHqfjDE4xY74oMKuK3f02sNdSaOMxkhufLTMvkGTlhlbNUN47f975jwUkz9Yf1uX6yf_4Ghi885N7IFw1nnCuShTlYi9tWFjsUNy4D3Ge8x_K1z4soI4Geyc-KducYIwI2tneLjoQcDptZmqWKEjasXGv3K7xuuh4tlvHwVvSnJmnsoWCTQ55XCqg_bBLga3SBNa3hZwJUw4hqAjY_1yugLttdRyzCToXpkKv_b6YMHpHL_gBNeNkBvnrF5Mw5WweYLYqaD2jZWlJwh6ZYfc8fmCEo0JOSv6ekAysWoEj28E6ATc1Wra