# Image Preprocessing Detection System CI Pipeline
# Optimized for computer vision and image quality assessment
#
# CI FOCUS: Code Quality & Multi-Version Testing
# This workflow focuses on code quality, formatting, and comprehensive testing
# with TIERED TESTING STRATEGY for cost optimization.
#
# TIERED TESTING STRATEGY (Cost Optimization):
#   PR TESTING (Fast Feedback):
#     - Python 3.11, 3.12 only (2 versions)
#     - Duration: ~10-15 minutes
#     - Cost: ~$0.08-0.12 per PR
#
#   WEEKLY COMPREHENSIVE (Main Branch + Schedule):
#     - Python 3.10, 3.11, 3.12, 3.13, 3.14 (all 5 versions)
#     - Duration: ~20-25 minutes
#     - Cost: ~$0.16-0.20 per run (4 runs/month = $0.64-0.80/month)
#
#   Savings: 50% reduction in CI minutes for PRs
#
# SECURITY SCANS (See security-analysis.yml):
#   - Bandit: Python static security analysis
#   - Safety: Python dependency CVE scanning
#   - CodeQL: Advanced security analysis
#   - Dependency Review: PR-based vulnerability detection

name: CI

on:
  workflow_dispatch:  # Manual trigger for testing
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC (comprehensive testing)

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ENVIRONMENT: true
  UV_CACHE_DIR: ~/.cache/uv
  MYPY_CACHE_DIR: ~/.cache/mypy

jobs:
  # Enhanced setup for image processing dependencies
  setup-optimized:
    name: Setup with Image Processing Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      uv-hash: ${{ steps.cache-key.outputs.uv-hash }}
      pyproject-hash: ${{ steps.cache-key.outputs.pyproject-hash }}
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free up disk space early
        run: |
          echo "🧹 Freeing up disk space before dependency operations..."
          # Remove unnecessary pre-installed software
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo "📊 Disk space before caching/installation:"
          df -h

      - name: Generate cache keys
        id: cache-key
        run: |
          echo "uv-hash=${{ hashFiles('**/uv.lock') }}" >> "$GITHUB_OUTPUT"
          echo "pyproject-hash=${{ hashFiles('**/pyproject.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Image processing optimized caching strategy
      - name: Cache UV dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: cv-deps-uv-${{ runner.os }}-${{ steps.cache-key.outputs.uv-hash }}
          restore-keys: |
            cv-deps-uv-${{ runner.os }}-

      - name: Install dependencies with image processing libraries
        run: |
          # Install main dependencies including opencv, numpy, pymupdf, pytorch
          uv sync --extra dev --extra ml

          # Verify image processing dependencies
          uv run python -c "import cv2; print(f'OpenCV version: {cv2.__version__}')"
          uv run python -c "import numpy; print(f'NumPy version: {numpy.__version__}')"
          uv run python -c "import pymupdf; print(f'PyMuPDF version: {pymupdf.__version__}')"
          uv run python -c "import torch; print(f'PyTorch version: {torch.__version__}')"

      - name: Image processing dependency validation
        run: |
          echo "🖼️  Validating image processing dependencies..."
          uv run python -c "
          import sys
          required_deps = ['cv2', 'numpy', 'pymupdf', 'pydantic', 'structlog']
          optional_deps = ['PIL', 'matplotlib']

          print('🔍 Core Dependencies:')
          for dep in required_deps:
              try:
                  mod = __import__(dep)
                  version = getattr(mod, '__version__', 'unknown')
                  print(f'✅ {dep} ({version}): OK')
              except ImportError as e:
                  print(f'❌ {dep}: FAILED - {e}')
                  sys.exit(1)

          print('\n🎯 Optional Dependencies:')
          for dep in optional_deps:
              try:
                  __import__(dep)
                  print(f'✅ {dep}: Available')
              except ImportError:
                  print(f'⚠️  {dep}: Not installed (optional)')

          print('\n🎉 All core dependencies validated')
          "

      - name: Clean up disk space
        run: |
          echo "🧹 Cleaning up disk space..."
          # Clear only pip cache (preserve UV cache for GitHub Actions caching)
          pip cache purge 2>/dev/null || true
          # Remove unnecessary pre-installed software
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          # Clean up Docker (if any)
          docker system prune -af 2>/dev/null || true
          # Show final disk usage
          echo "📊 Disk space after cleanup:"
          df -h

  # Comprehensive testing with image processing focus - Multi-version testing with nox
  # COST OPTIMIZATION: Tiered testing strategy
  # - PR: Test only 3.11, 3.12 (fast feedback)
  # - Main/Schedule: Test all versions 3.10-3.14 (comprehensive)
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-optimized
    strategy:
      matrix:
        # Conditional matrix based on event type
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.11", "3.12"]') || fromJson('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
      fail-fast: false

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space before dependency installation..."
          # Remove unnecessary pre-installed software
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          # Show disk space
          df -h

      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: cv-deps-uv-${{ runner.os }}-${{ needs.setup-optimized.outputs.uv-hash }}
          restore-keys: |
            cv-deps-uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra ml

      - name: Install system dependencies for image processing
        run: |
          echo "📦 Installing system dependencies for PDF/image processing..."
          sudo apt-get update
          sudo apt-get install -y libmagic-dev poppler-utils
        continue-on-error: true

      # Run comprehensive test suite using UV for faster execution
      # Python 3.14 is experimental - pyarrow doesn't support it yet (upstream issue)
      - name: Create reports directory
        run: mkdir -p reports

      - name: Run image processing test suite
        run: |
          echo "🧪 Running image quality assessment tests on Python ${{ matrix.python-version }}..."
          # CI runs ALL tests (override pyproject.toml local-dev marker filter)
          # -m "": Run all tests including slow/benchmark
          uv run pytest -v \
            -m "" \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:reports/lcov.info \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -o junit_family=xunit2 \
            --tb=short \
            --maxfail=10
        env:
          CI_ENVIRONMENT: true
        # Python 3.14 is allowed to fail due to upstream dependency compatibility (pyarrow)
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      # Note: Coverage upload moved to dedicated codecov.yml and qlty.yml workflows
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            reports/lcov.info
            htmlcov/

  # Enhanced quality checks for image processing system
  quality-checks:
    name: Quality Checks & Security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: setup-optimized
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space before dependency installation..."
          # Remove unnecessary pre-installed software
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          # Show disk space
          df -h

      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: cv-deps-uv-${{ runner.os }}-${{ needs.setup-optimized.outputs.uv-hash }}
          restore-keys: |
            cv-deps-uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra ml

      - name: Quality checks via nox
        run: |
          echo "🔍 Running strict type checking..."
          uv run mypy src --config-file=pyproject.toml --cache-dir=${{ env.MYPY_CACHE_DIR }}

      - name: Code formatting validation
        run: |
          echo "🧹 Validating code formatting..."
          uv run ruff format --check

      - name: Linting with enhanced rules
        run: |
          echo "🔧 Running enhanced linting..."
          uv run ruff check . --config=pyproject.toml

      # Note: Security scanning (Bandit, Safety) moved to security-analysis.yml workflow
      # This eliminates duplicate scans and consolidates security tooling

  # Success validation
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [setup-optimized, test, quality-checks]
    if: always()
    steps:
      - name: Validate CI Results
        run: |
          if [[ "${{ needs.setup-optimized.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.quality-checks.result }}" == "success" ]]; then
            echo "✅ Image Preprocessing Detector CI Pipeline - All Checks Passed"
            echo "🖼️  Image quality assessment validated"
            echo "🔒 Security scans and quality checks completed"
            echo "🎯 Ready for deployment"
          else
            echo "❌ Image Preprocessing Detector CI Pipeline Failed"
            echo "setup-optimized: ${{ needs.setup-optimized.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "quality-checks: ${{ needs.quality-checks.result }}"
            exit 1
          fi

  # LLM Governance & Assumption Verification
  llm-governance:
    name: LLM Governance & Assumption Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rad-tags: ${{ steps.check-tags.outputs.rad_tags }}
      llm-tags: ${{ steps.check-tags.outputs.llm_tags }}
      total-tags: ${{ steps.check-tags.outputs.total_tags }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for unverified assumption tags
        id: check-tags
        run: |
          echo "::group::Scanning for Unverified Assumption Tags"

          # Check for RAD tags (Layer 1: Production Runtime Risks)
          CRITICAL_TAGS=$(grep -r "#CRITICAL" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          ASSUME_TAGS=$(grep -r "#ASSUME" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          EDGE_TAGS=$(grep -r "#EDGE" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")

          # Check for LLM debt tags (Layer 2: LLM Development Debt)
          LLM_MOCK=$(grep -r "#LLM-MOCK" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          LLM_PLACEHOLDER=$(grep -r "#LLM-PLACEHOLDER" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          LLM_LOGIC=$(grep -r "#LLM-LOGIC" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          LLM_SCAFFOLD=$(grep -r "#LLM-SCAFFOLD" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          LLM_INFERRED=$(grep -r "#LLM-INFERRED" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")
          LLM_TEST_FIRST=$(grep -r "#LLM-TEST-FIRST" --include="*.py" src/ 2>/dev/null | wc -l || echo "0")

          TOTAL_RAD=$((CRITICAL_TAGS + ASSUME_TAGS))
          TOTAL_LLM=$((LLM_MOCK + LLM_PLACEHOLDER + LLM_LOGIC + LLM_SCAFFOLD + LLM_INFERRED + LLM_TEST_FIRST))
          TOTAL_TAGS=$((TOTAL_RAD + TOTAL_LLM))

          echo "rad_tags=$TOTAL_RAD" >> $GITHUB_OUTPUT
          echo "llm_tags=$TOTAL_LLM" >> $GITHUB_OUTPUT
          echo "total_tags=$TOTAL_TAGS" >> $GITHUB_OUTPUT

          echo "### Assumption Tag Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Layer 1 (Production Runtime Risks):**" >> $GITHUB_STEP_SUMMARY
          echo "- #CRITICAL tags: $CRITICAL_TAGS" >> $GITHUB_STEP_SUMMARY
          echo "- #ASSUME tags: $ASSUME_TAGS" >> $GITHUB_STEP_SUMMARY
          echo "- #EDGE tags: $EDGE_TAGS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Layer 2 (LLM Development Debt):**" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-MOCK: $LLM_MOCK" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-PLACEHOLDER: $LLM_PLACEHOLDER" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-LOGIC: $LLM_LOGIC" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-SCAFFOLD: $LLM_SCAFFOLD" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-INFERRED: $LLM_INFERRED" >> $GITHUB_STEP_SUMMARY
          echo "- #LLM-TEST-FIRST: $LLM_TEST_FIRST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total unverified tags: $TOTAL_TAGS**" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL_RAD" -gt 0 ]; then
            echo "::error::Found $TOTAL_RAD unverified production risk tags (#CRITICAL, #ASSUME)"
          fi

          if [ "$TOTAL_LLM" -gt 0 ]; then
            echo "::warning::Found $TOTAL_LLM unverified LLM debt tags"
          fi

          echo "::endgroup::"

      - name: Block PR if critical tags found
        if: steps.check-tags.outputs.rad_tags != '0'
        run: |
          echo "::error::PR blocked: Found ${{ steps.check-tags.outputs.rad_tags }} unverified production risk tags"
          echo ""
          echo "Please verify and remove these tags before merging:"
          grep -rn "#CRITICAL\|#ASSUME" --include="*.py" src/ || true
          echo ""
          echo "See CLAUDE.md for verification workflow"
          exit 1

      - name: Detect LLM anti-patterns
        run: |
          echo "::group::LLM Anti-Pattern Detection"

          # Hardcoded localhost/URLs
          echo "Checking for hardcoded localhost/URLs..."
          if grep -rE "(localhost|127\.0\.0\.1|http://|https://)" --include="*.py" src/ | \
             grep -v "#LLM-PLACEHOLDER" | grep -v "^[[:space:]]*#"; then
            echo "::warning::Found hardcoded URLs without #LLM-PLACEHOLDER tag"
          fi

          # Hardcoded secrets patterns
          echo "Checking for potential hardcoded secrets..."
          if grep -rE "(api_key|password|secret|token)\s*=\s*[\"'][^\"']+[\"']" --include="*.py" src/ | \
             grep -v "#LLM-PLACEHOLDER" | grep -v "^[[:space:]]*#"; then
            echo "::error::Potential hardcoded secret detected"
            exit 1
          fi

          # Magic numbers
          echo "Checking for magic numbers..."
          MAGIC_NUMBERS=$(grep -rE "\b[0-9]{2,}\b" --include="*.py" src/ | \
                          grep -v "#LLM-PLACEHOLDER" | \
                          grep -v "^[[:space:]]*#" | \
                          wc -l || echo "0")

          if [ "$MAGIC_NUMBERS" -gt 10 ]; then
            echo "::warning::Found $MAGIC_NUMBERS potential magic numbers without constants"
          fi

          echo "::endgroup::"

  # Required status check for branch protection
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [setup-optimized, test, quality-checks, llm-governance]
    if: always()
    steps:
      - name: Image Preprocessing Detector CI Gate
        run: |
          if [[ "${{ needs.setup-optimized.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.quality-checks.result }}" == "success" && \
                "${{ needs.llm-governance.result }}" == "success" ]]; then
            echo "✅ Image Preprocessing Detection System - Production Ready"
            echo "🖼️  IQA detector accuracy validated"
            echo "🔐 Security standards met"
            echo "⚡ Performance optimized for image processing"
            echo "🤖 LLM governance checks passed"
          else
            echo "❌ CI Gate - Quality Standards Not Met"
            echo "🚫 Cannot proceed to production deployment"
            echo "setup-optimized: ${{ needs.setup-optimized.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "quality-checks: ${{ needs.quality-checks.result }}"
            echo "llm-governance: ${{ needs.llm-governance.result }}"
            exit 1
          fi
