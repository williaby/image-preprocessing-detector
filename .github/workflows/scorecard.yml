# OpenSSF Scorecard for Image Preprocessing Detector
# Security posture assessment and supply chain security validation

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Monday at 9:00 AM UTC (aligned with template)
    - cron: '0 9 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal permissions at workflow level; job-level permissions grant what's needed
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Required for uploading results to GitHub Code Scanning
      security-events: write
      # Required for OIDC token generation (scorecard uses this for trusted publishing)
      id-token: write
      # Required for reading repository contents
      contents: read
      # Required for reading branch protection rules
      actions: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          # Allow scorecard to make necessary API calls
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            api.scorecard.dev:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            index.docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for accurate analysis

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish results for public repositories
          publish_results: true
          # Optional: Use GitHub PAT for more accurate branch protection checks
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload Scorecard results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          sarif_file: scorecard-results.sarif

      - name: Upload Scorecard results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error
