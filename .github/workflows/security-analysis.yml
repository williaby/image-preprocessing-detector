# Comprehensive Security Analysis for Image Preprocessing Detector
# Enhanced security scanning for image and PDF processing protection
#
# CONSOLIDATION STRATEGY (Option 2: Aggressive Consolidation)
# This workflow provides centralized security scanning, eliminating duplications:
#
# WORKFLOW SCANS (Centralized Here):
#   - CodeQL: Python security-extended and quality queries
#   - Dependency Review: PR-based dependency vulnerability detection
#   - Bandit: Python static security analysis
#   - Safety: Python dependency CVE scanning
#   - Image Processing Security: Custom validation for file handling
#
# EXTERNAL GITHUB APPS (Complementary - No Duplication):
#   - Semgrep Cloud Platform: Advanced SAST with better UI/tracking
#   - GitGuardian: Secrets detection in commits
#   - OpenSSF Scorecard: Supply chain security assessment
#
# REMOVED DUPLICATIONS:
#   - Semgrep workflow step (now using Semgrep App)
#   - Bandit/Safety from ci.yml (consolidated here)
#   - CodeQL standalone check (using workflow version with custom queries)
#
# BENEFITS:
#   - Saves ~10-12 minutes per PR
#   - Single source of truth for security findings
#   - Better separation: CI focuses on code quality, this workflow on security

name: Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
    # No paths filter - workflow must always run to satisfy required status check
    # Individual jobs conditionally skip when no security-relevant files changed
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:  # Manual trigger

permissions: read-all

env:
  POETRY_VERSION: 2.1.2

jobs:
  # Detect if security-relevant files changed in this PR
  detect-changes:
    name: Detect Security-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      security_files: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for security-relevant file changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            security:
              - '**/*.py'
              - '.github/workflows/security-analysis.yml'
              - 'pyproject.toml'
              - 'poetry.lock'

  # CodeQL Analysis for Image Processing Systems
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
      actions: read
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python for Image Processing Dependencies
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@45a07fb13736b3465f4a3f04d3ad26f8689a8b18 # v1.4.1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      # Install only main dependencies for CodeQL analysis
      - name: Install Image Processing Dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "📦 Installing image processing dependencies for security analysis..."
          poetry install --only main --no-interaction

          # Verify critical security-sensitive packages
          poetry run python -c "
          import sys
          critical_deps = ['cv2', 'numpy', 'PIL', 'pymupdf', 'pydantic']
          for dep in critical_deps:
              try:
                  __import__(dep.replace('-', '_'))
                  print(f'✅ Security-critical dependency {dep}: Available')
              except ImportError:
                  print(f'⚠️ Security-critical dependency {dep}: Not found (may be optional)')
          "

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          languages: python
          queries: security-extended,security-and-quality
          config: |
            paths:
              - src
            paths-ignore:
              - tests
              - validation
              - scripts
            queries:
              - uses: security-extended
              - uses: security-and-quality

      - name: Build CodeQL Database
        uses: github/codeql-action/autobuild@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          category: "/language:python"
          upload: true

  # Dependency vulnerability scanning
  dependency-security:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review for Image Processing Libraries
        uses: actions/dependency-review-action@4081bf99e2866ebe428fc0477b69eb4fcda7220a # v4.5.0
        with:
          # Moderate threshold for image processing systems
          fail-on-severity: moderate
          license-check: true
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0

  # Comprehensive security tooling
  security-scanning:
    name: Multi-Tool Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@45a07fb13736b3465f4a3f04d3ad26f8689a8b18 # v1.4.1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --with dev --no-interaction

      # Bandit static analysis for image processing code
      - name: Bandit Security Analysis
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🔒 Running Bandit security analysis for image processing system..."
          poetry run bandit -r src \
            -f json -o bandit-report.json \
            -c pyproject.toml || true

          # Also generate human-readable output
          poetry run bandit -r src -c pyproject.toml || true

      # Safety dependency vulnerability scanning
      - name: Safety Vulnerability Scan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🛡️ Scanning for known vulnerabilities in image processing dependencies..."

          # Install poetry-plugin-export (required for poetry export in Poetry 2.0+)
          poetry self add poetry-plugin-export==1.8.0

          # Export requirements for safety scanning
          poetry export -f requirements.txt --output requirements-scan.txt

          # Run safety scan
          poetry run safety check \
            --file requirements-scan.txt \
            --json --output safety-report.json || true

          # Human readable output
          poetry run safety check \
            --file requirements-scan.txt || true

      # Note: Semgrep scanning provided by Semgrep Cloud Platform GitHub App
      # This eliminates duplicate scanning and provides better UI/tracking

      # Upload security scan artifacts
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            safety-report.json
            requirements-scan.txt

  # Image processing specific security validations
  image-processing-security:
    name: Image Processing Security Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@45a07fb13736b3465f4a3f04d3ad26f8689a8b18 # v1.4.1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install Dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --with dev --no-interaction

      # Validate file processing security
      - name: Validate File Processing Security
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "📸 Validating image processing security..."

          poetry run python -c "
          import os
          import pathlib

          print('🔒 Image Processing Security Validation:')

          # Validate path sanitization patterns
          try:
              from pathlib import Path
              test_path = Path('/tmp/test/../etc/passwd')
              resolved = test_path.resolve()
              print(f'✅ Path sanitization available: {resolved}')
          except Exception as e:
              print(f'⚠️  Path sanitization validation: {e}')

          # Validate image processing libraries are safe
          try:
              import cv2
              import numpy as np
              print(f'✅ OpenCV version: {cv2.__version__}')
              print(f'✅ NumPy version: {np.__version__}')
          except ImportError as e:
              print(f'⚠️  Image processing library validation: {e}')

          print('🎯 Image processing security validation completed')
          "

      # Check for hardcoded secrets in image processing code
      - name: Scan for Hardcoded Secrets
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🔐 Scanning for hardcoded secrets..."
          poetry run python -c "
          import re
          import os

          secret_patterns = [
              r'(?i)(api_key|api-key|apikey)\s*[=:]\s*[\"\']\w+[\"\']',
              r'(?i)(password|pwd|secret|key|token)\s*[=:]\s*[\"\']\w+[\"\']',
          ]

          findings = []
          for root, dirs, files in os.walk('src'):
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                              for i, line in enumerate(content.split('\n'), 1):
                                  for pattern in secret_patterns:
                                      if re.search(pattern, line) and 'example' not in line.lower():
                                          findings.append(f'{filepath}:{i}')
                      except:
                          pass

          if findings:
              print(f'⚠️  Found {len(findings)} potential secrets - review manually')
          else:
              print('✅ No hardcoded secrets detected in source code')
          "

  # Security gate success validation
  security-gate-success:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [detect-changes, codeql-analysis, dependency-security, security-scanning, image-processing-security]
    if: always()
    steps:
      - name: Security Gate Results
        run: |
          echo "🔒 Image Preprocessing Detector Security Analysis Results:"
          echo "Security Files Changed: ${{ needs.detect-changes.outputs.security_files }}"
          echo "CodeQL Analysis: ${{ needs.codeql-analysis.result }}"
          echo "Dependency Security: ${{ needs.dependency-security.result }}"
          echo "Security Scanning: ${{ needs.security-scanning.result }}"
          echo "Image Processing Security: ${{ needs.image-processing-security.result }}"

          # Helper function to check if job result is acceptable (success or skipped)
          is_acceptable() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          # All jobs must be either success or skipped (not failed or cancelled)
          if is_acceptable "${{ needs.codeql-analysis.result }}" && \
             is_acceptable "${{ needs.dependency-security.result }}" && \
             is_acceptable "${{ needs.image-processing-security.result }}"; then

            if [[ "${{ needs.detect-changes.outputs.security_files }}" == "true" ]]; then
              echo "✅ Security gate passed - image processing system meets security standards"
              echo "📸 Image processing security validated"
              echo "🔐 File handling secured"
            else
              echo "✅ Security gate passed - no security-relevant files changed"
              echo "📄 Documentation or configuration changes only"
            fi
          else
            echo "❌ Security gate failed - review security findings"
            exit 1
          fi
