# Comprehensive Security Analysis for Image Preprocessing Detector
# Enhanced security scanning for image and PDF processing protection
#
# CONSOLIDATION STRATEGY (Option 2: Aggressive Consolidation)
# This workflow provides centralized security scanning, eliminating duplications:
#
# WORKFLOW SCANS (Centralized Here):
#   - CodeQL: Python security-extended and quality queries
#   - Dependency Review: PR-based dependency vulnerability detection
#   - Bandit: Python static security analysis
#   - Safety: Python dependency CVE scanning
#   - Image Processing Security: Custom validation for file handling
#
# EXTERNAL GITHUB APPS (Complementary - No Duplication):
#   - Semgrep Cloud Platform: Advanced SAST with better UI/tracking
#   - GitGuardian: Secrets detection in commits
#   - OpenSSF Scorecard: Supply chain security assessment
#
# REMOVED DUPLICATIONS:
#   - Semgrep workflow step (now using Semgrep App)
#   - Bandit/Safety from ci.yml (consolidated here)
#   - CodeQL standalone check (using workflow version with custom queries)
#
# BENEFITS:
#   - Saves ~10-12 minutes per PR
#   - Single source of truth for security findings
#   - Better separation: CI focuses on code quality, this workflow on security

name: Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  # No paths filter - workflow must always run to satisfy required status check
  # Individual jobs conditionally skip when no security-relevant files changed
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:  # Manual trigger

permissions: read-all

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  # Detect if security-relevant files changed in this PR
  detect-changes:
    name: Detect Security-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      security_files: ${{ steps.filter.outputs.security }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for security-relevant file changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            security:
              - '**/*.py'
              - '.github/workflows/security-analysis.yml'
              - 'pyproject.toml'
              - 'uv.lock'

  # CodeQL Analysis for Image Processing Systems
  # Note: Always runs (even for docs-only changes) to satisfy repository rule requirements
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    # Removed conditional: if: needs.detect-changes.outputs.security_files == 'true'
    # Repository rules require CodeQL results for all PRs
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
      actions: read
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python for Image Processing Dependencies
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Install only main dependencies for CodeQL analysis
      - name: Install Image Processing Dependencies
        run: |
          echo "📦 Installing image processing dependencies for security analysis..."
          uv sync --no-dev

          # Verify critical security-sensitive packages
          uv run python -c "
          import sys
          critical_deps = ['cv2', 'numpy', 'PIL', 'pymupdf', 'pydantic']
          for dep in critical_deps:
              try:
                  __import__(dep.replace('-', '_'))
                  print(f'✅ Security-critical dependency {dep}: Available')
              except ImportError:
                  print(f'⚠️ Security-critical dependency {dep}: Not found (may be optional)')
          "

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          languages: python
          queries: security-extended,security-and-quality
          config: |
            paths:
              - src
            paths-ignore:
              - tests
              - validation
              - scripts
            queries:
              - uses: security-extended
              - uses: security-and-quality

      - name: Build CodeQL Database
        uses: github/codeql-action/autobuild@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          category: "/language:python"
          upload: true

  # Dependency vulnerability scanning
  dependency-security:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only run on pull_request events (requires PR context for base_ref/head_ref)
    # GitHub Dependency Review Action cannot run on schedule or workflow_dispatch events
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.security_files == 'true'
    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review for Image Processing Libraries
        uses: actions/dependency-review-action@4081bf99e2866ebe428fc0477b69eb4fcda7220a # v4.5.0
        with:
          # Moderate threshold for image processing systems
          fail-on-severity: moderate
          license-check: true
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0
          # Allow DVC dev dependencies (not distributed with CC-BY-SA-4.0-licensed package)
          # - grandalf: GPL-3.0-or-later (DVC pipeline DAG visualization)
          # - text-unidecode: Dual-licensed Artistic-1.0-Perl OR GPL-1.0/2.0
          # - billiard: No license detected (multiprocessing, likely BSD/MIT)
          # - dulwich: Apache-2.0 or GPL-2.0+ (Git impl, Apache preferred)
          # - pygit2: GPL-2.0 with linking exception (libgit2 wrapper)
          # - zc-lockfile: No license detected (Zope component, likely ZPL)
          # - llvmlite: Compound SPDX (BSD-2-Clause AND Apache-2.0 AND LLVM-exception)
          # - easyocr: Apache-2.0 (OpenSSF score ~4/10 due to lack of branch
          #     protection, signed releases, and fuzzing; 14K+ GitHub stars,
          #     actively maintained, widely used for multilingual OCR)
          # See docs/security/LICENSE-EXCEPTIONS.md for detailed justification
          allow-dependencies-licenses: >-
            pkg:pypi/grandalf,
            pkg:pypi/text-unidecode,
            pkg:pypi/billiard,
            pkg:pypi/dulwich,
            pkg:pypi/pygit2,
            pkg:pypi/zc-lockfile,
            pkg:pypi/llvmlite,
            pkg:pypi/easyocr

  # Comprehensive security tooling
  security-scanning:
    name: Multi-Tool Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      # Bandit static analysis for image processing code
      - name: Bandit Security Analysis
        run: |
          echo "🔒 Running Bandit security analysis for image processing system..."
          uv run bandit -r src \
            -f json -o bandit-report.json \
            -c pyproject.toml || true

          # Also generate human-readable output
          uv run bandit -r src -c pyproject.toml || true

      # Safety dependency vulnerability scanning
      - name: Safety Vulnerability Scan
        run: |
          echo "🛡️ Scanning for known vulnerabilities in image processing dependencies..."

          # Export requirements for safety scanning
          uv pip compile pyproject.toml -o requirements-scan.txt

          # Run safety scan
          uv run safety check \
            --file requirements-scan.txt \
            --json --output safety-report.json || true

          # Human readable output
          uv run safety check \
            --file requirements-scan.txt || true

      # Note: Semgrep scanning provided by Semgrep Cloud Platform GitHub App
      # This eliminates duplicate scanning and provides better UI/tracking

      # Upload security scan artifacts
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            safety-report.json
            requirements-scan.txt

  # Image processing specific security validations
  image-processing-security:
    name: Image Processing Security Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --extra dev

      # Validate file processing security
      - name: Validate File Processing Security
        run: |
          echo "📸 Validating image processing security..."

          uv run python -c "
          import os
          import pathlib

          print('🔒 Image Processing Security Validation:')

          # Validate path sanitization patterns
          try:
              from pathlib import Path
              test_path = Path('/tmp/test/../etc/passwd')
              resolved = test_path.resolve()
              print(f'✅ Path sanitization available: {resolved}')
          except Exception as e:
              print(f'⚠️  Path sanitization validation: {e}')

          # Validate image processing libraries are safe
          try:
              import cv2
              import numpy as np
              print(f'✅ OpenCV version: {cv2.__version__}')
              print(f'✅ NumPy version: {np.__version__}')
          except ImportError as e:
              print(f'⚠️  Image processing library validation: {e}')

          print('🎯 Image processing security validation completed')
          "

      # Check for hardcoded secrets in image processing code
      - name: Scan for Hardcoded Secrets
        run: |
          echo "🔐 Scanning for hardcoded secrets..."
          uv run python -c "
          import re
          import os

          secret_patterns = [
              r'(?i)(api_key|api-key|apikey)\s*[=:]\s*[\"\']\w+[\"\']',
              r'(?i)(password|pwd|secret|key|token)\s*[=:]\s*[\"\']\w+[\"\']',
          ]

          findings = []
          for root, dirs, files in os.walk('src'):
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                              for i, line in enumerate(content.split('\n'), 1):
                                  for pattern in secret_patterns:
                                      if re.search(pattern, line) and 'example' not in line.lower():
                                          findings.append(f'{filepath}:{i}')
                      except:
                          pass

          if findings:
              print(f'⚠️  Found {len(findings)} potential secrets - review manually')
          else:
              print('✅ No hardcoded secrets detected in source code')
          "

  # OSV-Scanner vulnerability detection (matches OpenSSF Scorecard)
  osv-scanner:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.security_files == 'true'
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV Scanner
        id: osv-scan
        uses: google/osv-scanner-action/osv-scanner-action@9bb69575e74019c2ad085a1860787043adf47ccb # v2.2.4
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output=osv-results.json
        # OSV Scanner exits with code 1 for both actual vulnerabilities AND "unused ignores"
        # We need to continue and check the actual results to distinguish these cases
        continue-on-error: true

      - name: Check OSV Results for HIGH/CRITICAL
        run: |
          echo "🔍 Analyzing OSV scan results for HIGH/CRITICAL vulnerabilities..."
          echo "OSV Scanner exit outcome: ${{ steps.osv-scan.outcome }}"

          # Check if results file exists
          if [ ! -f osv-results.json ]; then
            echo "❌ ERROR: OSV results file not found - scan failed"
            echo "This indicates a scan failure, not 'no vulnerabilities found'"
            exit 1
          fi

          # Validate file is not empty
          if [ ! -s osv-results.json ]; then
            echo "❌ ERROR: OSV results file is empty - scan failed"
            exit 1
          fi

          # Check for HIGH/CRITICAL vulnerabilities (respects osv-scanner.toml)
          python3 << 'EOF'
          import json
          import sys

          def extract_severity(vuln):
              """Extract severity from OSV vulnerability with robust fallback handling."""
              # Try direct 'severity' field first (most common)
              severity = vuln.get('severity')
              if severity:
                  severity_str = severity if isinstance(severity, str) else str(severity)
                  # Map MODERATE to MEDIUM for consistency
                  return 'MEDIUM' if severity_str.upper() == 'MODERATE' else severity_str.upper()

              # Try database_specific field (some OSV entries use this)
              db_specific = vuln.get('database_specific', {})
              if isinstance(db_specific, dict):
                  severity = db_specific.get('severity')
                  if severity:
                      severity_str = severity if isinstance(severity, str) else str(severity)
                      return 'MEDIUM' if severity_str.upper() == 'MODERATE' else severity_str.upper()

              # Try severity list (some entries have multiple severities)
              severities = vuln.get('severities', [])
              if isinstance(severities, list) and severities:
                  # Take the highest severity if multiple exist
                  severity_levels = {'CRITICAL': 4, 'HIGH': 3, 'MEDIUM': 2, 'MODERATE': 2, 'LOW': 1, 'UNKNOWN': 0}
                  max_severity = 'UNKNOWN'
                  max_level = 0
                  for sev_entry in severities:
                      if isinstance(sev_entry, dict):
                          sev = sev_entry.get('severity', '').upper()
                      else:
                          sev = str(sev_entry).upper()
                      level = severity_levels.get(sev, 0)
                      if level > max_level:
                          max_level = level
                          max_severity = sev
                  return 'MEDIUM' if max_severity == 'MODERATE' else max_severity

              return 'UNKNOWN'

          try:
              with open('osv-results.json', 'r') as f:
                  results = json.load(f)

              # Validate OSV JSON structure
              print('🔍 Validating OSV JSON structure...')
              if not isinstance(results, dict):
                  print(f'❌ ERROR: Expected dict, got {type(results).__name__}')
                  sys.exit(1)

              # Extract vulnerabilities
              vulnerabilities = results.get('results', [])
              print(f'📋 Found {len(vulnerabilities)} vulnerability groups in results')

              if not vulnerabilities:
                  print('✅ No vulnerabilities found (osv-scanner.toml exceptions applied)')
                  sys.exit(0)

              # Count by severity with robust parsing
              high_crit = []
              medium = []
              low = []
              parse_errors = []

              for idx, vuln_group in enumerate(vulnerabilities):
                  if not isinstance(vuln_group, dict):
                      parse_errors.append(f'Group {idx}: Expected dict, got {type(vuln_group).__name__}')
                      continue

                  packages = vuln_group.get('packages', [])
                  for pkg_idx, pkg in enumerate(packages):
                      if not isinstance(pkg, dict):
                          parse_errors.append(
                              f'Group {idx}, Pkg {pkg_idx}: Expected dict, got {type(pkg).__name__}'
                          )
                          continue

                      for vuln_idx, vuln in enumerate(pkg.get('vulnerabilities', [])):
                          if not isinstance(vuln, dict):
                              parse_errors.append(
                                  f'Group {idx}, Pkg {pkg_idx}, Vuln {vuln_idx}: '
                                  f'Expected dict, got {type(vuln).__name__}'
                              )
                              continue

                          severity = extract_severity(vuln)
                          vuln_id = vuln.get('id', 'UNKNOWN')

                          if severity in ['HIGH', 'CRITICAL']:
                              high_crit.append(f"{vuln_id} ({severity})")
                          elif severity == 'MEDIUM':
                              medium.append(f"{vuln_id} ({severity})")
                          else:
                              low.append(f"{vuln_id} ({severity})")

              # Report any parsing errors (informational)
              if parse_errors:
                  print(f'\n⚠️  {len(parse_errors)} structure validation warnings:')
                  for err in parse_errors[:3]:  # Show first 3
                      print(f'   - {err}')

              # Report findings
              total = len(high_crit) + len(medium) + len(low)
              print(f'\n📊 OSV Scanner Results: {total} total vulnerabilities found')

              if high_crit:
                  print(f'❌ HIGH/CRITICAL: {len(high_crit)} vulnerabilities')
                  for v in high_crit[:5]:  # Show first 5
                      print(f'   - {v}')
                  print(f'\n❌ Build FAILED: HIGH/CRITICAL vulnerabilities must be fixed')
                  sys.exit(1)

              if medium:
                  print(f'⚠️  MEDIUM: {len(medium)} vulnerabilities (not blocking)')

              if low:
                  print(f'ℹ️  LOW: {len(low)} vulnerabilities (informational)')

              print('\n✅ No HIGH/CRITICAL vulnerabilities found')

          except json.JSONDecodeError as e:
              print(f'❌ ERROR: Invalid JSON in OSV results: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ ERROR: Unexpected error processing OSV results: {e}')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF

      - name: Upload OSV Scanner Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-scanner-results
          path: osv-results.json
          if-no-files-found: warn

  # Security gate success validation
  security-gate-success:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - codeql-analysis
      - dependency-security
      - security-scanning
      - osv-scanner
      - image-processing-security
    if: always()
    steps:
      - name: Security Gate Results
        run: |
          echo "🔒 Image Preprocessing Detector Security Analysis Results:"
          echo "Event Type: ${{ github.event_name }}"
          echo "Security Files Changed: ${{ needs.detect-changes.outputs.security_files }}"
          echo "CodeQL Analysis: ${{ needs.codeql-analysis.result }}"
          echo "Dependency Security: ${{ needs.dependency-security.result }}"
          echo "Security Scanning: ${{ needs.security-scanning.result }}"
          echo "OSV Scanner: ${{ needs.osv-scanner.result }}"
          echo "Image Processing Security: ${{ needs.image-processing-security.result }}"

          # Helper function to check if job result is acceptable (success or skipped)
          # Note: dependency-security is skipped on scheduled runs (no PR context)
          is_acceptable() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          # All jobs must be either success or skipped (not failed or cancelled)
          if is_acceptable "${{ needs.codeql-analysis.result }}" && \
             is_acceptable "${{ needs.dependency-security.result }}" && \
             is_acceptable "${{ needs.security-scanning.result }}" && \
             is_acceptable "${{ needs.osv-scanner.result }}" && \
             is_acceptable "${{ needs.image-processing-security.result }}"; then

            if [[ "${{ needs.detect-changes.outputs.security_files }}" == "true" ]]; then
              echo "✅ Security gate passed - image processing system meets security standards"
              echo "📸 Image processing security validated"
              echo "🔐 File handling secured"

              # Note if dependency review was skipped (scheduled runs only)
              if [[ "${{ needs.dependency-security.result }}" == "skipped" ]]; then
                echo "ℹ️  Dependency Review skipped (scheduled run - no PR context available)"
              fi
            else
              echo "✅ Security gate passed - no security-relevant files changed"
              echo "📄 Documentation or configuration changes only"
            fi
          else
            echo "❌ Security gate failed - review security findings"
            exit 1
          fi
