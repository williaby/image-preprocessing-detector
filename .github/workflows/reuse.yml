name: REUSE Compliance

on:
  pull_request:
    paths:
      - "**/*"
      - "REUSE.toml"
      - "LICENSES/**"
      - ".github/workflows/reuse.yml"
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  reuse:
    name: Check REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@3ae3c6bdf1257ab19397fab11fd3312144692083 # v4.0.0

      - name: Generate REUSE SPDX
        if: success()
        run: |
          docker run --rm --volume $(pwd):/data fsfe/reuse:latest spdx --output /data/reuse-spdx.json

      - name: Upload REUSE SPDX
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reuse-spdx
          path: reuse-spdx.json
          retention-days: 90

  validate-licenses:
    name: Validate License Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Apache-2.0 license
        run: |
          if [ ! -f "LICENSES/Apache-2.0.txt" ]; then
            echo "Error: Apache-2.0.txt missing from LICENSES/"
            exit 1
          fi

      - name: Check CC-BY-4.0 license
        run: |
          if [ ! -f "LICENSES/CC-BY-4.0.txt" ]; then
            echo "Error: CC-BY-4.0.txt missing from LICENSES/"
            exit 1
          fi

      - name: Check CC0-1.0 license
        run: |
          if [ ! -f "LICENSES/CC0-1.0.txt" ]; then
            echo "Error: CC0-1.0.txt missing from LICENSES/"
            exit 1
          fi

      - name: Verify REUSE.toml exists
        run: |
          if [ ! -f "REUSE.toml" ]; then
            echo "Error: REUSE.toml missing from repository root"
            exit 1
          fi
