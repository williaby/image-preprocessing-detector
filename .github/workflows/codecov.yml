# Codecov Coverage Upload Workflow
# Dedicated workflow for uploading test coverage reports to Codecov

name: Codecov

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  upload-coverage:
    name: Upload Coverage to Codecov
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read        # Required for downloading artifacts
      actions: read         # Required for workflow_run artifact download

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # NOTE: No checkout needed - workflow only downloads artifacts and uploads to Codecov
      # Checking out PR code with workflow_run would create a security vulnerability
      # See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-results-3.12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-3.12
          name: Image Preprocessing Detector Coverage (Python 3.12)
          verbose: true
          commit_parent: ${{ github.event.workflow_run.head_sha }}
        continue-on-error: true

      - name: Coverage upload status
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f coverage.xml ]; then
            echo "✅ Coverage report uploaded successfully"
            echo "📊 View coverage at: https://app.codecov.io/gh/${GH_REPOSITORY}"
          else
            echo "⚠️ Coverage report not found"
            echo "This may indicate the test suite did not run or failed"
          fi
