# Semantic Release for Image Preprocessing Detector
# Automated release with semantic versioning, changelog generation, and SLSA provenance
#
# This workflow uses the org-level reusable python-release.yml workflow for:
# - Automatic version bumping based on Conventional Commits
# - Auto-generated CHANGELOG from commit messages
# - SLSA provenance generation (supply chain security)
# - PyPI publishing with OIDC trusted publishing
# - GitHub Release creation with artifacts
#
# Conventional Commit Format:
# - feat: triggers MINOR version bump (0.X.0)
# - fix: triggers PATCH version bump (0.0.X)
# - feat!: or fix!: triggers MAJOR version bump (X.0.0)
# - docs/chore/test/refactor: no version bump, changelog only
#
# Migration from Manual Tags:
# - Previous workflow required manual git tags (v*.*.*)
# - New workflow automatically determines version from commits
# - Force release options available for manual control

name: Semantic Release

on:
  push:
    branches:
      - main  # Auto-release on merge to main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release type (leave empty for auto)'
        required: false
        type: choice
        options:
          - ''  # Auto-determine from commits
          - patch  # Force 0.0.X bump
          - minor  # Force 0.X.0 bump
          - major  # Force X.0.0 bump

# Prevent concurrent releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # Required for creating releases and tags
  issues: write  # Required for semantic-release
  pull-requests: write  # Required for semantic-release
  id-token: write  # Required for OIDC/SLSA
  attestations: write  # Required for SLSA provenance

jobs:
  release:
    name: Semantic Release Pipeline
    uses: ByronWilliamsCPA/.github/.github/workflows/python-release.yml@3bf8bf5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    with:
      # Python version for building
      python-version: '3.12'

      # Project structure
      source-directory: 'src'

      # Enable semantic versioning (Conventional Commits)
      semantic-release: true

      # Force release type (if manual dispatch)
      force-release: ${{ github.event.inputs.force_release || '' }}

      # PyPI publishing configuration
      publish-to-pypi: true
      pypi-package-name: 'image-preprocessing-detector'

      # Run tests before release
      run-tests: true
      coverage-threshold: 80

      # SLSA provenance generation
      generate-slsa-provenance: true

      # Changelog generation
      changelog-generator: 'auto'  # Auto-generate from commits

  release-summary:
    name: Release Summary
    needs: release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report release status
        run: |
          echo "## Semantic Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.release.result }}" == "success" ]; then
            echo "### Release Published ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Version automatically determined from Conventional Commits" >> $GITHUB_STEP_SUMMARY
            echo "- CHANGELOG.md updated with release notes" >> $GITHUB_STEP_SUMMARY
            echo "- SLSA provenance generated for supply chain security" >> $GITHUB_STEP_SUMMARY
            echo "- Package published to PyPI (if version bumped)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.release.result }}" == "skipped" ]; then
            echo "### No Release Required ℹ️" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No commits since last release require a version bump." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To force a release, use workflow_dispatch with force_release input." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Release Failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Conventional Commit Types" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat:\` - New feature (MINOR bump)" >> $GITHUB_STEP_SUMMARY
          echo "- \`fix:\` - Bug fix (PATCH bump)" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat!:\` or \`fix!:\` - Breaking change (MAJOR bump)" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs:\`, \`chore:\`, \`test:\` - No version bump" >> $GITHUB_STEP_SUMMARY
