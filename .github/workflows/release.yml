# Signed Release Workflow
# Creates signed releases with artifacts for image-preprocessing-detector
#
# Triggered by: version tags (v*.*.*)
# Produces: GitHub Release with signed tag and build artifacts

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

permissions: read-all

jobs:
  create-release:
    name: Create Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write  # Required for creating releases
      id-token: write  # Required for sigstore signing
      actions: read    # Explicitly restrict other permissions
      checks: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up Python 3.12
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distribution packages
        run: |
          uv build
          ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Release version: ${VERSION}"

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract changelog section for this version
          if grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            awk "/## \[${VERSION}\]/,/## \[.*\]/{
              if (/## \[${VERSION}\]/) print;
              else if (/## \[.*\]/) exit;
              else print
            }" CHANGELOG.md > release_notes.md
          else
            echo "## ${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for full details." \
              >> release_notes.md
          fi

          echo "📝 Release notes:"
          cat release_notes.md

      - name: Verify tag signature
        run: |
          # Verify that the tag is signed (SSH or GPG)
          git tag -v "${{ steps.version.outputs.version }}" 2>&1 || \
          git verify-tag "${{ steps.version.outputs.version }}" 2>&1 || \
          echo "⚠️  Tag signature verification not available (expected for SSH-signed tags)"

      - name: Create GitHub Release
        # v2.2.0
        uses: >-
          softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: >-
            ${{
              contains(steps.version.outputs.version, 'alpha') ||
              contains(steps.version.outputs.version, 'beta') ||
              contains(steps.version.outputs.version, 'rc')
            }}
          files: |
            dist/*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: release-artifacts-${{ steps.version.outputs.version }}
          path: |
            dist/
            release_notes.md
          retention-days: 90
          if-no-files-found: error

      - name: Release summary
        run: |
          echo "## 🎉 Release ${{ steps.version.outputs.version }} Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat dist/SHA256SUMS >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
