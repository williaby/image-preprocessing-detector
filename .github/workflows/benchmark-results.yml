name: Benchmark Results Auto-Update

# This workflow updates README.md from already-committed benchmark results.
# Benchmarks must be run locally (datasets are too large for CI) and results
# committed to the reports/ directory before this workflow runs.

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
      - develop
    paths:
      - 'reports/**/*.json'  # Trigger when new results are committed

permissions:
  contents: read  # Default to read-only at workflow level

jobs:
  update-readme:
    name: Update README from Committed Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Job-level permission for committing README updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for proper git operations

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check for committed results
        id: check-results
        run: |
          if [ -d "reports" ] && [ -n "$(find reports -name '*.json' 2>/dev/null)" ]; then
            echo "results_found=true" >> "$GITHUB_OUTPUT"
            echo "✓ Found committed benchmark results"
            find reports -name "results.json" | head -10
          else
            echo "results_found=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No benchmark results found in reports/"
            echo "Run benchmarks locally and commit results to reports/ directory"
          fi

      - name: Update README with Results
        if: steps.check-results.outputs.results_found == 'true'
        run: |
          uv run python -m benchmarks.runners.update_readme

          # Show diff for verification
          git diff benchmarks/README.md || echo "No changes to README"

      - name: Generate Benchmark Badges
        if: steps.check-results.outputs.results_found == 'true'
        run: |
          # Create badges directory
          mkdir -p .github/badges

          # Generate badge data (will be used by shields.io endpoint)
          uv run python -m benchmarks.runners.generate_badges

      - name: Commit and Push README Updates
        if: github.event_name != 'pull_request' && steps.check-results.outputs.results_found == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add only README and badges (results already committed)
          git add benchmarks/README.md .github/badges/ || true

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "✓ No changes to README (already up to date)"
            exit 0
          fi

          # Commit with detailed message
          git commit -m "docs(benchmarks): Auto-update README from committed results

          - Updated benchmark metrics table
          - Generated status badges
          - Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - Trigger: ${{ github.event_name }}

          [skip ci]"

          git push

      - name: Create Summary
        if: steps.check-results.outputs.results_found == 'true'
        run: |
          # Count committed results
          SUITES=$(find reports/ -name "results.json" 2>/dev/null | wc -l)

          # List suite directories
          BENCHMARKS=""
          for dir in reports/*/; do
            suite=$(basename "$dir")
            latest=$(find "$dir" -name "results.json" | sort -r | head -1)
            if [ -n "$latest" ]; then
              timestamp=$(basename "$(dirname "$latest")")
              BENCHMARKS="${BENCHMARKS}- ✓ **${suite}** (latest: ${timestamp})
          "
            fi
          done

          # Write summary using grouped redirects
          {
            echo "## 📊 Benchmark Results Auto-Update"
            echo ""
            echo "**Update Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "**Committed Results**: ${SUITES} benchmark suites"
            echo ""
            echo "### Updated Benchmarks"
            echo ""
            echo "$BENCHMARKS"
            echo ""
            echo "📈 **View updated README**: [benchmarks/README.md](benchmarks/README.md#quick-metrics-summary)"
            echo ""
            echo "---"
            echo ""
            echo "ℹ️ **Note**: Benchmarks are run locally (datasets too large for CI)."
            echo "This workflow only updates the README from committed results."
          } >> "$GITHUB_STEP_SUMMARY"
