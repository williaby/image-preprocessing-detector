# PyPI Publishing Workflow
# Publishes image-preprocessing-detector to PyPI using Trusted Publishing
#
# Setup Instructions:
# 1. Go to https://pypi.org/manage/account/publishing/
# 2. Add a new publisher:
#    - PyPI Project Name: image-preprocessing-detector
#    - Owner: williaby
#    - Repository: image-preprocessing-detector
#    - Workflow: publish-pypi.yml
#    - Environment: release (optional but recommended)
# 3. Create a release tag (v*.*.*)
#
# For TestPyPI setup:
# 1. Go to https://test.pypi.org/manage/account/publishing/
# 2. Follow same steps as above

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      use_testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distribution packages
        run: |
          uv build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Verify package metadata
        run: |
          pip install twine==6.2.0
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.use_testpypi)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed to match PyPI Trusted Publisher configuration
    # Re-enable if you create 'release' environment with protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Packages to publish:"
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          {
            echo "## 🎉 Published to PyPI!"
            echo ""
            echo "**Project**: https://pypi.org/project/image-preprocessing-detector/"
            echo ""
            echo "**Install**: \`pip install image-preprocessing-detector\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.use_testpypi
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed for simplified TestPyPI testing
    # Re-enable for production with environment protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Test packages to publish:"
          ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          URL="https://test.pypi.org/project/image-preprocessing-detector/"
          INSTALL_CMD="pip install --index-url https://test.pypi.org/simple/"
          INSTALL_CMD="${INSTALL_CMD} image-preprocessing-detector"
          {
            echo "## 🧪 Published to TestPyPI!"
            echo ""
            echo "**Project**: ${URL}"
            echo ""
            echo "**Test Install**: \`${INSTALL_CMD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
