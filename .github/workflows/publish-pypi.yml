# PyPI Publishing Workflow
# Publishes image-preprocessing-detector to PyPI using Trusted Publishing
#
# Setup Instructions:
# 1. Go to https://pypi.org/manage/account/publishing/
# 2. Add a new publisher:
#    - PyPI Project Name: image-preprocessing-detector
#    - Owner: williaby
#    - Repository: image-preprocessing-detector
#    - Workflow: publish-pypi.yml
#    - Environment: release (optional but recommended)
# 3. Create a release tag (v*.*.*)
#
# For TestPyPI setup:
# 1. Go to https://test.pypi.org/manage/account/publishing/
# 2. Follow same steps as above

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      use_testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distribution packages
        run: |
          uv build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Verify package metadata
        run: |
          pip install twine==6.2.0
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.use_testpypi)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed to match PyPI Trusted Publisher configuration
    # Re-enable if you create 'release' environment with protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Packages to publish:"
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          {
            echo "## 🎉 Published to PyPI!"
            echo ""
            echo "**Project**: https://pypi.org/project/image-preprocessing-detector/"
            echo ""
            echo "**Install**: \`pip install image-preprocessing-detector\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.use_testpypi
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed for simplified TestPyPI testing
    # Re-enable for production with environment protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Test packages to publish:"
          ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          URL="https://test.pypi.org/project/image-preprocessing-detector/"
          INSTALL_CMD="pip install --index-url https://test.pypi.org/simple/"
          INSTALL_CMD="${INSTALL_CMD} image-preprocessing-detector"
          {
            echo "## 🧪 Published to TestPyPI!"
            echo ""
            echo "**Project**: ${URL}"
            echo ""
            echo "**Test Install**: \`${INSTALL_CMD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
