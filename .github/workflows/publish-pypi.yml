# PyPI Publishing Workflow
# Publishes image-preprocessing-detector to PyPI using Trusted Publishing
#
# Setup Instructions:
# 1. Go to https://pypi.org/manage/account/publishing/
# 2. Add a new publisher:
#    - PyPI Project Name: image-preprocessing-detector
#    - Owner: williaby
#    - Repository: image-preprocessing-detector
#    - Workflow: publish-pypi.yml
#    - Environment: release (optional but recommended)
# 3. Create a release tag (v*.*.*)
#
# For TestPyPI setup:
# 1. Go to https://test.pypi.org/manage/account/publishing/
# 2. Follow same steps as above

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      use_testpypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build distribution packages
        run: |
          uv build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Verify package metadata
        run: |
          pip install twine==6.2.0
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 5
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.use_testpypi)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed to match PyPI Trusted Publisher configuration
    # Re-enable if you create 'release' environment with protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Packages to publish:"
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          {
            echo "## 🎉 Published to PyPI!"
            echo ""
            echo "**Project**: https://pypi.org/project/image-preprocessing-detector/"
            echo ""
            echo "**Install**: \`pip install image-preprocessing-detector\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.use_testpypi
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment removed for simplified TestPyPI testing
    # Re-enable for production with environment protection rules

    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Test packages to publish:"
          ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

      - name: Publication summary
        run: |
          URL="https://test.pypi.org/project/image-preprocessing-detector/"
          INSTALL_CMD="pip install --index-url https://test.pypi.org/simple/"
          INSTALL_CMD="${INSTALL_CMD} image-preprocessing-detector"
          {
            echo "## 🧪 Published to TestPyPI!"
            echo ""
            echo "**Project**: ${URL}"
            echo ""
            echo "**Test Install**: \`${INSTALL_CMD}\`"
          } >> "$GITHUB_STEP_SUMMARY"
