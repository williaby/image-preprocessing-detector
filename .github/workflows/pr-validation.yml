# PR Validation for Image Preprocessing Detector
# Ensures dependency consistency and project standards compliance

name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-dependencies:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Fetch full history for accurate diff analysis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev

      # Validate image processing dependencies
      - name: Validate Image Processing Dependencies
        run: |
          echo "📸 Validating image processing dependencies..."

          uv run python -c "
          import sys

          # Critical dependencies for image processing
          critical_deps = {
              'cv2': 'OpenCV for computer vision',
              'numpy': 'Array operations',
              'PIL': 'Pillow for image I/O',
              'pymupdf': 'PDF rendering',
              'pydantic': 'Data validation'
          }

          # Optional but important dependencies
          optional_deps = {
              'torch': 'Deep learning backend (ML models)',
              'transformers': 'Transformer models (advanced detection)',
              'layoutparser': 'Document layout analysis'
          }

          print('📸 Image Processing Dependency Validation:')
          failed_deps = []

          for dep_name, description in critical_deps.items():
              try:
                  imported_module = __import__(dep_name)
                  version = getattr(imported_module, '__version__', 'unknown')
                  # Special handling for OpenCV version
                  if dep_name == 'cv2':
                      version = imported_module.__version__
                  print(f'✅ {dep_name} ({version}): {description}')
              except ImportError as e:
                  print(f'❌ {dep_name}: MISSING - {description}')
                  failed_deps.append(dep_name)

          print('\\n🎯 Optional Dependencies:')
          for dep_name, description in optional_deps.items():
              try:
                  imported_module = __import__(dep_name)
                  version = getattr(imported_module, '__version__', 'unknown')
                  print(f'✅ {dep_name} ({version}): {description}')
              except ImportError:
                  print(f'⚠️  {dep_name}: Not installed - {description} (optional)')

          if failed_deps:
              print(f'\\n🚨 Critical dependencies missing: {failed_deps}')
              sys.exit(1)
          else:
              print('\\n🎉 All critical image processing dependencies are available')
          "

      # Check for dependency changes and validate requirements sync
      - name: Check dependency changes
        id: deps-changed
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Check if uv.lock or pyproject.toml changed
          BASE_REF="origin/${PR_BASE_REF}"
          if git diff --name-only "$BASE_REF...HEAD" | grep -E "(uv\.lock|pyproject\.toml)"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Dependency files have changed in this PR"

            # Show what changed
            echo "🔍 Changes detected:"
            git diff --name-only "$BASE_REF...HEAD" \
              | grep -E "(uv\.lock|pyproject\.toml)" | while read file; do
              echo "  - $file"
            done
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No dependency changes detected"
          fi

      # Generate and validate requirements.txt if dependencies changed
      - name: Validate Requirements Sync
        if: steps.deps-changed.outputs.changed == 'true'
        run: |
          echo "🔄 Validating requirements.txt synchronization..."

          # Generate current requirements
          echo "Generating requirements.txt from uv.lock..."
          uv export --format requirements-txt --no-hashes > requirements.txt

          echo "Generating requirements-dev.txt from uv.lock..."
          uv export --format requirements-txt --no-hashes --extra dev > requirements-dev.txt

          # Check if generated files match committed files
          if ! git diff --exit-code requirements*.txt 2>/dev/null; then
            echo "::error::Requirements files are out of sync with uv.lock"
            echo "::error::This PR modifies dependencies but requirements.txt files don't match."
            echo ""
            echo "📋 Files needing update:"
            git diff --name-only requirements*.txt 2>/dev/null \
              || echo "  - requirements.txt files need to be created/updated"
            echo ""
            echo "🔧 To fix this:"
            echo "1. Run: uv export --format requirements-txt --no-hashes > requirements.txt"
            echo "2. Run: uv export --format requirements-txt --no-hashes --extra dev > requirements-dev.txt"
            echo "3. Commit the updated requirements files"
            echo "4. Push changes to this PR"
            exit 1
          else
            echo "✅ Requirements files are synchronized with uv.lock"
          fi

      # Validate project structure for image processing
      - name: Validate Project Structure
        run: |
          echo "🏗️ Validating image processing project structure..."

          required_dirs=(
            "src"
            "src/image_preprocessing_detector"
            "src/image_preprocessing_detector/ingestion"
            "src/image_preprocessing_detector/detection"
            "src/image_preprocessing_detector/correction"
            "src/image_preprocessing_detector/output"
            "tests"
            "docs"
          )

          required_files=(
            "pyproject.toml"
            "README.md"
            "CLAUDE.md"
          )

          echo "📁 Checking required directories:"
          missing_dirs=0
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "  ✅ $dir"
            else
              echo "  ❌ $dir (missing)"
              missing_dirs=$((missing_dirs + 1))
            fi
          done

          echo "📄 Checking required files:"
          missing_files=0
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ⚠️  $file (missing)"
              missing_files=$((missing_files + 1))
            fi
          done

          if [ $missing_dirs -gt 0 ]; then
            echo "::warning::Some required directories are missing"
          fi

          if [ $missing_files -gt 0 ]; then
            echo "::warning::Some recommended files are missing"
          fi

      # Security validation for image processing
      - name: Basic Security Validation
        run: |
          echo "🔒 Running basic security validation..."

          # Check for obvious security issues
          echo "🔍 Checking for potential security issues:"

          # Look for hardcoded secrets
          if find src -name "*.py" -exec grep -l "password.*=" {} + 2>/dev/null | head -5; then
            echo "⚠️  Potential hardcoded passwords found - please review"
          else
            echo "✅ No obvious hardcoded passwords detected"
          fi

          # Check for unsafe file operations
          if find src -name "*.py" -exec grep -l "open.*'w'" {} + 2>/dev/null | head -5; then
            echo "⚠️  File write operations found - ensure proper path validation"
          else
            echo "✅ No obvious unsafe file operations detected"
          fi

      # Code quality quick check
      - name: Quick Code Quality Check
        run: |
          echo "🧹 Running quick code quality checks..."

          # Check basic Python syntax
          echo "Checking Python syntax..."
          find src -name "*.py" -print0 | while IFS= read -r -d '' file; do
            if ! uv run python -m py_compile "$file" 2>&1; then
              echo "❌ $file: Syntax error"
              exit 1
            else
              echo "✅ $file: Valid syntax"
            fi
          done

          echo "✅ Basic code quality validation completed"

      # Skip validation if no changes
      - name: Skip Validation (No Changes)
        if: steps.deps-changed.outputs.changed == 'false'
        run: |
          echo "✅ No dependency changes - validation complete"
          echo "📝 This PR does not modify dependencies"
          echo "🚀 Standard CI pipeline will validate code changes"
