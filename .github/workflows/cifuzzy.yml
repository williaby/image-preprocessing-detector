# ClusterFuzzLite for Image Preprocessing Detector
# Continuous fuzzing for image/PDF processing security vulnerabilities

name: ClusterFuzzLite

on:
  # Fuzzing and mutation testing run weekly, not per PR, to keep PR CI fast and
  # cheap. Mutation testing is already weekly (mutation-testing.yml, Sunday 02:00
  # UTC); this runs five hours later so the two do not compete for runners.
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: Build & Run Fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          dry-run: false

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        if: steps.build.outcome == 'success'
        with:
          fuzz-seconds: 600
          mode: batch  # scheduled runs have no PR diff, so fuzz the whole project
          language: python
          output-sarif: true
          sanitizer: address

      - name: Upload Crash Artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzing-crashes
          path: out/artifacts
          retention-days: 7

      - name: Upload SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: sarif/cifuzz.sarif
        continue-on-error: true

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "🔍 ClusterFuzzLite Fuzzing Analysis Complete"
          echo "Build Status: ${{ steps.build.outcome }}"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Fuzzers built and executed for 600 seconds"
            echo "📸 Image/PDF processing modules tested for edge cases"
            echo "🔐 Security vulnerabilities detection active"
            echo "📊 Fuzzing harnesses: fuzz_pdf_loader, fuzz_image_loader, fuzz_text_gate"
          else
            echo "⚠️  Fuzzer build failed"
            echo "ℹ️  Check logs above for build errors"
            echo "   1. Ensure Clang and LLVM are installed"
            echo "   2. Verify fuzzing harnesses in /fuzz directory"
            echo "   3. Check Atheris installation succeeded"
          fi
