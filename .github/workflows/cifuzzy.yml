# CIFuzz (OSS-Fuzz) for Image Preprocessing Detector
# Fuzzing for image/PDF processing security vulnerabilities

name: CIFuzz

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  fuzzing:
    name: Build & Run Fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: image-preprocessing-detector
          language: python
        continue-on-error: true

      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        if: steps.build.outcome == 'success'
        with:
          fuzz-seconds: 600
          language: python
          output-sarif: true

      - name: Upload Crash Artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzing-crashes
          path: out/artifacts
          retention-days: 7

      - name: Upload SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          sarif_file: sarif/cifuzz.sarif
        continue-on-error: true

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "🔍 CIFuzz Fuzzing Analysis Complete"
          echo "Build Status: ${{ steps.build.outcome }}"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Fuzzers built and executed for 600 seconds"
            echo "📸 Image/PDF processing modules tested for edge cases"
            echo "🔐 Security vulnerabilities detection active"
          else
            echo "⚠️  Fuzzer build skipped - project not yet registered with OSS-Fuzz"
            echo "ℹ️  To enable fuzzing:"
            echo "   1. Register project at https://github.com/google/oss-fuzz"
            echo "   2. Create fuzzing harnesses in /fuzz directory"
            echo "   3. Add project.yaml and Dockerfile for OSS-Fuzz integration"
          fi
