# ClusterFuzzLite for Image Preprocessing Detector
# Continuous fuzzing for image/PDF processing security vulnerabilities

name: ClusterFuzzLite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: Build & Run Fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          # Note: Using Python 3.11 instead of 3.12 due to Atheris compatibility
          # Atheris native code doesn't support PRECALL opcode changes in Python 3.12
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libpoppler-cpp-dev poppler-utils

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install project dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --without dev --no-interaction

      - name: Install Atheris
        run: pip install atheris

      - name: Build Fuzzers
        id: build
        # Note: ClusterFuzzLite actions use @master, cannot pin to SHA (maintained by Google)
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: image-preprocessing-detector
          language: python
          dry-run: false

      - name: Run Fuzzers
        # Note: ClusterFuzzLite actions use @master, cannot pin to SHA (maintained by Google)
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        if: steps.build.outcome == 'success'
        with:
          oss-fuzz-project-name: image-preprocessing-detector
          fuzz-seconds: 600
          language: python
          output-sarif: true
          sanitizer: address

      - name: Upload Crash Artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzzing-crashes
          path: out/artifacts
          retention-days: 7

      - name: Upload SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.27.5
        with:
          sarif_file: sarif/cifuzz.sarif
        continue-on-error: true

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "🔍 ClusterFuzzLite Fuzzing Analysis Complete"
          echo "Build Status: ${{ steps.build.outcome }}"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Fuzzers built and executed for 600 seconds"
            echo "📸 Image/PDF processing modules tested for edge cases"
            echo "🔐 Security vulnerabilities detection active"
            echo "📊 Fuzzing harnesses: fuzz_pdf_loader, fuzz_image_loader, fuzz_text_gate"
          else
            echo "⚠️  Fuzzer build failed"
            echo "ℹ️  Check logs above for build errors"
            echo "   1. Ensure Clang and LLVM are installed"
            echo "   2. Verify fuzzing harnesses in /fuzz directory"
            echo "   3. Check Atheris installation succeeded"
          fi
