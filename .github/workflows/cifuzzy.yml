# ClusterFuzzLite for Image Preprocessing Detector
# Continuous fuzzing for image/PDF processing security vulnerabilities

name: ClusterFuzzLite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: Build & Run Fuzzers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Harden the runner (Audit outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          dry-run: false

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        if: steps.build.outcome == 'success'
        with:
          fuzz-seconds: 600
          language: python
          output-sarif: true
          sanitizer: address

      - name: Upload Crash Artifacts
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzing-crashes
          path: out/artifacts
          retention-days: 7

      - name: Upload SARIF Report
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: sarif/cifuzz.sarif
        continue-on-error: true

      - name: Fuzzing Summary
        if: always()
        run: |
          echo "🔍 ClusterFuzzLite Fuzzing Analysis Complete"
          echo "Build Status: ${{ steps.build.outcome }}"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Fuzzers built and executed for 600 seconds"
            echo "📸 Image/PDF processing modules tested for edge cases"
            echo "🔐 Security vulnerabilities detection active"
            echo "📊 Fuzzing harnesses: fuzz_pdf_loader, fuzz_image_loader, fuzz_text_gate"
          else
            echo "⚠️  Fuzzer build failed"
            echo "ℹ️  Check logs above for build errors"
            echo "   1. Ensure Clang and LLVM are installed"
            echo "   2. Verify fuzzing harnesses in /fuzz directory"
            echo "   3. Check Atheris installation succeeded"
          fi
