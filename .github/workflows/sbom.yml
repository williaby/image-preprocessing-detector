name: SBOM & Security Scan

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  push:
    branches: [main, develop]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # Weekly scan every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install cyclonedx-bom
        run: |
          pip install cyclonedx-bom==4.6.1

      - name: Export requirements for SBOM generation
        run: |
          # Export runtime dependencies (production)
          uv pip compile pyproject.toml -o requirements-runtime.txt

          # Export dev dependencies
          uv pip compile pyproject.toml --extra dev -o requirements-dev.txt

          # Export all dependencies (including optional groups)
          # NOTE: Cannot use --all-extras because `iqa` and `labeling` extras
          # declare conflicting `transformers` versions (==4.37.2 vs >=4.40.0)
          # in [tool.uv.conflicts]. uv pip compile does not honour conflict
          # declarations, so we enumerate extras explicitly, excluding `iqa`.
          # The only package missed is `pyiqa` itself (research-only tool).
          uv pip compile pyproject.toml \
            --extra dev --extra ml --extra fuzz --extra api --extra colab \
            --extra workers --extra labeling --extra language-detection \
            --extra ocr-labeling --extra synthetic --extra ood \
            -o requirements-complete.txt

      - name: Generate runtime SBOM (production dependencies)
        run: |
          cyclonedx-py requirements \
            --of json \
            -o sbom-runtime.json \
            requirements-runtime.txt

      - name: Generate development SBOM (dev dependencies)
        run: |
          cyclonedx-py requirements \
            --of json \
            -o sbom-dev.json \
            requirements-dev.txt

      - name: Generate complete SBOM (all dependencies)
        run: |
          cyclonedx-py requirements \
            --of json \
            -o sbom-complete.json \
            requirements-complete.txt

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            sbom-*.json
            requirements-*.txt
          retention-days: 90

  scan-runtime:
    name: Scan Runtime Dependencies
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sboms

      - name: Trivy SBOM scan (runtime)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: sbom
          scan-ref: sbom-runtime.json
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1  # Fail on CRITICAL/HIGH vulnerabilities

      - name: Trivy SBOM scan (runtime - detailed report)
        if: always()
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: sbom
          scan-ref: sbom-runtime.json
          format: sarif
          output: trivy-runtime-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          sarif_file: trivy-runtime-results.sarif
          category: trivy-runtime-deps

  scan-dev:
    name: Scan Development Dependencies
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sboms

      - name: Trivy SBOM scan (dev)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: sbom
          scan-ref: sbom-dev.json
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0  # Don't fail on dev dependency vulnerabilities (informational only)

      - name: Trivy SBOM scan (dev - detailed report)
        if: always()
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: sbom
          scan-ref: sbom-dev.json
          format: sarif
          output: trivy-dev-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ea9e4e37992a54ee68a9622e985e60c8e8f12d9f # v3.27.4
        with:
          sarif_file: trivy-dev-results.sarif
          category: trivy-dev-deps

  scan-complete:
    name: Scan Complete SBOM
    needs: generate-sbom
    runs-on: ubuntu-latest
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sboms

      - name: Trivy SBOM scan (complete)
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: sbom
          scan-ref: sbom-complete.json
          format: json
          output: trivy-complete-results.json

      - name: Upload complete scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-complete-scan
          path: trivy-complete-results.json
          retention-days: 90

  license-compliance:
    name: License Compliance Check
    needs: generate-sbom
    runs-on: ubuntu-latest
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sboms

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install license-checker
        run: |
          pip install cyclonedx-bom==4.6.1

      - name: Check licenses in runtime SBOM
        run: |
          echo "Checking runtime dependency licenses..."
          python -c "
          import json
          with open('sbom-runtime.json') as f:
              sbom = json.load(f)

          # Use precise SPDX license identifiers (exact match)
          forbidden_licenses = [
              'GPL-2.0-only', 'GPL-2.0-or-later',
              'GPL-3.0-only', 'GPL-3.0-or-later',
              'AGPL-3.0-only', 'AGPL-3.0-or-later'
          ]
          issues = []

          for component in sbom.get('components', []):
              licenses = component.get('licenses', [])
              for lic in licenses:
                  lic_id = lic.get('license', {}).get('id', '')
                  if lic_id in forbidden_licenses:
                      issues.append(f\"{component['name']}: {lic_id}\")

          if issues:
              print('WARNING: Found potentially incompatible licenses:')
              for issue in issues:
                  print(f'  - {issue}')
              # Don't fail, just warn
          else:
              print('All licenses compatible')
          "
