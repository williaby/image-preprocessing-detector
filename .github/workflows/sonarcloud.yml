---
# Image Detection - SonarCloud Analysis
# Continuous code quality and security analysis
#
# Features:
#   - Code quality metrics (bugs, code smells, technical debt)
#   - Security vulnerability detection (OWASP Top 10)
#   - Test coverage tracking
#   - Quality gate enforcement
#   - Pull request decoration
#
# SonarCloud Dashboard: https://sonarcloud.io/dashboard?id=williaby_image-preprocessing-detector
# Documentation: https://docs.sonarsource.com/sonarqube-cloud/
#
# Note: This workflow requires SONAR_TOKEN secret to be configured.
# If not configured, the workflow will skip with a helpful message.

name: SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  # Check if SONAR_TOKEN is configured before running analysis
  check-secrets:
    name: Check Configuration
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - name: Check for SONAR_TOKEN
        id: check
        env:
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          if [ "$HAS_SONAR_TOKEN" = "true" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is configured. SonarCloud analysis will run."
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not configured. Skipping SonarCloud analysis."
            echo "To enable SonarCloud:"
            echo "1. Create a project at https://sonarcloud.io"
            echo "2. Generate a token at https://sonarcloud.io/account/security"
            echo "3. Add SONAR_TOKEN as a repository secret"
          fi

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-token == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write  # Required for PR decoration

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Disable shallow clone for better analysis

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache UV dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run tests with coverage
        run: |
          # Generate coverage in Cobertura XML format for SonarCloud
          uv run pytest \
            --cov=src/image_preprocessing_detector \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-branch \
            -v
        continue-on-error: true  # Don't fail on test failures; let SonarCloud report them

      - name: Verify coverage report
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::error::Coverage report not found. Tests may have failed."
            echo "Workflow will continue to allow SonarCloud to analyze code quality,"
            echo "but coverage metrics will be unavailable for this run."
            # Note: We do NOT create a dummy coverage file as it masks test failures.
            # SonarCloud will proceed without coverage data and report accordingly.
          else
            echo "✓ Coverage report generated successfully"
            ls -lh coverage.xml
          fi

      - name: SonarCloud Scan
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # SonarCloud authentication
        with:
          args: >
            -Dsonar.organization=williaby
            -Dsonar.projectKey=williaby_image-preprocessing-detector
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/tests/**,**/validation/**,**/benchmarks/**,**/scripts/**

      - name: Check Quality Gate
        # nosemgrep: generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true  # Don't fail workflow, just report status

      - name: Quality Gate Summary
        if: always()
        run: |
          DASH_URL="https://sonarcloud.io/dashboard?id=williaby_image-preprocessing-detector"
          {
            echo "### SonarCloud Quality Gate"
            echo ""
            echo "View detailed results: $DASH_URL"
            echo ""
            echo "**Metrics analyzed:**"
            echo "- Code Quality (bugs, code smells, maintainability)"
            echo "- Security (vulnerabilities, security hotspots)"
            echo "- Test Coverage"
            echo "- Code Duplication"
            echo "- Technical Debt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-sonarcloud
          path: |
            coverage.xml
            .coverage
          retention-days: 7
