# Mutation Testing for Image Preprocessing Detector
# Validates test effectiveness using mutation testing with mutmut
#
# This workflow uses the org-level reusable python-mutation.yml workflow
# for standardized mutation testing with enhanced features:
# - Configurable mutation score threshold (80%)
# - HTML report generation
# - PR comment posting with educational content
# - JSON + text fallback parsing
# - Outputs for downstream jobs
#
# Mutation testing runs weekly to validate test quality without blocking development.
# Tests are "tested" by introducing small changes (mutations) and verifying tests catch them.

name: Mutation Testing

on:
  schedule:
    # Weekly on Sunday at 2:00 AM UTC (less resource contention)
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: 'Minimum mutation score threshold (0-100)'
        required: false
        default: '80'
        type: string

permissions: read-all

jobs:
  mutation:
    name: Mutation Testing
    uses: ByronWilliamsCPA/.github/.github/workflows/python-mutation.yml@main
    permissions:
      contents: read
      pull-requests: write  # Required for PR comments
    with:
      # Python version for mutation testing
      python-version: '3.12'

      # Project structure
      source-directory: 'src'
      test-directory: 'tests'

      # Mutation score threshold (80% - same as previous)
      mutation-threshold: ${{ github.event.inputs.mutation_threshold || 80 }}

      # Don't fail workflow on low score - just warn
      # This allows visibility without blocking development
      fail-under-threshold: false

      # Post results as PR comments (if triggered by PR)
      post-pr-comment: true

      # Mutation testing can be slow for CV code - allow 2 hours
      timeout-minutes: 120

      # Retain reports for 30 days (vs default 14)
      artifact-retention-days: 30

  mutation-summary:
    name: Mutation Testing Summary
    needs: mutation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report mutation results
        run: |
          echo "## Mutation Testing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mutation Score**: ${{ needs.mutation.outputs.mutation-score }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold**: 80%" >> $GITHUB_STEP_SUMMARY
          echo "**Passed**: ${{ needs.mutation.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What is Mutation Testing?" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mutation testing validates test effectiveness by introducing code changes" >> $GITHUB_STEP_SUMMARY
          echo "and verifying tests detect them. High mutation scores indicate robust tests." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Killed mutants**: Tests detected the change ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Survived mutants**: Tests did not detect the change ⚠️" >> $GITHUB_STEP_SUMMARY
