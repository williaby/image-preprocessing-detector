[project]
name = "image-preprocessing-detector"
version = "0.1.0"
description = "Intelligent image preprocessing detection system for RAG applications"
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
keywords = ["image-processing", "opencv", "document-analysis", "ocr-preprocessing", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core Image Processing
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # PDF Processing
    "pymupdf>=1.23.0",
    # CLI
    "click>=8.1.0",
    # Serverless GPU Compute (Phase 2+)
    "modal>=0.63.0",
    # Deep Learning (placeholder - will add specific versions after testing)
    # "torch>=2.0.0",
    # "torchvision>=0.15.0",
    # "ultralytics>=8.0.0",
    # "timm>=0.9.0",
    # Data Augmentation
    # "albumentations>=1.3.0",
    # OCR (for secondary analysis)
    # "pytesseract>=0.3.10",
    # Inference Optimization (will add in Phase 2/3)
    # "onnxruntime>=1.15.0",
    # API Framework (will add in Phase 4)
    # "fastapi>=0.100.0",
    # "uvicorn[standard]>=0.23.0",
    # "pydantic>=2.0.0",
    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "rich>=13.5.0",
    "opencv-python-headless (>=4.8.0,<5.0.0)",
    "huggingface-hub[cli]>=0.20.0,<1.0.0",  # <1.0 for transformers compatibility
    # pytesseract removed - not needed for Phase 1, will add back in Phase 2 for OCR analysis
    # "pytesseract (>=0.3.13,<0.4.0)",
    "gitpython (>=3.1.45,<4.0.0)",
    "pywavelets (>=1.4.0)",
    "defusedxml>=0.7.1",
    "fonttools>=4.60.2,<5.0.0",
    "werkzeug>=3.1.5",
    "urllib3>=2.6.3",
    "filelock>=3.20.1",
    # Note: ultralytics and onnxruntime-gpu moved to [ml] extra to reduce base install size
    # This allows fuzzing and lightweight installs without ~4GB of CUDA dependencies
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.82.0",
    "openpyxl>=3.1.0",  # Excel file parsing for annotation parsers
    # Code Quality
    "ruff>=0.9.0,<1.0.0",  # Equivalent to ^0.9.0 in Poetry (PEP 508 syntax)
    "mypy>=1.4.0",  # Legacy type checker (kept for reference)
    "basedpyright>=1.18.0",  # Modern type checker (strict, 3-5x faster than mypy)
    "vulture>=2.11",  # Dead code detection
    "interrogate>=1.7.0",  # Docstring coverage checker
    "types-pyyaml>=6.0.0",  # Type stubs for PyYAML
    # Pre-commit
    "pre-commit>=3.3.0",
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-gen-files>=0.5.0",
    "griffe-pydantic>=0.2.0",
    # Front matter validation tools
    "python-frontmatter>=1.1",
    "ruamel.yaml>=0.18.0",
    # Jupyter (for exploration)
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    # Manual validation UI (Milestone 10.3)
    "streamlit>=1.28.0",
    # Image metrics for benchmarking
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",  # ML utilities for metrics and evaluation
    "scipy>=1.14.0",  # v1.14.x supports Python 3.10-3.12
    # Safety for dependency scanning
    "safety>=3.7.0",
    # Nox for multi-version testing
    "nox>=2025.10.16",
    "uv>=0.5.0",  # Fast package manager for nox venv backend
    # Mutation testing
    "mutmut>=3.3.1",
    # Type stubs
    "types-pyyaml>=6.0.12",
    # ONNX for model export validation
    "onnx>=1.14.0",
    # Matplotlib for visualization
    "matplotlib>=3.10.0",
    # Dataset management
    "datasets>=4.4.1",
    "dvc[ssh]>=3.64.0",
    "kaggle>=1.7.4",
    # Code complexity analysis
    "radon>=6.0.1",
    "cbor2>=5.8.0",
    "filelock>=3.20.1",
    "marshmallow>=4.1.2",
]

ml = [
    # Machine Learning Dependencies (install separately for Phase 2/3)
    # Includes ~4GB of CUDA dependencies - use [fuzz] extra for lightweight installs
    "torch>=2.9.0",  # Updated to address GHSA-887c-mr87-cxwp (CVE-2025-3730)
    "torchvision>=0.24.0",  # Compatible with torch 2.9.0
    "doclayout-yolo",  # DocLayout-YOLO (YOLOv10-based) for Phase 3 layout detection
    "ultralytics>=8.3.230",  # YOLOv8/YOLO11 for layout detection (moved from base)
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "onnxruntime-gpu>=1.23.2,<2.0.0",  # GPU-accelerated inference (moved from base)
    "tensorboard>=2.12.0",  # Training monitoring
    # "genalog>=0.1.0",  # DISABLED: Conflicts with dev dependencies
    # Model artifact storage and versioning
    "google-cloud-storage>=2.10.0",
    "huggingface-hub>=0.20.0",
    "pyyaml>=6.0",
]

fuzz = [
    # Minimal dependencies for ClusterFuzzLite fuzzing
    # Excludes PyTorch/CUDA to fit in disk space constraints (~4GB saved)
    "atheris>=2.3.0",
    # Core deps already in base: pillow, numpy, pymupdf, opencv-python-headless
]

api = [
    # API Dependencies (install for Phase 4)
    "fastapi>=0.115.0",  # Updated to address PVE-2024-64930 (ReDoS vulnerability)
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.18",  # Updated to address CVE-2024-53981 and PVE-2024-99762
    "starlette>=0.49.1",  # Updated to address GHSA-7f5h-v6xp-fcq8 (O(n^2) DoS)
]

colab = [
    # Google Colab Training Dependencies (Phase 2-3)
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "doclayout-yolo",  # DocLayout-YOLO (YOLOv10-based) for Phase 3 layout detection
    "ultralytics>=8.0.0",  # YOLOv8 for Phase 6 layout-lite (lightweight)
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "onnxruntime>=1.15.0",
    "tensorboard>=2.12.0",  # Training monitoring
    "pyyaml>=6.0",          # Config file parsing
    "gdown>=4.7.0",         # Download from Google Drive
    "onnx>=1.17.0",         # ONNX model verification (CVE-2024-7776 fixed in 1.17.0)
]

workers = [
    # Distributed Worker Dependencies (Phase 4 - Week 17)
    # Requires Redis server to be available (docker, local install, or cloud)
    "celery>=5.4.0",        # Distributed task queue
    "redis>=5.0.0",         # Redis client for broker/backend
    "flower>=2.0.0",        # Celery monitoring dashboard (optional)
]

labeling = [
    # Labeling Workstreams Dependencies (Project A/B/C)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",  # HuggingFace transformers for model loading
    "accelerate>=0.25.0",    # Device management and mixed precision
    "bitsandbytes>=0.42.0",  # 4-bit/8-bit quantization (Linux only)
    "safetensors>=0.4.0",    # Safe tensor serialization
    "sentencepiece>=0.1.99", # Tokenizer for many models
    "peft>=0.7.0",           # Parameter-efficient fine-tuning (LoRA)
    "qwen-vl-utils>=0.0.8",  # Qwen VL image processing utilities
]
language-detection = [
    "easyocr>=1.7.2",
    "fasttext>=0.9.3",
    "lingua-language-detector>=2.1.1",
]

synthetic = [
    # Synthetic Document Generator Dependencies
    # Generates multi-script training data from OpenLID-v2 for SigLIP training
    #
    # SYSTEM DEPENDENCY REQUIRED: libraqm
    # Install via system package manager for HarfBuzz text shaping:
    #   Ubuntu/Debian: sudo apt-get install libraqm-dev
    #   macOS: brew install libraqm
    #   Fedora: sudo dnf install libraqm-devel
    # This enables proper rendering of Arabic, Devanagari, Tibetan, Thai, etc.
    #
    # NOTE: augraphy's numba dependency has Python version conflicts.
    # We override with modern versions that support Python 3.12+
    "numba>=0.60.0",        # Numba JIT (Python 3.12+ compatible)
    "llvmlite>=0.43.0",     # LLVM bindings (Python 3.12+ compatible)
    "augraphy>=8.0.0",      # Document degradation/augmentation
    "datasets>=3.6.0",      # HuggingFace datasets for OpenLID-v2 corpus
    "scikit-image>=0.25.2",
    "albumentations>=2.0.8",
]

[project.scripts]
imgprep = "image_preprocessing_detector.cli:cli"
# Annotation CLI (Phase 3 - dataset management and migrations)
annotate = "image_preprocessing_detector.annotation.cli:cli"

[tool.uv]
# Ensure compatibility with Linux systems by resolving to compatible wheels
constraint-dependencies = ["av<16.0.0; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_preprocessing_detector"]

# Ruff Configuration - Consolidated Linting & Formatting
# Replaces: Black (formatting), pydocstyle (docstrings), partial Bandit (security)
# Keeps: MyPy (type checking), interrogate (coverage), Bandit (advanced security)
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".claude",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "validation",
    "tmp_cleanup",
    "notebooks",
    # Root-level one-off diagnostic/test scripts (not part of main codebase)
    "test_maniqa_*.py",
    "generate_architecture_diagram.py",
]

# Enable Ruff formatter (Black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "D",    # pydocstyle - REPLACES pydocstyle hook
    "S",    # flake8-bandit - SUPPLEMENTS Bandit
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "PIE",  # flake8-pie
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PERF", # Performance anti-patterns (inefficient loops, list comprehensions)
    "FURB", # Refurb - modernization suggestions (pathlib usage)
    "LOG",  # Logging best practices (proper formatting, level usage)
    "TRY",  # Exception handling best practices
    "ERA",  # Commented-out code detection (finds dead code)
    "FBT",  # Boolean trap detection (avoid bool positional args)
    "ASYNC",# Async/await best practices
]

ignore = [
    # Formatting (handled by Ruff formatter)
    "E501",  # line too long
    "W191",  # indentation contains tabs
    "D206",  # indent with spaces
    "Q000",  # bad quotes inline
    "Q001",  # bad quotes multiline
    "Q002",  # bad quotes docstring
    "COM812", # missing trailing comma
    "ISC001", # implicit string concatenation

    # Complexity
    "C901",  # too complex

    # Docstring (Google style)
    "D203",  # one-blank-line-before-class
    "D212",  # multi-line-docstring-summary-first-line

    # Practical exceptions
    "B008",  # function calls in defaults (Pydantic/Click)
    "S101",  # assert (pytest uses assert)
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "PTH123", # open() pathlib (not always practical)

    # New rules - practical exceptions
    "FBT001", # Boolean positional arg (OK for CLI tools like Click)
    "FBT002", # Boolean default arg (OK for config)
    "TRY003", # Long exception messages (OK for detailed errors)
]

# Pydocstyle configuration
[tool.ruff.lint.pydocstyle]
convention = "google"

# isort configuration
[tool.ruff.lint.isort]
known-first-party = ["image_preprocessing_detector"]
known-local-folder = ["validation", "benchmarks"]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
# Annotation module - protocol-compliant method signatures have intentionally unused args
"src/image_preprocessing_detector/annotation/parsers/**/*.py" = ["ARG002", "RUF012", "ERA001", "RUF059", "PIE810", "SIM102", "B007", "TRY300"]
"src/image_preprocessing_detector/annotation/enrichment/**/*.py" = ["ARG002", "TRY300"]
"src/image_preprocessing_detector/annotation/workflow/**/*.py" = ["ARG001", "ARG002"]
"src/image_preprocessing_detector/annotation/schemas/validators.py" = ["PERF401", "SIM102"]
"tests/**/*.py" = ["ARG", "D", "S", "ERA", "E402", "F841", "RUF059", "RUF005", "DTZ001", "T201", "PT011", "TRY301", "RET504", "PT006", "SIM105", "B007", "PTH", "SIM102", "SIM117", "TRY300", "N806", "PT018", "B905", "PERF402", "E741", "B904", "FBT003", "PT028", "RUF022", "PERF102", "B028", "SIM115"]
"tests/fixtures/phase1_validation/*.py" = ["D", "T20", "TRY", "RUF", "FBT", "RET", "N806", "PERF"]  # Phase 1 validation scripts - relaxed rules
"fuzz/**/*.py" = ["D", "T20"]
"validation/**/*.py" = ["D", "T20", "TRY"]
"scripts/**/*.py" = ["D", "T20", "TRY", "S", "PTH", "SIM", "DTZ", "ARG", "B007", "RUF059", "F841", "RUF002", "RET504", "RUF001", "C401", "RUF013", "RUF012", "PERF102", "E402", "I001", "N806", "B904", "B905", "FBT003", "B028", "ERA001", "E741", "C416", "PERF401", "PT028"]
"benchmarks/**/*.py" = ["D", "T20", "ARG", "TRY", "ERA", "SIM", "PERF", "RET", "B007", "F841", "RUF005", "RUF012", "E402", "UP038"]  # CLI tools with relaxed rules
"tools/**/*.py" = ["D", "T20", "TRY"]
"modal/**/*.py" = ["D", "T20", "S", "ANN", "PTH", "SIM", "DTZ003", "DTZ005", "TRY300", "TRY400", "B905", "PERF203", "PERF401", "PT028", "ARG001", "B007", "F841", "N812", "RUF013", "RUF059"]
"data/**/*.py" = ["D", "T20", "F401", "F841", "ERA001", "ARG005", "E741", "DTZ003", "S314", "PERF203", "SIM102", "B004", "B905", "RUF059"]
"noxfile.py" = ["D", "T20"]
"src/image_preprocessing_detector/utils/logging.py" = ["A005"]  # Module intentionally shadows stdlib
"src/image_preprocessing_detector/augmentation/genalog_degrader.py" = ["ERA001"]  # Intentional Phase 2 implementation placeholders
# Security validation test file with intentional vulnerabilities for CodeQL testing
"tests/security/test_codeql_validation.py" = ["ALL"]
"src/image_preprocessing_detector/utils/gcs_uploader.py" = ["T20", "F821"]  # GCS utilities with relaxed print rules
"src/image_preprocessing_detector/utils/metadata_generator.py" = ["T20", "S", "PTH", "UP038", "TRY"]  # Metadata generator with relaxed rules
# Phase 6/8 merged files with relaxed rules
"src/image_preprocessing_detector/detection/advanced_detectors.py" = ["D102", "E741", "N806", "B905", "SIM115", "RUF059", "B028", "SIM102", "FBT003"]
"src/image_preprocessing_detector/detection/__init__.py" = ["RUF022"]
"src/image_preprocessing_detector/ingestion/__init__.py" = ["RUF022"]
# Files with __main__ blocks - T201 (print) used for CLI examples
"src/image_preprocessing_detector/classification/pdf_image_detector.py" = ["T201"]
"src/image_preprocessing_detector/classification/pdf_text_extractor.py" = ["T201"]
"src/image_preprocessing_detector/classification/pdf_type_classifier.py" = ["T201"]
"src/image_preprocessing_detector/detection/text_gate.py" = ["T201"]
"src/image_preprocessing_detector/ingestion/image_loader.py" = ["T201", "A002"]  # format parameter shadows builtin (intentional API)
"src/image_preprocessing_detector/ingestion/pdf_loader.py" = ["T201", "S110", "RUF001"]  # CLI example, DPI fallback, Unicode × symbol
# Webhook/alerting files - legitimate URL usage
"src/image_preprocessing_detector/drift/alerting.py" = ["S310", "ERA001"]  # Webhook URLs validated, nosemgrep comments
# Logging files - sampling (not crypto)
"src/image_preprocessing_detector/logging/__init__.py" = ["S311"]  # Random for sampling, not crypto
"src/image_preprocessing_detector/logging/outcomes.py" = ["S311"]  # Random for sampling, not crypto
"src/image_preprocessing_detector/logging/errors.py" = ["S110"]  # Sentry optional, silent failure OK
# Model files - PyTorch conventions
"src/image_preprocessing_detector/models/loss_functions.py" = ["N812"]  # F alias is PyTorch convention
"src/image_preprocessing_detector/models/model_optimizer.py" = ["F401"]  # pycuda.autoinit availability check
# Compatibility layer
"src/image_preprocessing_detector/utils/datetime_compat.py" = ["N811", "UP017"]  # Python <3.11 compat
# Schema - example path in docstring
"src/image_preprocessing_detector/schema.py" = ["S108"]  # Example path in docstring
# Office processor - availability check
"src/image_preprocessing_detector/ingestion/office_processor.py" = ["F401"]  # docling availability check
# Synthetic module - random used for sample selection (not crypto), font loading patterns
"src/image_preprocessing_detector/synthetic/*.py" = ["S311", "TRY300", "TRY400", "ERA001"]

# Bandit Configuration (Security Linting)
[tool.bandit]
skips = [
    "B101",  # Skip assert_used - standard pytest practice, not a security issue
    "B110",  # Skip try_except_pass - used for optional functionality (git info)
    "B311",  # Skip random - used only for non-security backoff jitter
    "B404",  # Skip subprocess import - controlled git commands only
    "B603",  # Skip subprocess call - controlled git/nvidia-smi commands only
    "B607",  # Skip partial path - controlled git/nvidia-smi commands only
]
exclude_dirs = [
    "test_maniqa_inference.py",
    "test_maniqa_loading.py",
]

# MyPy Configuration
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "data.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false

# Phase 2+ modules - relaxed type checking until ML dependencies added
[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.gcs_uploader"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.metadata_generator"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.augmentation.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

# Phase 6/8 merged modules - relaxed until API compatibility resolved
[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.hybrid_iqa"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.advanced_detectors"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.layout_lite.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.orientation_detector"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.ingestion.office_processor"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.ingestion.document_processor"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.output.json_generator"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.budget_enforcement"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.doclayout_yolo"
ignore_errors = true

[[tool.mypy.overrides]]
module = "generate_architecture_diagram"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.labeling.quantization.pipeline"
ignore_errors = true

# Annotation module uses datetime.UTC (Python 3.11+) which mypy stubs may not recognize
[[tool.mypy.overrides]]
module = "image_preprocessing_detector.annotation.integrity.checkpointing"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.annotation.schemas.migrations"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.annotation.workflow.pipeline"
disable_error_code = ["attr-defined"]

# BasedPyright Configuration (Modern Type Checker)
# Replaces MyPy for primary type checking (3-5x faster, stricter)
# Documentation: https://docs.basedpyright.com
[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
exclude = [
    "**/tests/**",
    "**/validation/**",
    "**/benchmarks/**",
    "**/scripts/**",
    "**/modal/**",
    "**/fuzz/**",
    "**/notebooks/**",
    "**/tmp_cleanup/**",
    "**/__pycache__/**",
    "**/build/**",
    "**/dist/**",
    "**/.venv/**",
]

# Vulture Configuration (Dead Code Detection)
# Documentation: https://github.com/jendrikseipp/vulture
[tool.vulture]
min_confidence = 80
paths = ["src/"]
exclude = [
    "tests/",
    "validation/",
    "benchmarks/",
    "scripts/",
    "modal/",
    "fuzz/",
    "notebooks/",
    "tmp_cleanup/",
]
# Whitelist file for false positives (create if needed)
# whitelist = ".vulture_whitelist.py"

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src", "benchmarks", "scripts"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default addopts optimized for LOCAL development speed:
# - Skip slow/benchmark tests by default (-m "not (slow or benchmark)")
# - Coverage enabled (parallel + coverage is slower due to merge overhead)
# CI overrides with: -m "" to run ALL tests including slow/benchmark
# For fast parallel runs WITHOUT coverage: pytest -n auto --no-cov -m ""
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not (slow or benchmark)",
    "--cov=src/image_preprocessing_detector",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmark tests (comprehensive performance tests)",
    "performance: marks tests as performance/latency tests (run with '-m performance')",
    "requires_full_dataset: marks tests requiring full datasets (88+ GB, skip in CI)",
    "real_data: marks tests using real test fixtures (not synthetic)",
    "e2e: marks tests as end-to-end tests (full pipeline, real components)",
    "e2e_annotation: marks annotation system E2E tests (Phase 6.1)",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src/image_preprocessing_detector"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "scripts/*",  # Exclude utility scripts (not production code)
    "benchmarks/*",  # Exclude benchmarking framework (not production code)
    "validation/*",  # Exclude standalone validation scripts
    "data/*",  # Exclude data processing scripts
    # CLI - tested via integration but excluded from unit coverage
    "src/image_preprocessing_detector/cli.py",
    # Annotation CLI - tested via integration but excluded from unit coverage
    "src/image_preprocessing_detector/annotation/cli.py",
    # Annotation monitoring infrastructure (requires Prometheus setup)
    "src/image_preprocessing_detector/annotation/monitoring/*",
    # Phase 6: layout_lite - needs tests (TODO: create tests using existing fixtures)
    "src/image_preprocessing_detector/detection/layout_lite/*",
    # Phase 8: document_processor - not yet implemented
    "src/image_preprocessing_detector/ingestion/document_processor.py",
    # Phase 2+ utilities (require GCS/cloud dependencies)
    "src/image_preprocessing_detector/utils/gcs_uploader.py",
    "src/image_preprocessing_detector/utils/metadata_generator.py",
    # Augmentation (requires genalog, has dependency conflicts)
    "src/image_preprocessing_detector/augmentation/*",
    # Training modules (require PyTorch, tested separately with ml dependencies)
    "src/image_preprocessing_detector/training/*",
    "src/image_preprocessing_detector/datasets/*",
    # PyTorch model definitions (require torch, tested with ml dependencies)
    "src/image_preprocessing_detector/models/resnet_student.py",
    "src/image_preprocessing_detector/models/resnet_teacher.py",
    "src/image_preprocessing_detector/models/loss_functions.py",
    # Routing (Phase 8, needs implementation)
    "src/image_preprocessing_detector/routing/*",
    # Models (require PyTorch, tested separately with ml dependencies)
    "src/image_preprocessing_detector/models/*",
    # Core config (configuration scaffolding, not critical for coverage)
    "src/image_preprocessing_detector/core/*",
    # Phase 9: Budget enforcement (not yet implemented, requires cloud infrastructure)
    "src/image_preprocessing_detector/utils/budget_enforcement.py",
    # Phase 4: Advanced detectors (future enhancement, basic IQA sufficient for MVP)
    "src/image_preprocessing_detector/detection/advanced_detectors.py",
    # Phase 6: Hybrid IQA (requires DocLayout-YOLO, not yet implemented)
    "src/image_preprocessing_detector/detection/hybrid_iqa.py",
    # Standalone tools and scripts (not core library, tested separately if needed)
    "generate_architecture_diagram.py",
    "tools/validate_front_matter.py",
    # Labeling arena tools (standalone CLI tools, require external dependencies)
    "src/image_preprocessing_detector/labeling/arena/cli.py",
    "src/image_preprocessing_detector/labeling/arena/leaderboard.py",
    "src/image_preprocessing_detector/labeling/arena/runner.py",
    # Labeling arena inference backends (require external services/models)
    "src/image_preprocessing_detector/labeling/arena/inference/api.py",
    "src/image_preprocessing_detector/labeling/arena/inference/huggingface.py",
    "src/image_preprocessing_detector/labeling/arena/inference/local.py",
    "src/image_preprocessing_detector/labeling/arena/inference/regression.py",
    # Labeling finetuning (require PyTorch/Modal, tested separately with ml dependencies)
    "src/image_preprocessing_detector/labeling/finetuning/trainer.py",
    "src/image_preprocessing_detector/labeling/finetuning/stages/*",
    # Quantization pipeline (standalone tool, require PyTorch)
    "src/image_preprocessing_detector/labeling/quantization/pipeline.py",
    # DeQA inference engines (require PyTorch/transformers, tested separately with ml dependencies)
    "src/image_preprocessing_detector/labeling/deqa/specialist.py",
    "src/image_preprocessing_detector/labeling/deqa/ensemble.py",
    "src/image_preprocessing_detector/labeling/deqa/vl_single.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

# Interrogate Configuration (Docstring Coverage)
[tool.interrogate]
verbose = 1
fail-under = 85
exclude = ["tests", "docs", "build", "dist", "validation", "tmp_cleanup"]
ignore-init-method = true
ignore-init-module = true
color = true

# Mutation Testing Configuration (mutmut)
[tool.mutmut]
paths_to_mutate = "src/"
backup = false
runner = "uv run pytest -x --assert=plain -o addopts=''"
tests_dir = "tests/"
# Mutation score threshold: percentage of mutations that must be killed
# Score below 80% indicates weak test coverage
dict_synonyms = "Struct, NamedStruct"

[tool.uv.sources]
byronwilliamscpa-gemini-image = { git = "https://github.com/ByronWilliamsCPA/python-libs.git", subdirectory = "packages/gemini-image" }

[dependency-groups]
dev = [
    "byronwilliamscpa-gemini-image",
    "kaggle>=1.7.4.5",
    "mkdocs-kroki-plugin>=1.1.0",
]
