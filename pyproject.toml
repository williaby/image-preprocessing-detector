[project]
name = "image-preprocessing-detector"
version = "0.1.0"
description = "Intelligent image preprocessing detection system for RAG applications"
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
keywords = ["image-processing", "opencv", "document-analysis", "ocr-preprocessing", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core Image Processing
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # PDF Processing
    "pymupdf>=1.23.0",
    # CLI
    "click>=8.1.0",
    # Serverless GPU Compute (Phase 2+)
    "modal>=0.63.0",
    # Deep Learning (placeholder - will add specific versions after testing)
    # "torch>=2.0.0",
    # "torchvision>=0.15.0",
    # "ultralytics>=8.0.0",
    # "timm>=0.9.0",
    # Data Augmentation
    # "albumentations>=1.3.0",
    # OCR (for secondary analysis)
    # "pytesseract>=0.3.10",
    # Inference Optimization (will add in Phase 2/3)
    # "onnxruntime>=1.15.0",
    # API Framework (will add in Phase 4)
    # "fastapi>=0.100.0",
    # "uvicorn[standard]>=0.23.0",
    # "pydantic>=2.0.0",
    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "rich>=13.5.0",
    "opencv-python-headless (>=4.8.0,<5.0.0)",
    "huggingface-hub[cli] (>=1.1.4,<2.0.0)",
    # pytesseract removed - not needed for Phase 1, will add back in Phase 2 for OCR analysis
    # "pytesseract (>=0.3.13,<0.4.0)",
    "gitpython (>=3.1.45,<4.0.0)",
    "pywavelets (>=1.4.0)",
    "onnxruntime-gpu (>=1.23.2,<2.0.0)",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.82.0",

    # Code Quality
    "ruff>=0.9.0,<1.0.0",  # Equivalent to ^0.9.0 in Poetry (PEP 508 syntax)
    "mypy>=1.4.0",  # Legacy type checker (kept for reference)
    "basedpyright>=1.18.0",  # Modern type checker (strict, 3-5x faster than mypy)
    "vulture>=2.11",  # Dead code detection
    "interrogate>=1.7.0",  # Docstring coverage checker
    "types-pyyaml>=6.0.0",  # Type stubs for PyYAML

    # Pre-commit
    "pre-commit>=3.3.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-gen-files>=0.5.0",
    "griffe-pydantic>=0.2.0",

    # Front matter validation tools
    "python-frontmatter>=1.1",
    "ruamel.yaml>=0.18.0",

    # Jupyter (for exploration)
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",

    # Manual validation UI (Milestone 10.3)
    "streamlit>=1.28.0",

    # Image metrics for benchmarking
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",  # ML utilities for metrics and evaluation
    "scipy>=1.14.0",  # v1.14.x supports Python 3.10-3.12

    # Safety for dependency scanning
    "safety>=3.7.0",

    # Nox for multi-version testing
    "nox>=2025.10.16",
    "uv>=0.5.0",  # Fast package manager for nox venv backend

    # Mutation testing
    "mutmut>=3.3.1",

    # Type stubs
    "types-pyyaml>=6.0.12",

    # ONNX for model export validation
    "onnx>=1.14.0",

    # Matplotlib for visualization
    "matplotlib>=3.10.0",

    # Dataset management
    "datasets>=4.4.1",
    "dvc[ssh]>=3.64.0",
    "kaggle>=1.7.4",
]

ml = [
    # Machine Learning Dependencies (install separately for Phase 2/3)
    "torch>=2.9.0",  # Updated to address GHSA-887c-mr87-cxwp (CVE-2025-3730)
    "torchvision>=0.24.0",  # Compatible with torch 2.9.0
    "doclayout-yolo",  # DocLayout-YOLO (YOLOv10-based) for Phase 3 layout detection
    "ultralytics>=8.0.0",  # YOLOv8 for Phase 6 layout-lite (lightweight)
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "onnxruntime>=1.15.0",
    "tensorboard>=2.12.0",  # Training monitoring
    # "genalog>=0.1.0",  # DISABLED: Conflicts with dev dependencies
    # Model artifact storage and versioning
    "google-cloud-storage>=2.10.0",
    "huggingface-hub>=0.20.0",
    "pyyaml>=6.0",
]

api = [
    # API Dependencies (install for Phase 4)
    "fastapi>=0.115.0",  # Updated to address PVE-2024-64930 (ReDoS vulnerability)
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.18",  # Updated to address CVE-2024-53981 and PVE-2024-99762
    "starlette>=0.49.1",  # Updated to address GHSA-7f5h-v6xp-fcq8 (O(n^2) DoS)
]

colab = [
    # Google Colab Training Dependencies (Phase 2-3)
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "doclayout-yolo",  # DocLayout-YOLO (YOLOv10-based) for Phase 3 layout detection
    "ultralytics>=8.0.0",  # YOLOv8 for Phase 6 layout-lite (lightweight)
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "onnxruntime>=1.15.0",
    "tensorboard>=2.12.0",  # Training monitoring
    "pyyaml>=6.0",          # Config file parsing
    "gdown>=4.7.0",         # Download from Google Drive
    "onnx>=1.17.0",         # ONNX model verification (CVE-2024-7776 fixed in 1.17.0)
]

[project.scripts]
imgprep = "image_preprocessing_detector.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_preprocessing_detector", "benchmarks"]

# Ruff Configuration - Consolidated Linting & Formatting
# Replaces: Black (formatting), pydocstyle (docstrings), partial Bandit (security)
# Keeps: MyPy (type checking), interrogate (coverage), Bandit (advanced security)
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".claude",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "validation",
    "tmp_cleanup",
    "notebooks",
]

# Enable Ruff formatter (Black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "D",    # pydocstyle - REPLACES pydocstyle hook
    "S",    # flake8-bandit - SUPPLEMENTS Bandit
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "PIE",  # flake8-pie
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PERF", # Performance anti-patterns (inefficient loops, list comprehensions)
    "FURB", # Refurb - modernization suggestions (pathlib usage)
    "LOG",  # Logging best practices (proper formatting, level usage)
    "TRY",  # Exception handling best practices
    "ERA",  # Commented-out code detection (finds dead code)
    "FBT",  # Boolean trap detection (avoid bool positional args)
    "ASYNC",# Async/await best practices
]

ignore = [
    # Formatting (handled by Ruff formatter)
    "E501",  # line too long
    "W191",  # indentation contains tabs
    "D206",  # indent with spaces
    "Q000",  # bad quotes inline
    "Q001",  # bad quotes multiline
    "Q002",  # bad quotes docstring
    "COM812", # missing trailing comma
    "ISC001", # implicit string concatenation

    # Complexity
    "C901",  # too complex

    # Docstring (Google style)
    "D203",  # one-blank-line-before-class
    "D212",  # multi-line-docstring-summary-first-line

    # Practical exceptions
    "B008",  # function calls in defaults (Pydantic/Click)
    "S101",  # assert (pytest uses assert)
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "PTH123", # open() pathlib (not always practical)

    # New rules - practical exceptions
    "FBT001", # Boolean positional arg (OK for CLI tools like Click)
    "FBT002", # Boolean default arg (OK for config)
    "TRY003", # Long exception messages (OK for detailed errors)
]

# Pydocstyle configuration
[tool.ruff.lint.pydocstyle]
convention = "google"

# isort configuration
[tool.ruff.lint.isort]
known-first-party = ["image_preprocessing_detector"]
known-local-folder = ["validation", "benchmarks"]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*.py" = ["ARG", "D", "S", "ERA", "E402", "F841", "RUF059", "RUF005", "DTZ001", "T201", "PT011", "TRY301", "RET504", "PT006", "SIM105", "B007", "PTH", "SIM102", "SIM117", "TRY300", "N806", "PT018", "B905", "PERF402", "E741", "B904", "FBT003", "PT028", "RUF022", "PERF102", "B028", "SIM115"]
"tests/fixtures/phase1_validation/*.py" = ["D", "T20", "TRY", "RUF", "FBT", "RET", "N806", "PERF"]  # Phase 1 validation scripts - relaxed rules
"fuzz/**/*.py" = ["D", "T20"]
"validation/**/*.py" = ["D", "T20", "TRY"]
"scripts/**/*.py" = ["D", "T20", "TRY", "S", "PTH", "SIM", "DTZ", "ARG", "B007", "RUF059", "F841", "RUF002", "RET504", "RUF001", "C401", "RUF013", "RUF012", "PERF102", "E402", "I001", "N806", "B904", "B905", "FBT003", "B028", "ERA001", "E741"]
"benchmarks/**/*.py" = ["D", "T20", "ARG", "TRY", "ERA", "SIM", "PERF", "RET", "B007", "F841", "RUF005", "RUF012", "E402", "UP038"]  # CLI tools with relaxed rules
"tools/**/*.py" = ["D", "T20", "TRY"]
"modal/**/*.py" = ["D", "T20", "S", "ANN", "PTH", "SIM", "DTZ003", "TRY300", "B905", "PERF203", "PT028"]
"data/**/*.py" = ["D", "T20", "F401", "F841", "ERA001", "ARG005", "E741", "DTZ003", "S314", "PERF203", "SIM102", "B004", "B905", "RUF059"]
"noxfile.py" = ["D", "T20"]
"src/image_preprocessing_detector/utils/logging.py" = ["A005"]  # Module intentionally shadows stdlib
"src/image_preprocessing_detector/augmentation/genalog_degrader.py" = ["ERA001"]  # Intentional Phase 2 implementation placeholders
# Security validation test file with intentional vulnerabilities for CodeQL testing
"tests/security/test_codeql_validation.py" = ["ALL"]
"src/image_preprocessing_detector/utils/gcs_uploader.py" = ["T20", "F821"]  # GCS utilities with relaxed print rules
"src/image_preprocessing_detector/utils/metadata_generator.py" = ["T20", "S", "PTH", "UP038", "TRY"]  # Metadata generator with relaxed rules
# Phase 6/8 merged files with relaxed rules
"src/image_preprocessing_detector/detection/advanced_detectors.py" = ["D102", "E741", "N806", "B905", "SIM115", "RUF059", "B028", "SIM102", "FBT003"]
"src/image_preprocessing_detector/detection/__init__.py" = ["RUF022"]
"src/image_preprocessing_detector/ingestion/__init__.py" = ["RUF022"]

# Bandit Configuration (Security Linting)
[tool.bandit]
skips = ["B101"]  # Skip assert_used - standard pytest practice, not a security issue

# MyPy Configuration
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "data.*"
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false

# Phase 2+ modules - relaxed type checking until ML dependencies added
[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.gcs_uploader"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.metadata_generator"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.augmentation.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

# Phase 6/8 merged modules - relaxed until API compatibility resolved
[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.hybrid_iqa"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.advanced_detectors"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.layout_lite.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.orientation_detector"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.ingestion.office_processor"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.ingestion.document_processor"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.output.json_generator"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.utils.budget_enforcement"
ignore_errors = true

[[tool.mypy.overrides]]
module = "image_preprocessing_detector.detection.doclayout_yolo"
ignore_errors = true

# BasedPyright Configuration (Modern Type Checker)
# Replaces MyPy for primary type checking (3-5x faster, stricter)
# Documentation: https://docs.basedpyright.com
[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportMissingParameterType = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
exclude = [
    "**/tests/**",
    "**/validation/**",
    "**/benchmarks/**",
    "**/scripts/**",
    "**/modal/**",
    "**/fuzz/**",
    "**/notebooks/**",
    "**/tmp_cleanup/**",
    "**/__pycache__/**",
    "**/build/**",
    "**/dist/**",
    "**/.venv/**",
]

# Vulture Configuration (Dead Code Detection)
# Documentation: https://github.com/jendrikseipp/vulture
[tool.vulture]
min_confidence = 80
paths = ["src/"]
exclude = [
    "tests/",
    "validation/",
    "benchmarks/",
    "scripts/",
    "modal/",
    "fuzz/",
    "notebooks/",
    "tmp_cleanup/",
]
# Whitelist file for false positives (create if needed)
# whitelist = ".vulture_whitelist.py"

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "src", "benchmarks"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default addopts optimized for LOCAL development speed:
# - Skip slow/benchmark tests by default (-m "not (slow or benchmark)")
# - Coverage enabled (parallel + coverage is slower due to merge overhead)
# CI overrides with: -m "" to run ALL tests including slow/benchmark
# For fast parallel runs WITHOUT coverage: pytest -n auto --no-cov -m ""
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not (slow or benchmark)",
    "--cov=src/image_preprocessing_detector",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=79",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmark tests (comprehensive performance tests)",
    "performance: marks tests as performance/latency tests (run with '-m performance')",
    "requires_full_dataset: marks tests requiring full datasets (88+ GB, skip in CI)",
    "real_data: marks tests using real test fixtures (not synthetic)",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "validation/*",  # Exclude standalone validation scripts
    "benchmarks/*",  # Exclude benchmarking framework
    "data/*",  # Exclude data processing scripts
    # CLI - tested via integration but excluded from unit coverage
    "src/image_preprocessing_detector/cli.py",
    # Phase 6: layout_lite - needs tests (TODO: create tests using existing fixtures)
    "src/image_preprocessing_detector/detection/layout_lite/*",
    # Phase 8: document_processor - not yet implemented
    "src/image_preprocessing_detector/ingestion/document_processor.py",
    # Phase 2+ utilities (require GCS/cloud dependencies)
    "src/image_preprocessing_detector/utils/gcs_uploader.py",
    "src/image_preprocessing_detector/utils/metadata_generator.py",
    # Augmentation (requires genalog, has dependency conflicts)
    "src/image_preprocessing_detector/augmentation/*",
    # Training modules (require PyTorch, tested separately with ml dependencies)
    "src/image_preprocessing_detector/training/*",
    "src/image_preprocessing_detector/datasets/*",
    # PyTorch model definitions (require torch, tested with ml dependencies)
    "src/image_preprocessing_detector/models/resnet_student.py",
    "src/image_preprocessing_detector/models/resnet_teacher.py",
    "src/image_preprocessing_detector/models/loss_functions.py",
    # Routing (Phase 8, needs implementation)
    "src/image_preprocessing_detector/routing/*",
    # Models (require PyTorch, tested separately with ml dependencies)
    "src/image_preprocessing_detector/models/*",
    # Core config (configuration scaffolding, not critical for coverage)
    "src/image_preprocessing_detector/core/*",
    # Phase 9: Budget enforcement (not yet implemented, requires cloud infrastructure)
    "src/image_preprocessing_detector/utils/budget_enforcement.py",
    # Phase 4: Advanced detectors (future enhancement, basic IQA sufficient for MVP)
    "src/image_preprocessing_detector/detection/advanced_detectors.py",
    # Phase 6: Hybrid IQA (requires DocLayout-YOLO, not yet implemented)
    "src/image_preprocessing_detector/detection/hybrid_iqa.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

# Interrogate Configuration (Docstring Coverage)
[tool.interrogate]
verbose = 1
fail-under = 85
exclude = ["tests", "docs", "build", "dist", "validation", "tmp_cleanup"]
ignore-init-method = true
ignore-init-module = true
color = true

# Mutation Testing Configuration (mutmut)
[tool.mutmut]
paths_to_mutate = "src/"
backup = false
runner = "uv run pytest -x --assert=plain -o addopts=''"
tests_dir = "tests/"
# Mutation score threshold: percentage of mutations that must be killed
# Score below 80% indicates weak test coverage
dict_synonyms = "Struct, NamedStruct"
