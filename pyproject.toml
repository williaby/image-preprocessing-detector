[project]
name = "image-preprocessing-detector"
version = "0.1.0"
description = "Intelligent image preprocessing detection system for RAG applications"
authors = [
    {name = "Byron Williams", email = "byronawilliams@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["image-processing", "opencv", "document-analysis", "ocr-preprocessing", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core Image Processing
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",

    # PDF Processing
    "pymupdf>=1.23.0",

    # CLI
    "click>=8.1.0",

    # Deep Learning (placeholder - will add specific versions after testing)
    # "torch>=2.0.0",
    # "torchvision>=0.15.0",
    # "ultralytics>=8.0.0",
    # "timm>=0.9.0",

    # Data Augmentation
    # "albumentations>=1.3.0",

    # OCR (for secondary analysis)
    # "pytesseract>=0.3.10",

    # Inference Optimization (will add in Phase 2/3)
    # "onnxruntime>=1.15.0",

    # API Framework (will add in Phase 4)
    # "fastapi>=0.100.0",
    # "uvicorn[standard]>=0.23.0",
    # "pydantic>=2.0.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "rich>=13.5.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.82.0",

    # Code Quality
    "black>=24.3.0",  # Updated to address CVE-2024-21503 (ReDoS vulnerability)
    "ruff>=0.9.0,<1.0.0",  # Equivalent to ^0.9.0 in Poetry (PEP 508 syntax)
    "mypy>=1.4.0",

    # Pre-commit
    "pre-commit>=3.3.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
    "python-frontmatter>=1.1.0",

    # Jupyter (for exploration)
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

ml = [
    # Machine Learning Dependencies (install separately for Phase 2/3)
    "torch>=2.9.0",  # Updated to address GHSA-887c-mr87-cxwp (CVE-2025-3730)
    "torchvision>=0.24.0",  # Compatible with torch 2.9.0
    "ultralytics>=8.0.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "onnxruntime>=1.15.0",
]

api = [
    # API Dependencies (install for Phase 4)
    "fastapi>=0.115.0",  # Updated to address PVE-2024-64930 (ReDoS vulnerability)
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.18",  # Updated to address CVE-2024-53981 and PVE-2024-99762
    "starlette>=0.49.1",  # Updated to address GHSA-7f5h-v6xp-fcq8 (O(n^2) DoS)
]

[project.scripts]
imgprep = "image_preprocessing_detector.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "image-preprocessing-detector"
version = "0.1.0"
description = "Intelligent image preprocessing detection system for RAG applications"
authors = ["Byron Williams <byronawilliams@gmail.com>"]
readme = "README.md"
packages = [{include = "image_preprocessing_detector", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"  # Constrained by triton dependency for torch 2.9.0
opencv-python-headless = "^4.8.0"
pillow = "^10.0.0"
numpy = "^1.24.0"
pymupdf = "^1.23.0"
click = "^8.1.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
structlog = "^23.1.0"
rich = "^13.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-xdist = "^3.3.0"
hypothesis = "^6.82.0"
black = ">=24.3.0"
ruff = "^0.9.0"
mypy = "^1.4.0"
pre-commit = "^3.3.0"
# Documentation
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = "^0.26.0"}
griffe-pydantic = "^1.1.0"
mkdocs-gen-files = "^0.5.0"
mkdocs-section-index = "^0.3.0"
mkdocs-autorefs = "^1.2.0"
mkdocs-git-revision-date-localized-plugin = "^1.3.0"
python-frontmatter = "^1.1.0"
ruamel-yaml = "^0.18.0"
pydocstyle = "^6.3.0"
interrogate = "^1.7.0"
# Development Tools
jupyter = "^1.0.0"
ipykernel = "^6.25.0"
matplotlib = "^3.10.7"
datasets = "^4.4.1"
safety = "^3.7.0"
nox = "^2025.10.16"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = "^2.9.0"  # Updated to address GHSA-887c-mr87-cxwp (CVE-2025-3730)
torchvision = "^0.24.0"  # Compatible with torch 2.9.0
ultralytics = "^8.0.0"
timm = "^0.9.0"
albumentations = "^1.3.0"
onnxruntime = "^1.15.0"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = "^0.120.1"  # Updated to address PVE-2024-64930 (ReDoS vulnerability)
uvicorn = {extras = ["standard"], version = "^0.23.0"}
python-multipart = "^0.0.18"  # Updated to address CVE-2024-53981 and PVE-2024-99762
starlette = "^0.49.1"  # Updated to address GHSA-7f5h-v6xp-fcq8 (O(n^2) DoS via Range header)

# Black Configuration
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff Configuration
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ARG"]  # unused arguments in tests

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/image_preprocessing_detector",
    "--cov-report=html",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage Configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "validation/*",  # Exclude standalone validation scripts
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

# Pydocstyle Configuration
[tool.pydocstyle]
convention = "google"
match = "(?!(test_)).*\\.py"
add-ignore = ["D105", "D107", "D212"]  # Ignore magic methods, __init__ docstrings, and D212 (Google style uses D213)

# Interrogate Configuration (Docstring Coverage)
[tool.interrogate]
verbose = 1
fail-under = 85
exclude = ["tests", "docs", "build", "dist", "validation", "tmp_cleanup"]
ignore-init-method = true
ignore-init-module = true
color = true
